# 自动检查：每次推送代码，在 GitHub 的电脑上跑类型检查、代码规范、全部测试和构建，不占服务器。
# Windows 上再跑一遍测试，提前发现只在 Windows 上才有的问题（电脑版用）。
name: 检查

on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: 检查和测试（Linux）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # 读取素材尺寸、时长的测试要用
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg
      - run: pnpm check
      - run: pnpm build

  windows:
    name: 测试（Windows）
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # 和电脑版安装包里同一个 ffprobe，读取素材尺寸、时长的测试要用
      - name: 下载 ffprobe
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath $env:RUNNER_TEMP/ff
          (Get-ChildItem $env:RUNNER_TEMP/ff -Recurse -Filter ffprobe.exe | Select-Object -First 1).DirectoryName >> $env:GITHUB_PATH
      - run: pnpm test
