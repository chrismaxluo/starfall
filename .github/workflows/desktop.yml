# 打包桌面版：在 GitHub 的 Windows 电脑上打出安装包，不占服务器。
#   推送 v 开头的版本标签（例如 v1.4.0-beta.1）→ 打包并上传到 GitHub 发布页（带 - 的是测试版，标成「预发布」）
#   在 Actions 页面手动运行 → 只打包，安装包在这次运行的页面下载（试打包用）
#   两种都会再连一下星临自己的备用下载地址（Cloudflare R2）：推送标签时上传安装包和服务器版代码包，手动运行时只试能不能上传
# 命名规则见 docs/desktop.md
name: 打包桌面版

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}

jobs:
  build:
    name: 打包 Windows 安装包
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # 不把有写权限的令牌留在 .git 里（安装依赖时运行的脚本读不到；上传发布时单独传进去）
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: 检查版本号（标签要和代码里的版本号一致）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          d=$(node -p "require('./apps/desktop/package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] && [ "$d" = "$v" ] || { echo "::error::标签 $GITHUB_REF_NAME、版本号 $v、桌面版版本号 $d 不一致"; exit 1; }

      - name: 构建管理后台和特效页
        run: pnpm build

      - name: 安装打包工具
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund
        env:
          # electron-builder 会自己下载需要的 Electron，这里不用
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: 检查桌面版代码
        working-directory: apps/desktop
        run: npm run typecheck

      - name: 准备打包文件
        working-directory: apps/desktop
        run: npm run build

      - name: 安装运行时依赖
        working-directory: apps/desktop/stage
        # 按 apps/desktop/package-lock.json 锁定的版本装（准备打包文件时复制过来了）
        run: npm install --omit=dev --no-audit --no-fund

      - name: 打包
        working-directory: apps/desktop
        run: npx electron-builder --win --x64 --publish never

      - name: 保存安装包（在这次运行的页面可以下载）
        uses: actions/upload-artifact@v7
        with:
          name: Starfall-win-x64-${{ github.run_number }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml
            !apps/desktop/release/builder-*.yml
          if-no-files-found: error
          retention-days: 14

      - name: 上传到 GitHub 发布页
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          cd apps/desktop/release
          shopt -s nullglob
          # 安装包、差量更新用的 blockmap、自动更新查版本用的 latest.yml / beta.yml
          files=(*.exe *.exe.blockmap latest*.yml beta*.yml alpha*.yml)
          ls -la "${files[@]}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            pre=()
            [[ "$tag" == *-* ]] && pre=(--prerelease)
            gh release create "$tag" "${files[@]}" --verify-tag --title "$tag" --notes "星临 $tag。下载 Starfall-…-setup.exe 安装（Windows 10 / 11，64 位）。" "${pre[@]}"
          fi

  # 星临自己的备用下载地址（Cloudflare R2）：GitHub 连不上时，桌面版和服务器版从这里下载。
  # 推送版本标签时上传安装包和服务器版代码包；手动运行时只试一下能不能上传（不传安装包）
  r2:
    name: 上传到备用下载地址
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # 服务器版代码包要完整的历史和全部版本标签
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: 试一下能不能上传
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node apps/desktop/scripts/release-r2.mjs check

      - uses: actions/download-artifact@v8
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Starfall-win-x64-${{ github.run_number }}
          path: release

      - name: 打包服务器版代码（main 和全部版本标签）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git branch -f main origin/main
          git bundle create "$RUNNER_TEMP/starfall.bundle" main --tags
          git bundle verify -q "$RUNNER_TEMP/starfall.bundle"

      - name: 上传
        if: startsWith(github.ref, 'refs/tags/')
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node apps/desktop/scripts/release-r2.mjs publish "$GITHUB_REF_NAME" release "$RUNNER_TEMP/starfall.bundle"
