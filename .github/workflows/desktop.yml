# 打包电脑版：在 GitHub 的 Windows 电脑上打出安装包，不占服务器。
#   推送 v 开头的版本标签（例如 v1.4.0-beta.1）→ 打包并上传到 GitHub 发布页（带 - 的是测试版，标成「预发布」）
#   在 Actions 页面手动运行 → 只打包，安装包在这次运行的页面下载（试打包用）
# 命名规则见 docs/desktop.md
name: 打包电脑版

on:
  push:
    tags: ['v*']
    # 开发电脑版期间：推送这个分支就试打包一次（合并前删掉）
    branches: [feat/desktop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}

env:
  # 读取素材尺寸、时长用的 ffprobe（FFmpeg 官网推荐的 Windows 版，LGPL）
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip

jobs:
  build:
    name: 打包 Windows 安装包
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: 检查版本号（标签要和代码里的版本号一致）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          d=$(node -p "require('./apps/desktop/package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] && [ "$d" = "$v" ] || { echo "::error::标签 $GITHUB_REF_NAME、版本号 $v、电脑版版本号 $d 不一致"; exit 1; }

      - name: 构建管理后台和特效页
        run: pnpm build

      - name: 安装打包工具
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund
        env:
          # electron-builder 会自己下载需要的 Electron，这里不用
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: 检查电脑版代码
        working-directory: apps/desktop
        run: npm run typecheck

      - name: 准备打包文件
        working-directory: apps/desktop
        run: npm run build

      - name: 下载 ffprobe
        shell: pwsh
        run: |
          Invoke-WebRequest $env:FFMPEG_URL -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $bin = New-Item -ItemType Directory -Force apps/desktop/stage-res/bin
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName $bin
          Copy-Item (Get-ChildItem ff -Recurse -Filter LICENSE.txt | Select-Object -First 1).FullName (Join-Path $bin FFMPEG-LICENSE.txt)
          & (Join-Path $bin ffprobe.exe) -version | Select-Object -First 1

      - name: 安装运行时依赖
        working-directory: apps/desktop/stage
        run: npm install --omit=dev --no-package-lock --no-audit --no-fund

      - name: 打包
        working-directory: apps/desktop
        run: npx electron-builder --win --x64 --publish never

      - name: 保存安装包（在这次运行的页面可以下载）
        uses: actions/upload-artifact@v7
        with:
          name: Starfall-win-x64-${{ github.run_number }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml
          if-no-files-found: error
          retention-days: 14

      - name: 上传到 GitHub 发布页
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          cd apps/desktop/release
          files=(*.exe *.exe.blockmap *.yml)
          ls -la "${files[@]}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            pre=()
            [[ "$tag" == *-* ]] && pre=(--prerelease)
            gh release create "$tag" "${files[@]}" --verify-tag --title "$tag" --notes "星临 $tag。下载 Starfall-…-setup.exe 安装（Windows 10 / 11，64 位）。" "${pre[@]}"
          fi
