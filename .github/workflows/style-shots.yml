# 界面风格对比用：在 GitHub 的电脑上跑演示服务，把后台页面存成静态快照（服务器内存不够同时开演示服务和浏览器）。
# 只在 design/** 分支上运行，这个分支不合并进 dev。
name: 风格快照

on:
  push:
    branches: ['design/**']

permissions:
  contents: read

jobs:
  snap:
    name: 后台页面快照
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @starfall/admin --filter @starfall/overlay build
      - name: 启动演示服务
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          STARFALL_DATA="$RUNNER_TEMP/demo" STARFALL_PORT=17601 nohup node apps/server/src/cli/demo.ts > "$RUNNER_TEMP/demo.log" 2>&1 &
          for i in $(seq 1 60); do grep -q 后台密码 "$RUNNER_TEMP/demo.log" && break; sleep 1; done
          grep -q 后台密码 "$RUNNER_TEMP/demo.log"
      - name: 存快照
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y > /dev/null && npm i playwright-core@1.63.0 > /dev/null
          cd "$GITHUB_WORKSPACE"
          PW_DIR="$RUNNER_TEMP/pw" node design/tools/style-capture.mjs "$RUNNER_TEMP/demo.log" "$RUNNER_TEMP/snap" music music/rules rules chat settings
          cp -r apps/admin/dist "$RUNNER_TEMP/snap/dist"
      - uses: actions/upload-artifact@v7
        with:
          name: style-snapshots
          path: ${{ runner.temp }}/snap
          retention-days: 7
