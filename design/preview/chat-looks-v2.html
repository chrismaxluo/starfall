<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星临 · 弹幕外观新设计</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
/* 圆体（Resource Han Rounded，SIL OFL 1.1）：只留了 GB2312 里的字，生僻字回落到思源黑体 */
@font-face { font-family: "SF Round"; font-weight: 700; font-display: swap; src: url(assets/chat-looks/fonts/rhr-Bold.woff2) format("woff2"); }
@font-face { font-family: "SF Round"; font-weight: 900; font-display: swap; src: url(assets/chat-looks/fonts/rhr-Heavy.woff2) format("woff2"); }
:root { --font-sans: "Geist", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; --round: "SF Round", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --bg: #0B0B10; --panel: #121218; --line: rgba(255,255,255,.08); --text: #EDEDF1; --mute: #A6A8B4; --dim: #80838F; --acc: #8D8BFF; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { height: 100%; display: grid; grid-template-columns: 340px 1fr; }
.embed .app { grid-template-columns: 1fr; }
.embed .side { display: none; }
.side { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 22px 18px 40px; }
.side h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.side h1 img { width: 22px; height: 22px; }
.side .sub { color: var(--dim); font-size: 12.5px; line-height: 1.6; }
.side .sub a { color: var(--acc); }
.grp { margin-top: 16px; }
.grp > b { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; letter-spacing: .12em; color: var(--dim); font-weight: 500; margin-bottom: 8px; }
.grp > b em { font-style: normal; letter-spacing: 0; color: var(--mute); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; background: #0D0D12; padding: 3px; border-radius: 9px; border: 1px solid var(--line); }
.seg button { flex: 1 1 22%; border: 0; background: transparent; padding: 7px 8px; border-radius: 7px; font-size: 12.5px; color: var(--mute); white-space: nowrap; }
.seg button.on { background: #26262F; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.seg button:disabled { opacity: .35; cursor: default; }
.row2 { display: flex; gap: 8px; margin-top: 8px; }
.btn { flex: 1; height: 34px; border-radius: 9px; border: 0; background: #22222B; color: var(--text); font-size: 12.5px; white-space: nowrap; padding: 0 8px; }
.btn.pri { background: var(--acc); color: #0B0B12; font-weight: 600; }
.btn.on { background: rgba(61,214,140,.16); color: #3DD68C; }
.say-in { flex: 1; min-width: 0; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: #0D0D12; padding: 0 10px; font-size: 13px; outline: none; }
.say-in:focus { border-color: var(--acc); }
.rng { display: flex; align-items: center; gap: 10px; }
.rng input { flex: 1; accent-color: var(--acc); }
.rng .btn { flex: none; width: 76px; }
.note { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: #0D0D12; border: 1px solid var(--line); font-size: 12.5px; line-height: 1.75; color: var(--mute); }
.note b { color: var(--text); font-weight: 600; }
.cats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 8px; }
.cats button { border: 0; background: #0D0D12; border-radius: 8px; padding: 4px 2px 3px; display: grid; justify-items: center; gap: 1px; font-size: 10.5px; color: var(--dim); box-shadow: inset 0 0 0 1px var(--line); }
.cats button img { width: 40px; height: 40px; }
.cats button:hover { color: var(--text); box-shadow: inset 0 0 0 1px rgba(141,139,255,.5); }
.view { position: relative; overflow: hidden; display: grid; place-items: center; }
.frame { position: relative; flex: none; }
.frame > .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
@media (max-width: 820px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100%; } .side { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; } .view { height: 86vh; } }

/* ================= 画布（1080×1920 竖屏）：背景只是模拟直播画面，实际页面是透明的 ================= */
.stage { width: 1080px; height: 1920px; overflow: hidden; --st: 10%; --sb: 36%; box-shadow: 0 0 0 2px rgba(255,255,255,.14); }
.stage.sc-clear { background-color: #15151C; background-image: linear-gradient(45deg, #1F1F29 25%, transparent 25%, transparent 75%, #1F1F29 75%), linear-gradient(45deg, #1F1F29 25%, transparent 25%, transparent 75%, #1F1F29 75%); background-size: 64px 64px; background-position: 0 0, 32px 32px; }
.stage.sc-room { background: radial-gradient(260px 260px at 18% 62%, rgba(255,170,90,.85), transparent 70%), radial-gradient(340px 300px at 86% 70%, rgba(90,160,255,.75), transparent 70%), radial-gradient(500px 420px at 60% 18%, rgba(210,120,255,.45), transparent 70%), linear-gradient(175deg, #2A2436, #151823 60%, #0E1017); }
.stage.sc-light { background: radial-gradient(700px 600px at 30% 20%, #FFE9D6, transparent 70%), radial-gradient(700px 600px at 80% 70%, #D9ECFF, transparent 70%), linear-gradient(170deg, #F6F1EA, #E6EEF6); }
.stage.sc-busy { background:
  repeating-linear-gradient(115deg, rgba(255,255,255,.16) 0 18px, transparent 18px 70px),
  radial-gradient(240px 240px at 14% 30%, #FF3D7F, transparent 70%), radial-gradient(300px 260px at 30% 58%, #FFE14D, transparent 70%),
  radial-gradient(320px 320px at 78% 40%, #2DE2E6, transparent 70%), radial-gradient(380px 300px at 18% 80%, #7C3DFF, transparent 70%),
  radial-gradient(420px 360px at 84% 86%, #FF7A1A, transparent 70%),
  conic-gradient(from 30deg at 50% 50%, #241446, #0E3A4A, #3A1030, #241446); }
.person { position: absolute; left: 62%; top: 520px; width: 0; height: 0; }
.stage.sc-clear .person { display: none; }
.person::before { content: ""; position: absolute; left: -165px; top: 0; width: 330px; height: 380px; border-radius: 50% 50% 46% 46%; background: #6E5A50; }
.person::after { content: ""; position: absolute; left: -380px; top: 420px; width: 760px; height: 900px; border-radius: 380px 380px 0 0; background: linear-gradient(90deg, #3A4A78, #7A4A8A); }
.stage.sc-light .person::before { background: #C9A690; }
.stage.sc-light .person::after { background: #4A5670; }
.stage.sc-busy .person::after { background: linear-gradient(90deg, #1B1B1B, #4A2A6A); }
.src { position: absolute; top: calc(var(--st) + 20px); bottom: calc(var(--sb) + 20px); width: 600px; z-index: 10; }
.src.at-l { left: 28px; }
.src.at-r { right: 28px; }
.stage.show-src .src { outline: 3px dashed rgba(141,139,255,.7); outline-offset: 6px; }

/* ================= 弹幕列表 =================
   一条 = 头像框（普通观众框里是小八，大航海和主播是自己的头像）+ 气泡。
   气泡是按这一条的实际大小现画的一张图（猫耳和描边连在一起，底色半透明）；尾巴、猫爪、胶带是单独的图，进场时各自动。
   动画只改位置、缩放、旋转、透明度，不碰模糊和滤镜，老内核也跑得动 */
.chat { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 36px 26px 6px; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: calc(14px * var(--k)); --k: 1; font-family: var(--round); }
.at-r .chat { align-items: flex-end; padding: 40px 6px 26px 36px; }
.chat.big { --k: 1.2; }
.chat.uni .row { align-self: stretch; }
.chat.uni .bw { flex: 1 1 auto; }
.row { position: relative; display: flex; align-items: center; max-width: 100%; }
.at-r .row { flex-direction: row-reverse; }

/* 头像框：窗口（圆形，里面是小八或头像）→ 框 → 趴在框沿上的小八爪子 → 身份装饰 */
.fw { position: relative; flex: none; z-index: 3; }
.fw > * { position: absolute; }
.fw .win { border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 50% 36%, #FFFFFF 0%, #FFF9EE 52%, #E6EFFC 100%); }
.fw .win .av { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.fw .win .ini { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: grid; place-items: center; color: #fff; font-weight: 900; }
.fw .frm { left: 0; top: 0; width: 100%; height: 100%; filter: drop-shadow(0 calc(3px * var(--k)) calc(3px * var(--k)) rgba(28,37,80,.32)); }
/* 小八：平时坐在头像右下角；进场时先在框里露脸，再跳到角上 */
.fw .catw { z-index: 4; transform-origin: 50% 50%; }
.fw .catw .br { width: 100%; height: 100%; transform-origin: 50% 100%; }
.at-r .fw .catw img { transform: scaleX(-1); }
.fw .catw img { display: block; width: 100%; height: 100%; }
/* 压在框沿上的那份只露出「下半截、圆窗外面」的部分：窗里只画一份，半透明的边不会叠出一道线。遮罩放在不动的外层，小八动的时候遮罩不跟着走 */
.fw .orn { z-index: 4; pointer-events: none; }
.row.live .fw .catw .br { animation: breathe 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes breathe { 0%, 100% { transform: none; } 50% { transform: scale(1.02, 1.035); } }

/* 气泡 */
.bw { position: relative; flex: 0 1 auto; min-width: 0; z-index: 1; }
.bx { position: relative; display: flex; flex-direction: column; justify-content: center; }
.bx > .bub { position: absolute; z-index: 0; pointer-events: none; max-width: none; }
/* 气泡后面那一块直播画面模糊一下（形状和气泡一样），底色半透明也不会发灰、字照样清楚 */
.bx > .frost { position: absolute; z-index: 0; pointer-events: none; -webkit-backdrop-filter: blur(var(--fb, 10px)) saturate(140%); backdrop-filter: blur(var(--fb, 10px)) saturate(140%); -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
.at-r .bx > .frost { transform: scaleX(-1); }
/* 奶油：模糊的同时提亮一点，像磨砂纸，不会透成灰色 */
.lk-cream .bx > .frost, .lk-porcelain .bx > .frost { -webkit-backdrop-filter: blur(10px) saturate(125%) brightness(1.35); backdrop-filter: blur(10px) saturate(125%) brightness(1.35); }
.nofrost .bx > .frost { display: none; }
.bx > .who, .bx > .tx, .bx > .sticker { position: relative; z-index: 2; }
.at-r .bx > .bub { transform: scaleX(-1); }
.bw > .tail, .bw > .paw, .bw > .tape { position: absolute; pointer-events: none; }
.bw > .tail { z-index: 0; }
.bw > .paw, .bw > .tape { z-index: 3; }
.row.live .bw > .tail .sw { animation: sway 2.6s ease-in-out infinite; }
.row:not(.live) .bw > .tail .sw, .row:not(.live) .fw .catw .br { animation-play-state: paused; }
.tail .sw, .tail img, .paw img, .tape img { display: block; width: 100%; height: 100%; }
@keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(7deg); } }
.at-r .bw > .paw, .at-r .bw > .tape { transform: scaleX(-1); }
.at-r .tail img { transform: scaleX(-1); }

/* 昵称和弹幕一律完整显示：放不下就换行，不截断、不加省略号 */
.who { display: flex; flex-wrap: wrap; align-items: center; gap: calc(4px * var(--k)) calc(7px * var(--k)); min-width: 0; min-height: calc(32px * var(--k)); }
.at-r .who { flex-direction: row-reverse; }
.who .ic { flex: none; width: calc(25px * var(--k)); height: calc(25px * var(--k)); margin-right: calc(-1px * var(--k)); }
.badge { flex: none; width: calc(30px * var(--k)); height: calc(30px * var(--k)); object-fit: contain; filter: drop-shadow(0 1px 1px rgba(28,37,80,.25)); }
.honor { flex: none; height: calc(21px * var(--k)); width: auto; }
.fang { flex: none; display: inline-grid; place-items: center; width: calc(25px * var(--k)); height: calc(25px * var(--k)); border-radius: 50%; font-size: calc(14px * var(--k)); font-weight: 900; font-style: normal; line-height: 1; background: #FFF1DE; color: #E07B1F; box-shadow: inset 0 0 0 calc(2px * var(--k)) #F3A04D, 0 0 0 calc(2px * var(--k)) #fff; }
.zb { flex: none; height: calc(26px * var(--k)); padding: 0 calc(11px * var(--k)); display: inline-flex; align-items: center; font-size: calc(15px * var(--k)); font-weight: 900; letter-spacing: .08em; border-radius: 999px; background: linear-gradient(180deg, #FF9CC0, #FF6F9E); color: #fff; box-shadow: 0 0 0 calc(2px * var(--k)) #fff; }
/* 粉丝牌：B 站按等级的颜色，形状换成贴纸小胶囊 */
.medal { flex: 0 1 auto; min-width: calc(30px * var(--k)); display: inline-flex; align-items: stretch; height: calc(26px * var(--k)); font-size: calc(15px * var(--k)); font-weight: 900; line-height: 1; overflow: hidden; border-radius: 999px; box-shadow: 0 0 0 calc(2px * var(--k)) #fff; }
.medal .mn { flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; display: inline-flex; align-items: center; padding: 0 calc(7px * var(--k)) 0 calc(10px * var(--k)); background: var(--mbg); color: #fff; }
.medal.lv-only .ml { background: var(--mbg); color: #fff; padding: 0 calc(9px * var(--k)); }
.medal .ml { flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: calc(26px * var(--k)); padding: 0 calc(8px * var(--k)) 0 calc(6px * var(--k)); background: #fff; color: var(--mlv); font-family: "Geist", var(--round); font-weight: 700; }
/* 昵称：浅色胶囊；普通观众的小头像放在胶囊开头 */
.nm { flex: 0 0 auto; max-width: 100%; display: inline-flex; align-items: center; gap: calc(6px * var(--k)); min-height: calc(28px * var(--k)); padding: 0 calc(13px * var(--k)); border-radius: 999px; background: var(--pale); color: var(--deep); font-size: calc(19px * var(--k)); font-weight: 900; }
.nm.has-mini { padding-left: calc(3px * var(--k)); }
.nm .mini { flex: none; width: calc(24px * var(--k)); height: calc(24px * var(--k)); border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 calc(1.5px * var(--k)) #fff; background: #fff; }
.nm .t { min-width: 0; white-space: normal; word-break: break-all; line-height: 1.25; }
.at-r .nm { flex-direction: row-reverse; }
.at-r .nm.has-mini { padding-left: calc(13px * var(--k)); padding-right: calc(3px * var(--k)); }
.tx { margin-top: calc(4px * var(--k)); font-size: calc(28px * var(--k)); line-height: 1.3; font-weight: 900; letter-spacing: .02em; color: #1F2B5B; word-break: break-word; }
.tx .em { height: 1.25em; width: auto; vertical-align: -0.28em; margin: 0 .04em; }
.at-r .tx { text-align: right; }
.sticker { display: block; margin-top: calc(6px * var(--k)); height: calc(100px * var(--k)); width: auto; max-width: 100%; object-fit: contain; align-self: flex-start; }
.at-r .sticker { align-self: flex-end; }
.row { --deep: #2B4C8C; --pale: #DCE8FB; }
.row.lv-3 { --deep: #1D4A9E; --pale: #CFE2FF; }
.row.lv-2 { --deep: #5530A6; --pale: #E6DAFF; }
.row.lv-1 { --deep: #865406; --pale: #FFE9B0; }
.row.anchor { --deep: #A12E5C; --pale: #FFDCE9; }

/* ---------- 星月夜空：深蓝半透明气泡 + 发光描边；白字、金色昵称，字带一点光 ---------- */
.lk-night .fw .win { background: radial-gradient(circle at 50% 34%, #3E54B8 0%, #222E7C 52%, #111850 100%); }
.lk-night .fw .frm { filter: none; }
.lk-night .tx { color: #fff; text-shadow: 0 1px 6px rgba(4,8,40,.7), 0 0 16px rgba(130,160,255,.28); }
.lk-night .nm { background: none; padding: 0 calc(2px * var(--k)); color: var(--nmc); text-shadow: 0 0 10px var(--nmg), 0 1px 2px rgba(4,8,40,.8); }
.lk-night .nm.has-mini { padding-left: 0; }
.lk-night .nm .mini { box-shadow: 0 0 0 calc(1.5px * var(--k)) #C9D6FF, 0 0 8px rgba(150,180,255,.7); }
.lk-night .row { --nmc: #FFE7B0; --nmg: rgba(255,214,120,.38); }
.lk-night .row.lv-3 { --nmc: #B2DCFF; --nmg: rgba(120,190,255,.45); }
.lk-night .row.lv-2 { --nmc: #E4D0FF; --nmg: rgba(190,150,255,.5); }
.lk-night .row.lv-1 { --nmc: #FFE29A; --nmg: rgba(255,200,90,.55); }
.lk-night .row.anchor { --nmc: #FFC9DE; --nmg: rgba(255,140,190,.5); }
.lk-night .medal { box-shadow: 0 0 0 calc(1.5px * var(--k)) rgba(255,255,255,.6), 0 0 10px rgba(160,140,255,.45); }
.lk-night .medal .ml { background: rgba(255,255,255,.92); }
.lk-night .zb { background: linear-gradient(180deg, #FF8DBA, #F0588F); box-shadow: 0 0 0 calc(1.5px * var(--k)) rgba(255,255,255,.7), 0 0 10px rgba(255,110,170,.6); }
.lk-night .fang { background: rgba(20,24,60,.6); color: #FFC07A; box-shadow: inset 0 0 0 calc(1.5px * var(--k)) #FFB061, 0 0 8px rgba(255,170,90,.45); }
.lk-night .badge { filter: drop-shadow(0 0 4px rgba(150,180,255,.55)); }
.lk-night .fw .twk { z-index: 4; pointer-events: none; opacity: .9; }
.lk-night .row.live .fw .twk { animation: twinkle 2.6s ease-in-out infinite; }
.lk-night .row.live .fw .twk.t2 { animation-delay: -1.3s; }
.lk-night .row:not(.live) .fw .twk { animation-play-state: paused; }
@keyframes twinkle { 0%, 100% { transform: scale(.55) rotate(0deg); opacity: .35; } 50% { transform: scale(1.1) rotate(45deg); opacity: 1; } }
/* 吊坠：挂在气泡右上，最新一条轻轻晃 */
.bw > .charm { position: absolute; pointer-events: none; z-index: 3; transform-origin: 50% 0; }
.bw > .charm img { display: block; width: 100%; height: 100%; }
.row.live .bw > .charm .sw { animation: swing 3s ease-in-out infinite; transform-origin: 50% 0; }
.row:not(.live) .bw > .charm .sw { animation-play-state: paused; }
.bw > .charm .sw { width: 100%; height: 100%; }
@keyframes swing { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

/* ---------- 像素小屋：一格一格的深蓝方框；字带硬阴影，胶囊换成切角方块；动起来也是一跳一跳的 ---------- */
.lk-pixel img.px, .lk-pixel .px img { image-rendering: pixelated; image-rendering: crisp-edges; }
.lk-pixel .fw .win { background: #2A3C8E; }
.lk-pixel .fw .frm { filter: none; image-rendering: pixelated; }
.lk-pixel .tx { color: #fff; text-shadow: calc(2px * var(--k)) calc(2px * var(--k)) 0 #0A1230; }
.lk-pixel .nm { background: none; padding: 0 calc(2px * var(--k)); color: var(--nmc); text-shadow: calc(2px * var(--k)) calc(2px * var(--k)) 0 #0A1230; }
.lk-pixel .nm.has-mini { padding-left: 0; }
.lk-pixel .row { --nmc: #FFE7A8; }
.lk-pixel .row.lv-3 { --nmc: #A6D4FF; }
.lk-pixel .row.lv-2 { --nmc: #DCC6FF; }
.lk-pixel .row.lv-1 { --nmc: #FFD66B; }
.lk-pixel .row.anchor { --nmc: #FFB8D2; }
.lk-pixel .medal, .lk-pixel .zb, .lk-pixel .fang, .lk-pixel .nm .mini { --c: calc(3px * var(--k)); border-radius: 0; box-shadow: none; clip-path: polygon(var(--c) 0, calc(100% - var(--c)) 0, 100% var(--c), 100% calc(100% - var(--c)), calc(100% - var(--c)) 100%, var(--c) 100%, 0 calc(100% - var(--c)), 0 var(--c)); }
.lk-pixel .medal .ml { font-family: var(--round); font-weight: 900; }
.lk-pixel .zb { background: #FF6F9E; }
.lk-pixel .fang { background: #F39A3D; color: #2A1606; }
.lk-pixel .row.live .bw > .tail .sw { animation-timing-function: steps(3, end); }
.lk-pixel .row.live .bw > .charm .sw { animation-timing-function: steps(3, end); }
.lk-pixel .row.live .fw .catw .br { animation-timing-function: steps(2, end); }
.lk-pixel .fw .twk { z-index: 4; pointer-events: none; image-rendering: pixelated; }
.lk-pixel .row.live .fw .twk { animation: blink 2.4s steps(1, end) infinite; }
.lk-pixel .row.live .fw .twk.t2 { animation-delay: -1.2s; }
.lk-pixel .row:not(.live) .fw .twk { animation-play-state: paused; }
@keyframes blink { 0%, 100% { opacity: 1; transform: none; } 40% { opacity: 1; transform: scale(.6); } 60% { opacity: .25; transform: scale(.6); } 80% { opacity: 1; transform: none; } }



/* ---------- 果冻玻璃：白字、名字带一点身份色；最新一条上沿有一点光慢慢流过 ---------- */
.lk-jelly .tx { color: #fff; text-shadow: 0 1px 3px rgba(6,10,30,.55); }
.lk-jelly .nm { background: none; padding: 0 calc(2px * var(--k)); color: var(--jn, #F2F6FF); text-shadow: 0 1px 3px rgba(6,10,30,.55); }

// ---------- 加一条：FLIP（旧的往上挪），最老的一条像贴纸一样被揭掉 ----------
const chat = $('#chat');
const log = [];
function setLive() { const rows = [...chat.children].filter((r) => !r.dataset.out); rows.forEach((r, i) => r.classList.toggle('live', i === rows.length - 1)); rows.forEach((r, i) => { const age = rows.length - 1 - i; r.style.opacity = age >= 7 ? 0.55 : age >= 6 ? 0.8 : 1; }); }
function add(p, text, sticker, quiet, force) {
  log.push([p, text, sticker]); if (log.length > MAX) log.shift();
  const before = new Map([...chat.children].map((r) => [r, r.getBoundingClientRect().top]));
  const el = build(p, text, sticker);
  chat.append(el);
  layout(el);
  ro.observe(el._parts.bx);
  const sc = $('#stage').getBoundingClientRect().height / 1920;
  const avail = $('#src').clientHeight;
  const leaving = [];
  let live = [...chat.children].filter((r) => !r.dataset.out);
  while (live.length > 1 && (live.length > MAX || chat.offsetHeight > avail)) {
    const old = live.shift(); old.dataset.out = '1'; leaving.push(old);
    old.style.position = 'absolute'; old.style.left = st.side === 'r' ? 'auto' : '6px'; old.style.right = st.side === 'r' ? '6px' : 'auto';
  }
  const top0 = chat.getBoundingClientRect().top;
  for (const old of leaving) {
    old.style.top = `${(before.get(old) - top0) / sc}px`;
    old.style.transformOrigin = st.side === 'r' ? '100% 0' : '0 0';
    const m = st.side === 'r' ? -1 : 1;
    anim(old, [{ opacity: old.style.opacity || 1, transform: 'none' }, { opacity: 0, transform: `translate(${-10 * m}px,-34px) rotate(${-5 * m}deg) scale(.92)` }], { duration: 460, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' }).finished.then(() => old.remove());
  }
  for (const [r, y0] of before) {
    if (r.dataset.out) continue;
    const dy = (y0 - r.getBoundingClientRect().top) / sc;
    if (Math.abs(dy) > 0.5) anim(r, [{ transform: `translateY(${dy}px)` }, { transform: 'translateY(0)' }], { duration: 480, easing: 'cubic-bezier(.22,1,.36,1)' });
  }
  setLive();
  if (!quiet) enter(el, force);
  return el;
}
function redraw() { const items = log.splice(0); chat.innerHTML = ''; idle = 0; for (const [p, t, s] of items) add(p, t, s, true); }

// ---------- 自动来弹幕 ----------
const pick = (a) => a[Math.floor(Math.random() * a.length)];
let timer = 0;
const GAP = { slow: [2600, 4000], mid: [1300, 2300], fast: [350, 750] };
function randomOne() {
  const r = Math.random();
  if (r < 0.05) return add(ANCHOR, pick(['谢谢大家~', '欢迎新来的朋友[比心]', '下一首唱什么呀？']));
  const p = pick(PEOPLE);
  if (r < 0.1) return add(p, '', pick(STICKERS));
  add(p, pick(LINES));
}
function loop() { clearTimeout(timer); if (st.paused) return; if (real.on) return realNext(); const [a, b] = GAP[st.speed]; timer = setTimeout(() => { randomOne(); loop(); }, (a + Math.random() * (b - a)) / speed()); }

// ---------- 真实弹幕回放：最近一场直播的弹幕（已匿名：昵称换成「观众N」，头像是画的），按原来的间隔播 ----------
const real = { on: false, items: null, i: 0 };
const REAL_X = { slow: 1, mid: 3, fast: 10 };
const realPeople = new Map();
function realPerson(v) {
  const key = v.name + '|' + v.guard;
  if (!realPeople.has(key)) {
    const n = +(v.name.match(/\d+/)?.[0] || 0);
    realPeople.set(key, { name: v.name, guard: v.guard, mod: v.mod, anchor: v.anchor, face: face(n * 7 + 3), medal: v.medal?.level, medalName: v.medal?.name, medalC: v.medal?.colors, honorUrl: v.honor });
  }
  return realPeople.get(key);
}
async function realStart() {
  if (!real.items) { try { real.items = (await (await fetch(`${A}real.json`, { cache: 'no-store' })).json()).items; } catch { real.items = []; } }
  if (!real.items.length) { $('#realb').textContent = '没有数据'; return; }
  real.on = true; real.i = +(new URLSearchParams(location.search).get('realat') || 0); st.paused = false; chat.innerHTML = ''; log.length = 0; sync(); realNext(true);
}
function realNext(first) {
  clearTimeout(timer);
  if (!real.on || st.paused) return;
  const it = real.items[real.i % real.items.length], prev = real.items[(real.i - 1 + real.items.length) % real.items.length];
  const gap = first || real.i % real.items.length === 0 ? 300 : Math.max(150, Math.min(6000, (it.ts - prev.ts) / REAL_X[st.speed]));
  timer = setTimeout(() => {
    add({ ...realPerson(it.v), emots: it.emots }, it.text, it.sticker?.url);
    real.i++; $('#realb').textContent = `回放中 ${real.i % real.items.length || real.items.length}/${real.items.length}`;
    realNext();
  }, gap / speed());
}

  mk('#width', [['fit', '跟着内容'], ['uni', '统一宽度']], 'width', redraw);
  mk('#bg', [['room', '暗'], ['light', '亮'], ['busy', '花哨'], ['clear', '透明格']], 'bg');
  mk('#blur', [[false, '支持'], [true, '不支持']], 'noblur', relayout);
  mk('#side', [['l', '左边'], ['r', '右边']], 'side', redraw);
  mk('#size', [['std', '标准字号'], ['big', '大字号']], 'size', redraw);
  mk('#speed', [['slow', '慢'], ['mid', '正常'], ['fast', '刷屏']], 'speed', loop);
}
function sync() {
  segs();
  document.body.classList.toggle('nofrost', !!st.noblur);
  $('#stage').className = `stage sc-${st.bg}`;
  $('#src').className = `src at-${st.side}`;
  chat.classList.toggle('big', st.size === 'big');
  for (const l of Object.keys(LOOKS)) chat.classList.toggle(`lk-${l}`, st.look === l);
  $('#note').innerHTML = NOTES.common + NOTES[st.look];
  chat.classList.toggle('uni', st.width === 'uni');
  const a = alpha();
  $('#bga').value = a; $('#bgav').textContent = `${a}%${st.bga == null ? '（默认）' : ''}`;
  $('#bgaAuto').classList.toggle('on', st.bga == null);
  $('#pause').textContent = st.paused ? '继续' : '暂停';
  $('#pause').classList.toggle('on', st.paused); $('#slow').classList.toggle('on', st.slow);
}
// crop：只看弹幕那一块（对比页用），放大一些
function fit() {
  const v = $('#view'), fb = $('#frameBox'), s = $('#stage');
  const R = new URLSearchParams(location.search).has('crop') ? { x: st.side === 'r' ? 400 : 0, y: 170, w: 680, h: 1070 } : { x: 0, y: 0, w: 1080, h: 1920 };
  const k = Math.min((v.clientWidth - 24) / R.w, (v.clientHeight - 24) / R.h);
  fb.style.width = `${R.w * k}px`; fb.style.height = `${R.h * k}px`; fb.style.overflow = 'hidden';
  s.style.transform = `translate(${-R.x * k}px, ${-R.y * k}px) scale(${k})`;
}
const relayout = () => { for (const r of chat.children) { r._key = ''; layout(r); } };
$('#bga').oninput = (e) => { st.bga = +e.target.value; save(); sync(); relayout(); };
$('#bgaAuto').onclick = () => { st.bga = null; save(); sync(); relayout(); };
const send = () => { const t = $('#say').value.trim(); if (!t) return; add(PEOPLE[1], t); $('#say').value = ''; };
$('#send').onclick = send;
$('#say').onkeydown = (e) => { if (e.key === 'Enter') send(); };
for (const b of document.querySelectorAll('[data-k]')) b.onclick = () => {
  const k = b.dataset.k;
  if (k === 'anchor') add(ANCHOR, '谢谢大家的礼物[比心]', undefined, false, true);
  else if (k === 'mod') add(PEOPLE[5], '大家文明发言哦');
  else if (k === 'sticker') add(pick(PEOPLE.filter((p) => !p.guard)), '', pick(STICKERS));
  else if (k === 'long') add(PEOPLE[3], LONG);
  else if (k === 'longname') add(LONGNAME, '名字太长时末尾变成省略号');
  else add(PEOPLE.find((p) => p.guard === +k), pick(['晚上好，来陪主播啦！', '今天的歌单好棒[鼓掌]', '冲冲冲！']), undefined, false, true);
};
function lineup() {
  st.paused = true; sync(); loop(); log.length = 0; chat.innerHTML = '';
  [[PEOPLE[4], '晚上好呀，来啦'], [PEOPLE[0], '哈哈哈哈哈笑死我了'], [PEOPLE[5], '大家文明发言哦'], [PEOPLE[6], '给你一朵小花~'], [PEOPLE[7], '这个也太可爱了吧！'], [PEOPLE[8], '今天的歌单好棒[鼓掌]'], [ANCHOR, '谢谢大家[比心]']].forEach(([p, t], i) => setTimeout(() => add(p, t, undefined, false, true), i * 700));
}
$('#lineup').onclick = lineup;
$('#realb').onclick = () => { if (real.on) { real.on = false; $('#realb').textContent = '真实弹幕回放'; $('#realb').classList.remove('on'); loop(); } else { $('#realb').classList.add('on'); realStart(); } };
$('#pause').onclick = () => { st.paused = !st.paused; sync(); loop(); };
$('#slow').onclick = () => { st.slow = !st.slow; sync(); loop(); };
$('#clear').onclick = () => { chat.innerHTML = ''; log.length = 0; };
const cats = $('#cats');
for (const [id, label, , sample] of CATS) { const b = h('button', '', `<img src="${catSrc(id)}" alt="">${label}`); b.title = sample; b.onclick = () => add(pick(PEOPLE.filter((p) => !p.guard)), sample); cats.append(b); }
addEventListener('resize', fit);
document.fonts?.ready.then(relayout);
const q = new URLSearchParams(location.search);
if (q.has('embed')) document.body.classList.add('embed');
if (q.has('nofrost')) st.noblur = true;
for (const key of ['look', 'intro', 'cframe', 'bg', 'side', 'size', 'speed', 'width']) if (q.has(key)) st[key] = q.get(key);
if (!LOOKS[st.look]) st.look = 'cream';
if (q.has('bga')) st.bga = +q.get('bga');
sync(); fit();
if (q.has('real')) $('#realb').click();
else if (q.has('lineup')) lineup();
else if (q.has('mix')) { st.paused = true; sync(); [[LONGNAME, '名字太长时末尾变成省略号'], [PEOPLE[3], LONG], [PEOPLE[1], '', STICKERS[0]], [PEOPLE[2], '呜呜呜好好听'], [PEOPLE[9], '无语……'], [PEOPLE[10], '卧槽！主播好可爱[比心]']].forEach(([p, t, k]) => add(p, t, k, true)); }
else if (q.has('still')) { st.paused = true; sync(); [[PEOPLE[4], '晚上好呀，来啦'], [PEOPLE[0], '哈哈哈哈哈笑死我了'], [PEOPLE[5], '大家文明发言哦'], [PEOPLE[6], '给你一朵小花~'], [PEOPLE[7], '这个也太可爱了吧！'], [PEOPLE[8], '今天的歌单好棒[鼓掌]'], [ANCHOR, '谢谢大家[比心]']].forEach(([p, t]) => add(p, t, undefined, true)); }
else {
  [[PEOPLE[0], '晚上好，来陪主播啦！'], [PEOPLE[1], '今天也要开开心心'], [PEOPLE[2], '这个也太可爱了吧！'], [PEOPLE[3], '给你一朵小花~'], [PEOPLE[9], '哈哈哈哈哈哈']].forEach(([p, t], n) => setTimeout(() => add(p, t), 300 + n * 420));
  setTimeout(loop, 2600);
}
</script>
</body>
