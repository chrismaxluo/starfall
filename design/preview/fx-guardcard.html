<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星临 · 大航海入场卡</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root { --font-sans: "Geist", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; --font-mono: "Geist Mono", "Geist", ui-monospace, monospace;
  --bg: #0B0B10; --panel: #121218; --line: rgba(255,255,255,.08); --text: #EDEDF1; --mute: #A6A8B4; --dim: #80838F; --acc: #8D8BFF; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
.app { height: 100%; display: grid; grid-template-columns: 320px 1fr; }
.side { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 22px 18px 40px; }
.side h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.side h1 img { width: 22px; height: 22px; }
.side .sub { color: var(--dim); font-size: 12.5px; line-height: 1.6; }
.grp { margin-top: 18px; }
.grp > b { display: block; font-size: 11.5px; letter-spacing: .12em; color: var(--dim); font-weight: 500; margin-bottom: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; background: #0D0D12; padding: 3px; border-radius: 9px; border: 1px solid var(--line); }
.seg button { flex: 1 1 30%; border: 0; background: transparent; padding: 7px 8px; border-radius: 7px; font-size: 12.5px; color: var(--mute); white-space: nowrap; }
.seg button.on { background: #26262F; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.seg.big button { padding: 10px 8px; font-size: 13.5px; }
.row { display: flex; gap: 8px; margin-top: 18px; }
.btn { flex: 1; height: 38px; border-radius: 9px; border: 0; background: var(--acc); color: #0B0B12; font-weight: 600; font-size: 13.5px; }
.btn.sec { background: #22222B; color: var(--text); }
.btn.sec.on { background: rgba(61,214,140,.16); color: #3DD68C; }
.note { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: #0D0D12; border: 1px solid var(--line); font-size: 12.5px; line-height: 1.75; color: var(--mute); }
.note b { color: var(--text); font-weight: 600; }
.view { position: relative; overflow: hidden; display: grid; place-items: center; }
.frame { position: relative; flex: none; }
.frame > .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
@media (max-width: 820px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100%; } .side { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; } .view { height: 78vh; } }

/* ================= 画布（1080×1920 竖屏），和特效页一样的安全区、左右边距 ================= */
.stage { width: 1080px; height: 1920px; overflow: hidden; --st: 12%; --sb: 40%; --mx: 9%;
  background-color: #15151C; background-image: linear-gradient(45deg, #1C1C25 25%, transparent 25%, transparent 75%, #1C1C25 75%), linear-gradient(45deg, #1C1C25 25%, transparent 25%, transparent 75%, #1C1C25 75%);
  background-size: 64px 64px; background-position: 0 0, 32px 32px; box-shadow: 0 0 0 2px rgba(255,255,255,.14); }
.stage.sc-room { background: radial-gradient(260px 260px at 18% 62%, rgba(255,170,90,.85), transparent 70%), radial-gradient(340px 300px at 86% 70%, rgba(90,160,255,.75), transparent 70%), radial-gradient(500px 420px at 60% 18%, rgba(210,120,255,.45), transparent 70%), linear-gradient(175deg, #2A2436, #151823 60%, #0E1017); }
.stage.sc-light { background: radial-gradient(700px 600px at 30% 20%, #FFE9D6, transparent 70%), radial-gradient(700px 600px at 80% 70%, #D9ECFF, transparent 70%), linear-gradient(170deg, #F6F1EA, #E6EEF6); }
.person { position: absolute; left: 50%; top: 520px; width: 0; height: 0; }
.stage.sc-clear .person { display: none; }
.person::before { content: ""; position: absolute; left: -165px; top: 0; width: 330px; height: 380px; border-radius: 50% 50% 46% 46%; background: #6E5A50; }
.person::after { content: ""; position: absolute; left: -380px; top: 420px; width: 760px; height: 900px; border-radius: 380px 380px 0 0; background: linear-gradient(90deg, #3A4A78, #7A4A8A); }
.stage.sc-light .person::before { background: #C9A690; }
.stage.sc-light .person::after { background: #4A5670; }
.safe { position: absolute; left: 0; right: 0; z-index: 50; pointer-events: none; display: flex; align-items: center; justify-content: center; font-size: 22px; letter-spacing: .1em; color: rgba(255,255,255,.5); background: repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 14px, transparent 14px 28px); }
.safe.top { top: 0; height: var(--st); border-bottom: 2px dashed rgba(255,255,255,.25); }
.safe.bot { bottom: 0; height: var(--sb); border-top: 2px dashed rgba(255,255,255,.25); }
.stage:not(.show-safe) .safe { display: none; }

/* 位置：和特效页一致（左下 / 右下，避开底部弹幕区） */
.slot { position: absolute; z-index: 10; pointer-events: none; }
.slot.pos-bl { left: calc(var(--mx) + 24px); bottom: calc(var(--sb) + 60px); }
.slot.pos-br { right: calc(var(--mx) + 24px); bottom: calc(var(--sb) + 60px); }

/* ================= 大航海入场卡 =================
   玻璃做法和晶礼、晶巡一样；--acc：身份色（左侧柔光、描边末端、身份文字），头像框按身份换 */
.gk { position: relative; width: 640px; height: 150px; --acc: #4A9BFF; }
.gk.lv-cap { --acc: #4A9BFF; --acc2: #A9D2FF; }
.gk.lv-adm { --acc: #A774FF; --acc2: #DCC6FF; }
.gk.lv-gov { --acc: #FF6A3D; --acc2: #FFD27A; }
.gk .g { position: absolute; left: 0; top: 0; width: 640px; height: 150px; --r: 32px; color: #fff; border-radius: 32px;
  background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.05) 42%, rgba(255,255,255,.02)), rgba(16,18,30,.52);
  -webkit-backdrop-filter: blur(28px) saturate(170%); backdrop-filter: blur(28px) saturate(170%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.34), inset 0 -1px 0 rgba(0,0,0,.18), 0 26px 60px -20px rgba(0,0,0,.6), 0 6px 16px -6px rgba(0,0,0,.35); }
.gk .g::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.6px; pointer-events: none;
  background: linear-gradient(140deg, rgba(255,255,255,.85), rgba(255,255,255,.16) 26%, rgba(255,255,255,.05) 58%, color-mix(in srgb, var(--acc) 75%, transparent));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.gk .gl { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
/* 左侧身份色柔光（从头像后面透出来） */
.gk .gl::before { content: ""; position: absolute; left: -10%; top: -70%; width: 52%; height: 240%; background: radial-gradient(closest-side, color-mix(in srgb, var(--acc) 70%, transparent), transparent); opacity: .5; }
.gk .sheen { position: absolute; top: -20%; bottom: -20%; left: 0; width: 26%; opacity: 0; transform: translateX(-120%) skewX(-18deg);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.34), transparent); }
.gk .tx { position: absolute; left: 196px; right: 34px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.gk .l1 { display: flex; align-items: center; gap: 12px; min-width: 0; }
.gk .tag { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 6px; border-radius: 20px;
  background: color-mix(in srgb, var(--acc) 22%, rgba(0,0,0,.25)); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--acc) 70%, transparent);
  font-size: 23px; font-weight: 700; color: var(--acc2); letter-spacing: .08em; }
.gk .tag img { width: 32px; height: 32px; }
.gk .nm { min-width: 0; font-size: 38px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 10px rgba(0,0,0,.35); }
.gk .say { font-size: 26px; color: rgba(255,255,255,.76); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 头像和头像框：框比卡片高一点，上下探出来 */
.gk .avw { position: absolute; left: 100px; top: 75px; width: 0; height: 0; }
.gk .ring { position: absolute; left: -76px; top: -76px; width: 152px; height: 152px; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--acc) 60%, transparent), transparent); opacity: 0; }
.gk .av { position: absolute; left: -64px; top: -64px; width: 128px; height: 128px; border-radius: 50%; overflow: hidden; background: #333; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
.gk .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gk .fr { position: absolute; left: -90px; top: -90px; width: 180px; height: 180px; }
.lite .gk .g { -webkit-backdrop-filter: none; backdrop-filter: none; background: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.04) 45%), rgba(16,18,28,.86); }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h1><img src="assets/logo.svg" alt="">大航海入场卡</h1>
    <div class="sub">左下角的入场卡片 · 舰长、提督、总督用同一套动画，只换身份色、头像框和身份标签，4 秒。头像框、船锚图标从 B 站加载。</div>
    <div class="grp"><b>身份</b><div class="seg big" id="lv"></div></div>
    <div class="grp"><b>昵称</b><div class="seg" id="nm"></div></div>
    <div class="grp"><b>位置</b><div class="seg" id="pos"></div></div>
    <div class="grp"><b>背景</b><div class="seg" id="bg"></div></div>
    <div class="row"><button class="btn" id="play">▶ 播放</button></div>
    <div class="row"><button class="btn sec" id="loop">自动循环</button><button class="btn sec" id="safe">安全区</button><button class="btn sec" id="slow">慢放</button></div>
    <div class="note"><b>过程</b><br>① 卡片从左边滑进来，带一点回弹<br>② 头像框轻轻弹出，一道高光扫过卡片<br>③ 身份、昵称、欢迎语依次出现<br>④ 停留约 2.5 秒<br>⑤ 往左滑出、淡出</div>
  </aside>
  <main class="view" id="view">
    <div class="frame" id="frame">
      <div class="stage sc-room" id="stage">
        <div class="person"></div>
        <div class="safe top">顶部信息栏</div><div class="safe bot">底部弹幕区</div>
      </div>
    </div>
  </main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const FACE = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC9A8"/><stop offset="1" stop-color="#E0769A"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><circle cx="50" cy="40" r="18" fill="#fff" opacity=".92"/><circle cx="43" cy="38" r="2.6" fill="#333"/><circle cx="57" cy="38" r="2.6" fill="#333"/><path d="M18 92c4-20 18-30 32-30s28 10 32 30z" fill="#fff" opacity=".92"/></svg>');
// B 站的大航海头像框、船锚图标（版权归 B 站，只在运行时加载）
const FRAMES = { gov: 'https://i0.hdslb.com/bfs/live/39164ebfdd39db3d284b1221765e7e57f5a49958.png', adm: 'https://i0.hdslb.com/bfs/live/09937c3beb0608e267a50ac3c7125c3f2d709098.png', cap: 'https://i0.hdslb.com/bfs/live/80f732943cc3367029df65e267960d56736a82ee.png' };
const BADGE = 'https://s1.hdslb.com/bfs/static/blive/live-pay-mono/relation/relation/assets/';
const BADGES = { gov: `${BADGE}governor-DpDXKEdA.png`, adm: `${BADGE}supervisor-u43ElIjU.png`, cap: `${BADGE}captain-Bjw5Byb5.png` };
const LEVELS = { cap: '舰长', adm: '提督', gov: '总督' };
const NAMES = { short: '道具堡', mid: '晚风与星河漫步', long: '今天也要早点睡觉的超长昵称啊' };
const DUR = 4000;
const st = { lv: 'cap', nm: 'short', pos: 'bl', bg: 'room', loop: false, safe: false, slow: false };
const SLOW = () => (st.slow ? 4 : 1);
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };

function build(lv, name) {
  const L = LEVELS[lv];
  const slot = h('div', `slot pos-${st.pos}`);
  const card = h('div', `gk lv-${lv}`);
  card.innerHTML = `
    <div class="g"><div class="gl"><div class="sheen"></div></div>
      <div class="tx"><div class="l1"><span class="tag"><img src="${BADGES[lv]}" alt="" referrerpolicy="no-referrer">${L}</span><span class="nm">${name}</span></div>
      <div class="say">欢迎${L} ${name} 进入直播间</div></div></div>
    <div class="avw"><div class="ring"></div><div class="av"><img src="${FACE}" alt=""></div><img class="fr" src="${FRAMES[lv]}" alt="" referrerpolicy="no-referrer" onerror="this.remove()"></div>`;
  slot.append(card);
  return { slot, card };
}

let cur = null;
function stop() { if (!cur) return; cur.timers.forEach(clearTimeout); cancelAnimationFrame(cur.rate); cur.slot.remove(); cur = null; }
function play() {
  stop();
  const b = build(st.lv, NAMES[st.nm]);
  $('#stage').append(b.slot);
  const timers = [];
  cur = { slot: b.slot, timers, rate: 0 };
  const at = (ms, fn) => timers.push(setTimeout(fn, ms * SLOW()));
  const rate = 1 / SLOW();
  const keepRate = () => { if (!cur) return; for (const a of document.getAnimations()) if (a.playbackRate !== rate) a.playbackRate = rate; cur.rate = requestAnimationFrame(keepRate); };
  if (rate !== 1) keepRate();
  const q = (s) => b.card.querySelector(s);
  const anim = (el, kf, o) => el.animate(kf, { fill: 'both', ...o });
  const right = st.pos === 'br';
  // 注意：毛玻璃在带透明度动画的父元素里会失效，所以动画直接加在玻璃本身和头像上，不加在外层
  const glass = q('.g'), avw = q('.avw');
  const inX = right ? '120px' : '-120px', outX = right ? '60px' : '-60px';
  // ① 滑进来（带一点回弹）
  anim(glass, [{ opacity: 0, transform: `translateX(${inX})` }, { opacity: 1, transform: 'translateX(10px)', offset: 0.7 }, { opacity: 1, transform: 'translateX(0)' }], { duration: 460, easing: 'cubic-bezier(.2,.9,.3,1)' });
  // ② 头像框轻轻弹出，身份色的光一闪；高光扫过
  anim(avw, [{ opacity: 0, transform: 'scale(.4)' }, { opacity: 1, transform: 'scale(1.1)', offset: 0.65 }, { opacity: 1, transform: 'scale(1)' }], { duration: 420, delay: 160, easing: 'ease-out' });
  anim(q('.ring'), [{ opacity: 0, transform: 'scale(.8)' }, { opacity: 1, transform: 'scale(1.35)', offset: 0.4 }, { opacity: 0, transform: 'scale(1.7)' }], { duration: 700, delay: 330, easing: 'ease-out' });
  anim(q('.sheen'), [{ opacity: 0, transform: 'translateX(-120%) skewX(-18deg)' }, { opacity: 1, transform: 'translateX(40%) skewX(-18deg)', offset: 0.2 }, { opacity: 0, transform: 'translateX(520%) skewX(-18deg)' }], { duration: 1000, delay: 480, easing: 'cubic-bezier(.45,0,.3,1)' });
  // ③ 身份、昵称、欢迎语依次出现
  anim(q('.l1'), [{ opacity: 0, transform: 'translateX(-16px)' }, { opacity: 1, transform: 'none' }], { duration: 360, delay: 300, easing: 'cubic-bezier(.2,.8,.2,1)' });
  anim(q('.say'), [{ opacity: 0, transform: 'translateX(-16px)' }, { opacity: 1, transform: 'none' }], { duration: 360, delay: 420, easing: 'cubic-bezier(.2,.8,.2,1)' });
  // ⑤ 滑出、淡出（毛玻璃和头像各自动画）
  const outKf = [{ opacity: 1, transform: 'translateX(0)' }, { opacity: 0, transform: `translateX(${outX})` }];
  anim(glass, outKf, { duration: 420, delay: DUR - 440, easing: 'cubic-bezier(.4,0,1,1)' });
  anim(avw, [{ opacity: 1, transform: 'translateX(0) scale(1)' }, { opacity: 0, transform: `translateX(${outX}) scale(.9)` }], { duration: 420, delay: DUR - 440, easing: 'cubic-bezier(.4,0,1,1)' });
  at(DUR, () => { stop(); if (st.loop) setTimeout(play, 600); });
}

function segs() {
  const mk = (id, items, key) => { const el = $(id); el.innerHTML = ''; for (const [v, label] of items) { const bt = h('button', st[key] == v ? 'on' : '', label); bt.onclick = () => { st[key] = v; sync(); if (key !== 'bg') play(); }; el.append(bt); } };
  mk('#lv', [['cap', '舰长'], ['adm', '提督'], ['gov', '总督']], 'lv');
  mk('#nm', [['short', '短昵称'], ['mid', '中等'], ['long', '很长']], 'nm');
  mk('#pos', [['bl', '左下'], ['br', '右下']], 'pos');
  mk('#bg', [['room', '直播间'], ['light', '浅色'], ['clear', '透明格']], 'bg');
}
function sync() {
  segs();
  $('#stage').className = `stage sc-${st.bg}${st.safe ? ' show-safe' : ''}`;
  $('#slow').classList.toggle('on', st.slow); $('#loop').classList.toggle('on', st.loop); $('#safe').classList.toggle('on', st.safe);
}
function fit() {
  const v = $('#view'), f = $('#frame'), s = $('#stage');
  const k = Math.min((v.clientWidth - 40) / 1080, (v.clientHeight - 40) / 1920);
  f.style.width = `${1080 * k}px`; f.style.height = `${1920 * k}px`; s.style.transform = `scale(${k})`;
}
$('#play').onclick = play;
$('#loop').onclick = () => { st.loop = !st.loop; sync(); if (st.loop && !cur) play(); };
$('#safe').onclick = () => { st.safe = !st.safe; sync(); };
$('#slow').onclick = () => { st.slow = !st.slow; sync(); play(); };
addEventListener('resize', fit);
sync(); fit();
setTimeout(play, 400);
</script>
</body>
</html>
