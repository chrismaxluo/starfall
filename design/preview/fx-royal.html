<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星临 · 大航海宫廷</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/serif.css">
<style>
:root { --font-sans: "Geist", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; --font-serif: "Noto Serif SC", "Songti SC", "SimSun", serif; --font-mono: "Geist Mono", "Geist", ui-monospace, monospace;
  --bg: #0B0B10; --panel: #121218; --line: rgba(255,255,255,.08); --text: #EDEDF1; --mute: #A6A8B4; --dim: #80838F; --acc: #8D8BFF; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
.app { height: 100%; display: grid; grid-template-columns: 320px 1fr; }
.side { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 22px 18px 40px; }
.side h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.side h1 img { width: 22px; height: 22px; }
.side .sub { color: var(--dim); font-size: 12.5px; line-height: 1.6; }
.side .sub a { color: var(--acc); }
.grp { margin-top: 18px; }
.grp > b { display: block; font-size: 11.5px; letter-spacing: .12em; color: var(--dim); font-weight: 500; margin-bottom: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; background: #0D0D12; padding: 3px; border-radius: 9px; border: 1px solid var(--line); }
.seg button { flex: 1; border: 0; background: transparent; padding: 7px 8px; border-radius: 7px; font-size: 12.5px; color: var(--mute); white-space: nowrap; }
.seg button.on { background: #26262F; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.seg.big button { padding: 11px 8px; font-size: 14px; }
.row { display: flex; gap: 8px; margin-top: 18px; }
.btn { flex: 1; height: 38px; border-radius: 9px; border: 0; background: var(--acc); color: #0B0B12; font-weight: 600; font-size: 13.5px; }
.btn.sec { background: #22222B; color: var(--text); }
.btn.sec.on { background: rgba(61,214,140,.16); color: #3DD68C; }
.note { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: #0D0D12; border: 1px solid var(--line); font-size: 12.5px; line-height: 1.75; color: var(--mute); }
.note b { color: var(--text); font-weight: 600; }
.view { position: relative; overflow: hidden; display: grid; place-items: center; }
.frame { position: relative; flex: none; }
.frame > .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.cap-line { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 12px; color: var(--dim); font-family: var(--font-mono); }
@media (max-width: 820px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100%; } .side { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; } .view { height: 78vh; } }

.stage { width: 1080px; height: 1920px; overflow: hidden; --st: 12%; --sb: 40%; --hy: 40%;
  background-color: #15151C; background-image: linear-gradient(45deg, #1C1C25 25%, transparent 25%, transparent 75%, #1C1C25 75%), linear-gradient(45deg, #1C1C25 25%, transparent 25%, transparent 75%, #1C1C25 75%);
  background-size: 64px 64px; background-position: 0 0, 32px 32px; box-shadow: 0 0 0 2px rgba(255,255,255,.14); }
.stage.sc-dark { background: radial-gradient(700px 500px at 70% 20%, rgba(88,120,190,.45), transparent 70%), radial-gradient(600px 500px at 20% 90%, rgba(40,90,80,.45), transparent 70%), linear-gradient(170deg, #1B2233, #0A0C12); }
.stage.sc-light { background: radial-gradient(700px 600px at 30% 20%, #FFE9D6, transparent 70%), radial-gradient(700px 600px at 80% 70%, #D9ECFF, transparent 70%), linear-gradient(170deg, #F6F1EA, #E6EEF6); }
.person { position: absolute; left: 50%; top: 520px; width: 0; height: 0; display: none; }
.stage.sc-dark .person, .stage.sc-light .person { display: block; }
.person::before { content: ""; position: absolute; left: -165px; top: 0; width: 330px; height: 380px; border-radius: 50% 50% 46% 46%; background: #C9A690; }
.person::after { content: ""; position: absolute; left: -380px; top: 420px; width: 760px; height: 900px; border-radius: 380px 380px 0 0; background: #4A5670; }
.stage.sc-dark .person::before { background: #6E5A50; } .stage.sc-dark .person::after { background: #2A3244; }
.safe { position: absolute; left: 0; right: 0; z-index: 50; pointer-events: none; display: flex; align-items: center; justify-content: center; font-size: 22px; letter-spacing: .1em; color: rgba(255,255,255,.5); background: repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 14px, transparent 14px 28px); }
.safe.top { top: 0; height: var(--st); border-bottom: 2px dashed rgba(255,255,255,.25); }
.safe.bot { bottom: 0; height: var(--sb); border-top: 2px dashed rgba(255,255,255,.25); }
.stage.no-safe .safe { display: none; }


/* ================= 公用 ================= */
.hero { position: absolute; left: 50%; top: var(--hy); width: 0; height: 0; animation: heroOut .7s calc(var(--dur) - .7s) ease-in forwards; }
@keyframes heroOut { to { opacity: 0; transform: translateY(-18px) scale(.985); } }
.lay { position: absolute; left: -540px; top: -650px; width: 1080px; height: 1300px; overflow: visible; }
.dim { position: absolute; left: -1600px; top: -2200px; width: 3200px; height: 4400px; opacity: 0; animation: fin .9s forwards; }
.t-cap .dim { background: radial-gradient(circle at 50% 50%, rgba(4,14,22,.2), rgba(0,4,10,.42) 30%); }
.t-adm .dim { background: radial-gradient(circle at 50% 50%, rgba(18,8,30,.25), rgba(6,2,12,.55) 32%); }
.t-gov .dim { background: radial-gradient(circle at 50% 50%, rgba(30,12,4,.3), rgba(6,2,0,.7) 34%); }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: dash var(--t, 1s) var(--d, 0s) cubic-bezier(.65,0,.35,1) forwards; }
@keyframes dash { to { stroke-dashoffset: 0; } }
@keyframes fin { to { opacity: 1; } }
.f { opacity: 0; animation: fin var(--t, .8s) var(--d, 0s) ease-out forwards; }
.ln { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.avw { position: absolute; left: calc(var(--av) / -2); top: calc(var(--av) / -2); width: var(--av); height: var(--av); border-radius: 50%; overflow: hidden; background: #140E06;
  clip-path: circle(0 at 50% 50%); animation: iris 1.1s var(--avd) cubic-bezier(.16,1,.3,1) forwards; }
@keyframes iris { to { clip-path: circle(50% at 50% 50%); } }
.avw img, .avw .ini { width: 100%; height: 100%; object-fit: cover; display: grid; place-items: center; font-size: 96px; font-weight: 600; color: #fff; font-family: var(--font-serif); }
.avw::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 34px rgba(0,0,0,.55), inset 0 0 0 1.5px rgba(255,240,210,.3); }
.avw i { position: absolute; top: -20%; bottom: -20%; width: 30%; left: -60%; background: linear-gradient(90deg, transparent, rgba(255,245,220,.45), transparent); transform: skewX(-20deg); animation: sweep 1.4s var(--shd) cubic-bezier(.4,0,.2,1) forwards; z-index: 2; }
@keyframes sweep { to { left: 140%; } }
.tx { position: absolute; left: -540px; width: 1080px; display: flex; justify-content: center; align-items: center; top: var(--y); transform: translateY(-50%); }
.tx > .lab { opacity: 0; animation: trackIn 1.4s var(--d) cubic-bezier(.16,1,.3,1) forwards; }
@keyframes trackIn { from { opacity: 0; letter-spacing: 1.2em; } to { opacity: 1; } }
.lab { font-family: var(--font-serif); font-weight: 600; font-size: 28px; letter-spacing: .6em; padding-left: .6em; white-space: nowrap; display: flex; align-items: center; gap: 22px; }
.lab::before, .lab::after { content: ""; width: 70px; height: 1.5px; background: linear-gradient(90deg, transparent, var(--k2)); }
.lab::after { transform: scaleX(-1); }
.metal { background: var(--tg); background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
.foil { animation: foil 3.6s var(--fd) linear infinite; }
@keyframes foil { from { background-position: 100% 0; } to { background-position: -160% 0; } }
.t-cap { --tg: linear-gradient(100deg, #6FA9C9 0%, #CFEFFA 24%, #FFFFFF 40%, #CFEFFA 56%, #6FA9C9 100%); --k2: #A9DDF0; }
.t-adm { --tg: linear-gradient(100deg, #A8733E 0%, #F0CF97 22%, #FFF6E6 38%, #E3C2F2 52%, #F0CF97 64%, #A8733E 100%); --k2: #E6BF86; }
.t-gov { --tg: linear-gradient(100deg, #9C6A24 0%, #E4BD72 24%, #FFF4D6 40%, #E4BD72 56%, #9C6A24 100%); --k2: #E8C07A; }
.nmwrap { display: flex; align-items: center; gap: 22px; }
.nm { font-family: var(--font-serif); font-weight: 900; line-height: 1.2; white-space: nowrap; max-width: 880px; overflow: hidden; text-overflow: ellipsis; padding: 0 .08em;
  filter: drop-shadow(0 1.5px 0 rgba(30,16,2,.95)) drop-shadow(0 6px 18px rgba(0,0,0,.6)); opacity: 0; animation: brush 1.2s var(--nd) cubic-bezier(.5,0,.2,1) forwards; }
.t-cap .nm { font-size: 56px; } .t-adm .nm { font-size: 68px; } .t-gov .nm { font-size: 76px; }
.t-cap .lab { font-size: 24px; } .t-adm .lab { font-size: 26px; }
@keyframes brush { from { opacity: 1; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
.seal { width: var(--ss); height: var(--ss); flex: none; opacity: 0; animation: stamp .45s var(--sd) cubic-bezier(.3,1.6,.5,1) forwards; filter: drop-shadow(0 4px 10px rgba(0,0,0,.55)); }
.seal svg { width: 100%; height: 100%; display: block; overflow: visible; }
@keyframes stamp { from { opacity: 0; transform: scale(1.9) rotate(-4deg); } to { opacity: 1; transform: rotate(-4deg); } }
.glint { position: absolute; left: var(--px); top: var(--py); width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); opacity: 0; animation: glint 1.6s var(--d) ease-in-out forwards; }
.glint svg { width: 100%; height: 100%; display: block; }
@keyframes glint { 0% { opacity: 0; transform: scale(.2) rotate(0); } 40% { opacity: 1; transform: scale(1) rotate(45deg); } 100% { opacity: 0; transform: scale(.3) rotate(90deg); } }
.dust { position: absolute; left: var(--px); top: var(--py); width: var(--s); height: var(--s); border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); opacity: 0; animation: dust var(--t) var(--d) linear forwards; }
@keyframes dust { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: .9; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
/* 部件动画 */
.pillar { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); animation: grow .9s var(--d) cubic-bezier(.16,1,.3,1) forwards; }
.grow-x { transform-box: fill-box; transform-origin: 50% 50%; transform: scaleX(0); animation: grow 1s var(--d) cubic-bezier(.16,1,.3,1) forwards; }
@keyframes grow { to { transform: none; } }
.drop { opacity: 0; transform: translateY(-60px); animation: drop 1.1s var(--d) cubic-bezier(.16,1,.3,1) forwards; }
@keyframes drop { to { opacity: 1; transform: none; } }
.cloud { opacity: 0; animation: cloudIn 1.5s var(--d) cubic-bezier(.16,1,.3,1) forwards; }
.cloud > g { animation: bob 4.4s var(--bd) ease-in-out infinite; }
@keyframes cloudIn { from { opacity: 0; transform: translateX(var(--fx)); } to { opacity: 1; transform: none; } }
@keyframes bob { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(6px, -8px); } }
.tassel { opacity: 0; animation: fin .6s var(--d) forwards; }
.tassel > g { transform-box: fill-box; transform-origin: 50% 0; animation: sway 3.2s var(--d) ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
.star { opacity: 0; animation: starIn 1.1s var(--d) cubic-bezier(.55,0,.25,1) forwards; }
@keyframes starIn { 0% { opacity: 0; transform: translateY(-380px) scale(.4); } 25% { opacity: 1; } 100% { opacity: 1; transform: none; } }
.flash { opacity: 0; transform-box: fill-box; transform-origin: center; animation: flash .9s var(--d) ease-out forwards; }
@keyframes flash { 0% { opacity: 0; transform: scale(.2); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(2.2); } }
.mist { transform-box: fill-box; transform-origin: center; opacity: 0; animation: fin 1.4s var(--d) forwards, mist 7s var(--d) ease-in-out infinite alternate; }
@keyframes mist { from { transform: translate(-30px, 10px) scale(1); } to { transform: translate(30px, -16px) scale(1.12); } }
.lglow { animation: lpulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes lpulse { 0%, 100% { opacity: .7; transform: scale(.95); } 50% { opacity: 1; transform: scale(1.06); } }
.ringIn { transform-box: fill-box; transform-origin: center; opacity: 0; transform: scale(.9); animation: drop2 1s var(--d) cubic-bezier(.16,1,.3,1) forwards; }
@keyframes drop2 { to { opacity: 1; transform: none; } }
.bloom { transform-box: fill-box; transform-origin: 50% 100%; opacity: 0; transform: scale(.2); animation: drop2 .6s var(--d) cubic-bezier(.3,1.4,.5,1) forwards; }
.gem { opacity: 0; animation: fin .5s var(--d) ease-out forwards; }
.swp { animation: swp 1.6s var(--d) cubic-bezier(.45,0,.35,1) forwards; }
@keyframes swp { from { transform: translateX(0); } to { transform: translateX(1900px); } }
</style>
</head>

    tiles += `M${L.join(' L')} L${Rr.join(' L')} Z `;
    lights += `M${curve(x - hw * .35, .14).join(' L')} `;
    for (const t of [.3, .42, .54, .66, .78, .9]) { const [a, b] = q(x - hw, t), [c, e] = q(x + hw, t); joints += `M${f1(a)} ${f1(b)} Q${f1((a + c) / 2)} ${f1((b + e) / 2 + 2.4)} ${f1(c)} ${f1(e)} `; }
    const ey = eaveY(x);
    ends += `<circle cx="${f1(x)}" cy="${f1(ey - 1)}" r="5.4" fill="url(#pGov)" stroke="rgba(40,20,4,.7)" stroke-width=".8"/><circle cx="${f1(x)}" cy="${f1(ey - 1)}" r="1.7" fill="rgba(70,36,6,.7)"/>`;
    if (x + 7.5 < W - 10) drips += `M${f1(x + 3.5)} ${f1(eaveY(x + 7.5) + 1.5)} h8 l-4 7 Z `;
  }
  // 两侧面压暗一点，才有体积
  const side = (sg) => `M${curve(sg * W * HX).join(' L')} ${Array.from({ length: 11 }, (_, i) => { const x = sg * (W * HX + (W - W * HX) * i / 10); return `L${f1(x)} ${f1(eaveY(x))}`; }).join(' ')} L${curve(sg * W).reverse().join(' L')} Z`;
  const hip = (x, sw) => `<path d="M${curve(x).join(' L')}" fill="none" stroke="url(#mAdm)" stroke-width="${sw}" stroke-linecap="round"/><path d="M${curve(x - 1.2, .06).join(' L')}" fill="none" stroke="rgba(255,248,235,.45)" stroke-width=".9"/>`;
  let brackets = '';
  for (let x = -228; x <= 228; x += 24) brackets += `<rect x="${x - 4.5}" y="${f1(eaveY(x) + 8)}" width="9" height="7" rx="1.5" fill="url(#fAdm)"/>`;
  let lotus = '';
  for (let i = -3; i <= 3; i++) lotus += `<path d="M${i * 6.5} ${apex + 4} C${i * 6.5 - 5} ${apex - 2} ${i * 7.5 - 2} ${apex - 10} ${i * 8} ${apex - 12} C${i * 7.5 + 3} ${apex - 10} ${i * 6.5 + 5} ${apex - 2} ${i * 6.5} ${apex + 4}Z" fill="url(#fAdm)" stroke="rgba(70,36,8,.5)" stroke-width=".6"/>`;
  return `<g class="drop" style="--d:${d}s"><path d="M${curve(-W).join(' L')} ${eave.replace(/^M/, 'L')} L${curve(W).reverse().join(' L')} Z" fill="#1A0820"/>` +
    `<path d="${tiles}" fill="url(#tilePurple)"/><path d="${lights}" fill="none" stroke="rgba(244,214,246,.3)" stroke-width="1.2"/><path d="${joints}" fill="none" stroke="rgba(18,4,22,.55)" stroke-width="1.1"/>` +
    `<path d="${side(-1)}" fill="rgba(10,2,14,.34)"/><path d="${side(1)}" fill="rgba(10,2,14,.34)"/>` +
    `<path d="${eave}" fill="none" stroke="url(#mAdm)" stroke-width="4.5" stroke-linecap="round"/><path d="${drips}" fill="url(#fAdm)"/>${ends}` +
    `<path d="M${-W} ${f1(eaveY(-W))} q-16 -4 -24 -26 M${W} ${f1(eaveY(W))} q16 -4 24 -26" fill="none" stroke="url(#mAdm)" stroke-width="5" stroke-linecap="round"/>` +
    hip(-W, 6) + hip(W, 6) + hip(-W * HX, 4.2) + hip(W * HX, 4.2) +
    `${brackets}<ellipse cx="0" cy="${apex + 2}" rx="24" ry="8" fill="url(#fAdm)"/>${lotus}<circle cx="0" cy="${apex - 22}" r="12" fill="url(#pGov)" stroke="#FFF1E0" stroke-width="1"/><circle cx="0" cy="${apex - 40}" r="7.5" fill="url(#pGov)" stroke="#FFF1E0" stroke-width=".8"/><path d="M0 ${apex - 48} V${apex - 62}" stroke="url(#mAdm)" stroke-width="2.4" stroke-linecap="round"/></g>`;
}
function adm(name) {
  const T = TIER.adm, root = h('div', 'hero t-adm', { '--dur': T.dur + 's' });
  root.append(h('div', 'dim'));
  const halo = `<circle r="480" fill="url(#haloAdm)" class="f" style="--d:.1s"/><defs><mask id="yunmA"><circle r="440" fill="url(#fade)"/></mask></defs><g opacity=".07"><g mask="url(#yunmA)" class="f" style="--d:.4s;--t:1.6s"><rect x="-440" y="-440" width="880" height="880" fill="url(#yunwen)"/></g></g>`;
  const ring = octRing(122, .2).s;
  const cl = `<g opacity=".85">${cloud(T, -372, 104, 1, -1, 1.2, 0) + cloud(T, 372, 104, 1, 1, 1.3, -1.4) + cloud(T, -446, -118, .7, 1, 1.5, -.7) + cloud(T, 446, -118, .7, -1, 1.6, -2.1)}</g>`;
  const posts = pillarPair(226, 20, -168, 206, 'post', 'fAdm', '#F4DCFF', .3) + [[228, 262, 2.2], [242, 290, 1.4], [256, 318, 1]].map(([y, w, sw], i) => P(`M0 ${y} H${-w}`, .45 + i * .08, .9, 'url(#mAdm)', sw) + P(`M0 ${y} H${w}`, .45 + i * .08, .9, 'url(#mAdm)', sw)).join('');
  root.append(lay(`${halo}${cl}${posts}${ring}`));
  root.append(avatarEl(name, 244, .9, 3));
  const lintel = `<g class="grow-x" style="--d:.95s"><rect x="-246" y="-186" width="492" height="15" fill="#240A2A"/><rect x="-246" y="-186" width="492" height="15" fill="url(#huiwen)"/><path d="M-248 -188 H248" stroke="url(#mAdm)" stroke-width="2.6"/><path d="M-248 -169 H248" stroke="url(#mAdm)" stroke-width="2"/></g>`;
  const queti = `<g class="f" style="--d:1.2s"><path d="M-226 -167 Q-196 -167 -176 -180 L-226 -180Z M226 -167 Q196 -167 176 -180 L226 -180Z" fill="url(#fAdm)" stroke="rgba(255,244,214,.6)" stroke-width=".8"/></g>`;
  const roof = pavilion(1.1);
  const pearlFlash = `<circle cx="0" cy="-322" r="70" fill="url(#gFlash)" class="flash" style="--d:2.3s"/>`;
  root.append(lay(`${queti}${lintel}${roof}${pearlFlash}${tassel(-282, -246, 40, '#6A2C72', 1.8, 'pAdm')}${tassel(282, -246, 40, '#6A2C72', 1.8, 'pAdm')}${sweep(posts + ring + lintel + roof + cl, 3.1)}`));
  [[0, -372, 22, 3.3], [-460, 50, 20, 2.8], [460, 50, 20, 3], [-282, -214, 16, 3.6], [282, -214, 16, 3.9]].forEach((g) => root.append(glintEl(g)));
  root.append(...dusts(16, T.dust, 340, 1.2, 4.5));
  texts(root, T, 'adm', name, 300, { lab: 1.7, nm: 2, seal: 3 });
  return root;
}

// ---------- 总督 · 金銮 ----------
function gov(name) {
  const T = TIER.gov, root = h('div', 'hero t-gov', { '--dur': T.dur + 's' });
  root.append(h('div', 'dim'));
  const bg = `<circle r="520" fill="url(#halo)" class="f" style="--d:.1s"/><defs><mask id="yunm"><circle r="460" fill="url(#fade)"/></mask></defs><g opacity=".08"><g mask="url(#yunm)" class="f" style="--d:.4s;--t:1.6s"><rect x="-460" y="-460" width="920" height="920" fill="url(#yunwen)"/></g></g>`;
  // 屋顶：琉璃瓦（一道道筒瓦）+ 圆形瓦当 + 屋檐 + 屋脊 + 宝珠
  const eaveY = (x) => -206 - 34 * (1 - Math.pow(x / 310, 2));
  const ridgeY = (x) => -262 - 14 * (1 - Math.pow(x / 236, 2));
  let tiles = '', ends = '';
  for (let x = -228; x <= 228; x += 19) {
    const ex = x * 1.3, ey = eaveY(ex);
    tiles += `<path d="M${x} ${f1(ridgeY(x) + 5)} Q${f1(x * 1.15)} ${f1((ridgeY(x) + ey) / 2)} ${f1(ex)} ${f1(ey - 5)}" fill="none" stroke="url(#tile)" stroke-width="7.5" stroke-linecap="round"/>`;
    tiles += `<path d="M${f1(x + 9.5)} ${f1(ridgeY(x + 9.5) + 5)} Q${f1((x + 9.5) * 1.15)} ${f1((ridgeY(x + 9.5) + eaveY((x + 9.5) * 1.3)) / 2)} ${f1((x + 9.5) * 1.3)} ${f1(eaveY((x + 9.5) * 1.3) - 4)}" fill="none" stroke="rgba(40,22,2,.65)" stroke-width="1.3"/>`;
    ends += `<circle cx="${f1(ex)}" cy="${f1(ey - 3)}" r="6.2" fill="url(#pGov)" stroke="rgba(60,34,4,.7)" stroke-width=".8"/><circle cx="${f1(ex)}" cy="${f1(ey - 3)}" r="2" fill="rgba(90,52,8,.7)"/>`;
  }
  let brackets = '';
  for (let x = -260; x <= 260; x += 26) brackets += `<rect x="${x - 5}" y="${f1(eaveY(x) + 4)}" width="10" height="8" rx="1.5" fill="url(#fGov)"/>`;
  const roofFill = `M-310 -206 C-250 -212 -120 -240 0 -240 C120 -240 250 -212 310 -206 L236 -262 C120 -276 -120 -276 -236 -262 Z`;
  const roof = `<g class="drop" style="--d:1.25s"><path d="${roofFill}" fill="url(#roof)"/>${tiles}${ends}` +
    `<path d="M-310 -206 C-250 -212 -120 -240 0 -240 C120 -240 250 -212 310 -206" fill="none" stroke="url(#mGov)" stroke-width="5" stroke-linecap="round"/>` +
    `<path d="M-310 -206 Q-328 -210 -338 -232 M310 -206 Q328 -210 338 -232" fill="none" stroke="url(#mGov)" stroke-width="5" stroke-linecap="round"/>` +
    `<path d="M-236 -262 C-120 -276 120 -276 236 -262" fill="none" stroke="url(#mGov)" stroke-width="7" stroke-linecap="round"/><path d="M-230 -264 C-120 -278 120 -278 230 -264" fill="none" stroke="rgba(255,250,235,.55)" stroke-width="1.2"/>` +
    `<path d="M-236 -262 q-12 -22 6 -32 q14 -6 12 8 M236 -262 q12 -22 -6 -32 q-14 -6 -12 8" fill="none" stroke="url(#mGov)" stroke-width="4" stroke-linecap="round"/>` +
    `${brackets}<path d="M0 -276 C-10 -290 -6 -304 0 -314 C6 -304 10 -290 0 -276Z" fill="url(#fGov)"/><circle cx="0" cy="-292" r="13" fill="url(#pGov)" stroke="#FFF4D6" stroke-width="1"/></g>`;
  const star = `<g class="star" style="--d:2.6s"><path d="${STAR(0, -292, 22)}" fill="#FFF8E6"/></g><circle cx="0" cy="-292" r="80" fill="url(#gFlash)" class="flash" style="--d:3.6s"/>`;
  const pillar = (side) => { const x = side < 0 ? -226 : 208, cx = x + 9;
    return `<g class="pillar" style="--d:.3s"><rect x="${x}" y="-176" width="18" height="388" fill="url(#pillar)"/><path d="M${x + 5} -168 V206" stroke="#FFD2B8" stroke-width="1.2" opacity=".35"/>` +
      `<rect x="${x - 6}" y="-188" width="30" height="14" rx="2" fill="url(#fGov)"/><rect x="${x - 6}" y="-176" width="30" height="3" fill="rgba(60,30,4,.6)"/>` +
      `<path d="M${cx - 18} 212 h36 l5 14 h-46z" fill="url(#fGov)"/><ellipse cx="${cx}" cy="228" rx="26" ry="5" fill="url(#fGov)"/></g>`; };
  const queti = `<g class="f" style="--d:1.3s"><path d="M-208 -174 Q-176 -174 -156 -186 L-208 -186Z M208 -174 Q176 -174 156 -186 L208 -186Z" fill="url(#fGov)" stroke="rgba(255,244,214,.6)" stroke-width=".8"/></g>`;
  const lintel = `<g class="grow-x" style="--d:1.05s"><rect x="-250" y="-201" width="500" height="16" fill="url(#huiwen)"/><path d="M-252 -203 H252" stroke="url(#mGov)" stroke-width="2.6"/><path d="M-252 -183 H252" stroke="url(#mGov)" stroke-width="2.2"/></g>`;
  const base = [[232, 262, 2.4], [246, 290, 1.5], [260, 318, 1]].map(([y, w, sw], i) => P(`M0 ${y} H${-w}`, .5 + i * .08, .9, 'url(#mGov)', sw) + P(`M0 ${y} H${w}`, .5 + i * .08, .9, 'url(#mGov)', sw)).join('');
  const gate = royalRing('gov', 130, .6).s;
  const cl = cloud(T, -340, 96, 1.3, -1, 1.5, 0) + cloud(T, 340, 96, 1.3, 1, 1.6, -1.5) + cloud(T, -420, -110, .85, 1, 1.8, -.8) + cloud(T, 420, -110, .85, -1, 1.9, -2.2);
  const backGold = `${pillar(-1)}${pillar(1)}${base}${gate}`;
  root.append(lay(`${bg}${cl}${backGold}`));
  root.append(avatarEl(name, 260, 1.3, 4.6));
  const front = `${queti}${lintel}${roof}`;
  root.append(lay(`${front}${star}${tassel(-338, -230, 50, '#C0392B', 2, 'pGov')}${tassel(338, -230, 50, '#C0392B', 2, 'pGov')}${sweep(backGold + front + cl, 4.4)}`));
  [[0, -330, 26, 4.1], [-440, 20, 22, 3.2], [440, 20, 22, 3.5], [-330, 260, 20, 3.8], [330, 260, 20, 4.2]].forEach((g) => root.append(glintEl(g)));
  root.append(...dusts(22, T.dust, 360, 1.5, 6));
  texts(root, T, 'gov', name, 304, { lab: 2.5, nm: 2.9, seal: 4 });
  return root;
}

// ---------- 播放 ----------
const BUILD = { cap, adm, gov };
document.querySelectorAll('.seg').forEach((seg) => seg.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; state[seg.dataset.k] = b.dataset.v; save(); sync(); play(); }));
$('#replay').onclick = () => play();
$('#auto').onclick = () => { state.auto = !state.auto; save(); sync(); play(); };
function sync() {
  document.querySelectorAll('.seg').forEach((seg) => seg.querySelectorAll('button').forEach((b) => b.classList.toggle('on', state[seg.dataset.k] === b.dataset.v)));
  $('#desc').innerHTML = DESC[state.tier];
  $('#auto').classList.toggle('on', state.auto); $('#auto').textContent = state.auto ? '自动连播中' : '自动连播';
  const st = $('#stage');
  st.className = 'stage' + (state.bg === 'dark' ? ' sc-dark' : state.bg === 'light' ? ' sc-light' : '') + (state.safe === '0' ? ' no-safe' : '');
  st.style.setProperty('--hy', state.pos + '%');
}
let timer = 0;
function play() {
  clearTimeout(timer);
  const st = $('#stage');
  st.querySelectorAll('.hero').forEach((n) => n.remove());
  const T = TIER[state.tier], el = BUILD[state.tier](NAMES[state.name]);
  st.append(el);
  $('#capline').textContent = `${T.title} · ${T.dur} 秒`;
  if (q.has('shot')) return;
  timer = setTimeout(() => { if (state.auto) { const o = ['cap', 'adm', 'gov']; state.tier = o[(o.indexOf(state.tier) + 1) % 3]; save(); sync(); play(); } else el.remove(); }, T.dur * 1000 + 400);
}
function fit() {
  const view = $('#view'), fr = $('#frame');
  const s = Math.min((view.clientWidth - 32) / 1080, (view.clientHeight - 48) / 1920);
  fr.style.width = 1080 * s + 'px'; fr.style.height = 1920 * s + 'px'; $('#stage').style.transform = `scale(${s})`;
}
addEventListener('resize', fit);
window.__freeze = (t) => { clearTimeout(timer); document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t * 1000; }); };
sync(); fit(); play();
</script>
