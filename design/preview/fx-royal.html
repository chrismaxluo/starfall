<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星临 · 总督设计</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/serif.css">
<style>
:root { --font-sans: "Geist", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; --font-serif: "Noto Serif SC", "Songti SC", "SimSun", serif; --font-mono: "Geist Mono", "Geist", ui-monospace, monospace;
  --bg: #0B0B10; --panel: #121218; --line: rgba(255,255,255,.08); --text: #EDEDF1; --mute: #A6A8B4; --dim: #80838F; --acc: #8D8BFF; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
.app { height: 100%; display: grid; grid-template-columns: 320px 1fr; }
.side { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 22px 18px 40px; }
.side h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.side h1 img { width: 22px; height: 22px; }
.side .sub { color: var(--dim); font-size: 12.5px; line-height: 1.6; }
.side .sub a { color: var(--acc); }
.grp { margin-top: 18px; }
.grp > b { display: block; font-size: 11.5px; letter-spacing: .12em; color: var(--dim); font-weight: 500; margin-bottom: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; background: #0D0D12; padding: 3px; border-radius: 9px; border: 1px solid var(--line); }
.seg button { flex: 1; border: 0; background: transparent; padding: 7px 8px; border-radius: 7px; font-size: 12.5px; color: var(--mute); white-space: nowrap; }
.seg button.on { background: #26262F; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.seg.big button { padding: 11px 8px; font-size: 14px; }
.row { display: flex; gap: 8px; margin-top: 18px; }
.btn { flex: 1; height: 38px; border-radius: 9px; border: 0; background: var(--acc); color: #0B0B12; font-weight: 600; font-size: 13.5px; }
.btn.sec { background: #22222B; color: var(--text); }
.btn.sec.on { background: rgba(61,214,140,.16); color: #3DD68C; }
.note { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: #0D0D12; border: 1px solid var(--line); font-size: 12.5px; line-height: 1.75; color: var(--mute); }
.note b { color: var(--text); font-weight: 600; }
.view { position: relative; overflow: hidden; display: grid; place-items: center; }
.frame { position: relative; flex: none; }
.frame > .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.cap-line { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 12px; color: var(--dim); font-family: var(--font-mono); }
@media (max-width: 820px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100%; } .side { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; } .view { height: 78vh; } }

.stage { width: 1080px; height: 1920px; overflow: hidden; --st: 12%; --sb: 40%; --hy: 40%;
  background-color: #15151C; background-image: linear-gradient(45deg, #1C1C25 25%, transparent 25%, transparent 75%, #1C1C25 75%), linear-gradient(45deg, #1C1C25 25%, transparent 25%, transparent 75%, #1C1C25 75%);
  background-size: 64px 64px; background-position: 0 0, 32px 32px; box-shadow: 0 0 0 2px rgba(255,255,255,.14); }
.stage.sc-dark { background: radial-gradient(700px 500px at 70% 20%, rgba(88,120,190,.45), transparent 70%), radial-gradient(600px 500px at 20% 90%, rgba(40,90,80,.45), transparent 70%), linear-gradient(170deg, #1B2233, #0A0C12); }
.stage.sc-light { background: radial-gradient(700px 600px at 30% 20%, #FFE9D6, transparent 70%), radial-gradient(700px 600px at 80% 70%, #D9ECFF, transparent 70%), linear-gradient(170deg, #F6F1EA, #E6EEF6); }
.person { position: absolute; left: 50%; top: 520px; width: 0; height: 0; display: none; }
.stage.sc-dark .person, .stage.sc-light .person { display: block; }
.person::before { content: ""; position: absolute; left: -165px; top: 0; width: 330px; height: 380px; border-radius: 50% 50% 46% 46%; background: #C9A690; }
.person::after { content: ""; position: absolute; left: -380px; top: 420px; width: 760px; height: 900px; border-radius: 380px 380px 0 0; background: #4A5670; }
.stage.sc-dark .person::before { background: #6E5A50; } .stage.sc-dark .person::after { background: #2A3244; }
.safe { position: absolute; left: 0; right: 0; z-index: 50; pointer-events: none; display: flex; align-items: center; justify-content: center; font-size: 22px; letter-spacing: .1em; color: rgba(255,255,255,.5); background: repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 14px, transparent 14px 28px); }
.safe.top { top: 0; height: var(--st); border-bottom: 2px dashed rgba(255,255,255,.25); }
.safe.bot { bottom: 0; height: var(--sb); border-top: 2px dashed rgba(255,255,255,.25); }
.stage.no-safe .safe { display: none; }

/* ================= 公用 ================= */
.hero { position: absolute; left: 50%; top: var(--hy); width: 0; height: 0; animation: heroOut .7s calc(var(--dur) - .7s) ease-in forwards; }
@keyframes heroOut { to { opacity: 0; transform: translateY(-18px) scale(.985); } }
.lay { position: absolute; left: -540px; top: -650px; width: 1080px; height: 1300px; overflow: visible; }
.dim { position: absolute; left: -1600px; top: -2200px; width: 3200px; height: 4400px; opacity: 0; animation: fin .9s forwards; }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: dash var(--t, 1s) var(--d, 0s) cubic-bezier(.65,0,.35,1) forwards; }
@keyframes dash { to { stroke-dashoffset: 0; } }
@keyframes fin { to { opacity: 1; } }
@keyframes fout { to { opacity: 0; } }
.f { opacity: 0; animation: fin var(--t, .8s) var(--d, 0s) ease-out forwards; }
.avw { position: absolute; left: calc(var(--av) / -2); top: calc(var(--av) / -2); width: var(--av); height: var(--av); border-radius: 50%; overflow: hidden; background: #1A140A; }
.avw img, .avw .ini { width: 100%; height: 100%; object-fit: cover; display: grid; place-items: center; font-size: 96px; font-weight: 600; color: #fff; font-family: var(--font-serif); }
.avw::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 30px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,240,200,.25); }
.avw i { position: absolute; top: -20%; bottom: -20%; width: 30%; left: -60%; background: linear-gradient(90deg, transparent, rgba(255,245,220,.45), transparent); transform: skewX(-20deg); animation: sweep 1.4s var(--shd, 3s) cubic-bezier(.4,0,.2,1) forwards; z-index: 2; }
@keyframes sweep { to { left: 140%; } }
.tx { position: absolute; left: -540px; width: 1080px; display: flex; justify-content: center; align-items: center; top: var(--y); transform: translateY(-50%); }
.tx > * { opacity: 0; animation: var(--an, upIn) var(--t, 1s) var(--d, 1s) cubic-bezier(.16,1,.3,1) forwards; }
@keyframes upIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes trackIn { from { opacity: 0; letter-spacing: 1.2em; } to { opacity: 1; } }
.gold { background: linear-gradient(100deg, #9C6A24 0%, #E4BD72 24%, #FFF4D6 40%, #E4BD72 56%, #9C6A24 100%); background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
.foil { animation: foil 3.6s var(--fd, 4s) linear infinite; }
@keyframes foil { from { background-position: 100% 0; } to { background-position: -160% 0; } }
.nm { font-family: var(--font-serif); font-weight: 900; font-size: 76px; line-height: 1.2; white-space: nowrap; max-width: 960px; overflow: hidden; text-overflow: ellipsis; padding: 0 .1em; filter: drop-shadow(0 2px 0 rgba(40,24,4,.9)) drop-shadow(0 6px 18px rgba(0,0,0,.55)); }
.nmwrap { display: flex; align-items: center; gap: 22px; }
.glint { position: absolute; left: var(--px); top: var(--py); width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); opacity: 0; animation: glint 1.6s var(--d) ease-in-out forwards; }
.glint svg { width: 100%; height: 100%; display: block; }
@keyframes glint { 0% { opacity: 0; transform: scale(.2) rotate(0); } 40% { opacity: 1; transform: scale(1) rotate(45deg); } 100% { opacity: 0; transform: scale(.3) rotate(90deg); } }

/* ================= 装饰艺术 · 金门 ================= */
.deco .dim { background: radial-gradient(circle at 50% 50%, rgba(22,15,4,.35), rgba(0,0,0,.7) 34%); }
.deco .ln { fill: none; stroke: url(#dGold); stroke-linecap: square; }
.deco .ray { fill: none; stroke: #E4BD72; stroke-linecap: round; }
.deco .door { animation: var(--dn) 1.1s 1.35s cubic-bezier(.7,0,.2,1) forwards; }
@keyframes doorL { to { transform: translateX(-206px); } }
@keyframes doorR { to { transform: translateX(206px); } }
.deco .seam { opacity: 0; animation: seam 1.4s .85s ease-in-out forwards; }
@keyframes seam { 0% { opacity: 0; transform: scaleX(1); } 30% { opacity: 1; transform: scaleX(1); } 60% { opacity: 1; transform: scaleX(3); } 100% { opacity: 0; transform: scaleX(8); } }
.deco .seam { transform-box: fill-box; transform-origin: center; }
.deco .innerglow { opacity: 0; animation: glowIn 2.4s 1.4s ease-out forwards; }
@keyframes glowIn { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: .55; } }
.deco .bar { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); animation: barIn .9s var(--d) cubic-bezier(.16,1,.3,1) forwards; }
@keyframes barIn { to { transform: scaleX(1); } }
.deco .crown { opacity: 0; transform: translateY(-50px); animation: crownIn 1s 2.3s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes crownIn { to { opacity: 1; transform: none; } }
.star { opacity: 0; animation: starIn 1.1s var(--d, 2.9s) cubic-bezier(.55,0,.25,1) forwards; }
@keyframes starIn { 0% { opacity: 0; transform: translateY(-380px) scale(.4); } 25% { opacity: 1; } 100% { opacity: 1; transform: none; } }
.flash { opacity: 0; transform-box: fill-box; transform-origin: center; animation: flash .9s var(--d, 3.95s) ease-out forwards; }
@keyframes flash { 0% { opacity: 0; transform: scale(.2); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(2.2); } }
.deco .lab1 { font-family: var(--font-sans); font-size: 15px; letter-spacing: .7em; padding-left: .7em; color: #E4BD72; font-weight: 500; }
.deco .lab2 { font-family: var(--font-serif); font-size: 28px; font-weight: 600; letter-spacing: .5em; padding-left: .5em; }
.deco .sy { font-family: var(--font-serif); font-size: 26px; font-weight: 600; letter-spacing: .4em; padding-left: .4em; color: #F3DDA8; text-shadow: 0 2px 10px rgba(0,0,0,.7); }
.deco .avw { opacity: 0; animation: fin .6s 1.5s forwards; }

/* ================= 东方宫廷 · 金銮 ================= */
.east .dim { background: radial-gradient(circle at 50% 50%, rgba(30,10,6,.3), rgba(6,2,0,.7) 34%); }
.east .ln { fill: none; stroke: url(#eGold); stroke-linecap: round; stroke-linejoin: round; }
.east .pillar { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); animation: grow .9s var(--d, .35s) cubic-bezier(.16,1,.3,1) forwards; }
@keyframes grow { to { transform: none; } }
.east .lintel { transform-box: fill-box; transform-origin: 50% 50%; transform: scaleX(0); animation: grow 1s 1.05s cubic-bezier(.16,1,.3,1) forwards; }
.east .roof { opacity: 0; transform: translateY(-60px); animation: crownIn 1.1s 1.2s cubic-bezier(.16,1,.3,1) forwards; }
.east .cloud { opacity: 0; animation: cloudIn 1.4s var(--d) cubic-bezier(.16,1,.3,1) forwards; }
.east .cloud > g { animation: bob 4.2s var(--bd, 0s) ease-in-out infinite; }
@keyframes cloudIn { from { opacity: 0; transform: translateX(var(--fx)); } to { opacity: 1; transform: none; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.east .tassel { opacity: 0; transform-box: view-box; animation: fin .6s 2s forwards; }
.east .tassel > g { transform-box: fill-box; transform-origin: 50% 0; animation: sway 3.2s 2s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
.east .avw { clip-path: circle(0 at 50% 50%); animation: iris 1.1s 1.25s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes iris { to { clip-path: circle(50% at 50% 50%); } }
.east .lab { font-family: var(--font-serif); font-size: 30px; font-weight: 600; letter-spacing: .6em; padding-left: .6em; }
.east .nm { --an: brush; }
@keyframes brush { from { opacity: 1; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
.seal { width: 74px; height: 74px; border-radius: 8px; flex: none; display: grid; place-items: center; background: radial-gradient(circle at 30% 25%, #D94A38, #A82A1E 70%); color: #FFE9D6; font-family: var(--font-serif); font-weight: 900; font-size: 27px; line-height: 1.05; writing-mode: vertical-rl; letter-spacing: .05em;
  box-shadow: inset 0 0 0 3px rgba(255,220,200,.35), inset 0 0 12px rgba(80,0,0,.5), 0 4px 14px rgba(0,0,0,.5); transform: rotate(-4deg); }
.tx > .seal, .nmwrap > .seal { opacity: 0; animation: stamp .45s var(--sd, 3.6s) cubic-bezier(.3,1.6,.5,1) forwards; }
@keyframes stamp { from { opacity: 0; transform: scale(1.8) rotate(-4deg); } to { opacity: 1; transform: rotate(-4deg); } }
.nmwrap { opacity: 1 !important; animation: none !important; }
.nmwrap .nm { opacity: 0; animation: brush 1.2s var(--nd, 2.9s) cubic-bezier(.5,0,.2,1) forwards; }
.east .sy { font-family: var(--font-serif); font-size: 26px; font-weight: 600; letter-spacing: .4em; padding-left: .4em; color: #F3DDA8; text-shadow: 0 2px 10px rgba(0,0,0,.7); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="dGold" x1="0" y1="-300" x2="0" y2="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFF1CC"/><stop offset=".45" stop-color="#E4BD72"/><stop offset="1" stop-color="#B07A2E"/></linearGradient>
    <linearGradient id="eGold" x1="0" y1="-320" x2="0" y2="320" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFF1CC"/><stop offset=".5" stop-color="#E8C07A"/><stop offset="1" stop-color="#B8843A"/></linearGradient>
    <linearGradient id="gFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4D6"/><stop offset=".45" stop-color="#E9C27A"/><stop offset="1" stop-color="#9C6A24"/></linearGradient>
    <linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7A4E16"/><stop offset=".35" stop-color="#C99440"/><stop offset=".75" stop-color="#F1D08E"/><stop offset="1" stop-color="#FFF6DE"/></linearGradient>
    <linearGradient id="gDoor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241A0B"/><stop offset=".5" stop-color="#161008"/><stop offset="1" stop-color="#241A0B"/></linearGradient>
    <linearGradient id="gSeam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFE7B0" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFE7B0" stop-opacity="0"/></linearGradient>
    <radialGradient id="gGlow"><stop offset="0" stop-color="#F7D58B" stop-opacity=".55"/><stop offset=".5" stop-color="#E4BD72" stop-opacity=".18"/><stop offset="1" stop-color="#E4BD72" stop-opacity="0"/></radialGradient>
    <radialGradient id="gFlash"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".3" stop-color="#FFF1CC" stop-opacity=".7"/><stop offset="1" stop-color="#F7D58B" stop-opacity="0"/></radialGradient>
    <radialGradient id="gPearl" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#FFFBEE"/><stop offset=".55" stop-color="#F2C46E"/><stop offset="1" stop-color="#9C6A24"/></radialGradient>
    <linearGradient id="gPillar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6E1E15"/><stop offset=".45" stop-color="#C0392B"/><stop offset=".6" stop-color="#D3553F"/><stop offset="1" stop-color="#6E1E15"/></linearGradient>
    <linearGradient id="gRoof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6DFA8" stop-opacity=".55"/><stop offset="1" stop-color="#B8843A" stop-opacity=".25"/></linearGradient>
    <pattern id="huiwen" width="30" height="16" patternUnits="userSpaceOnUse" x="-15" y="-201"><path d="M1 14 V2 H27 V12 H9 V7 H20" fill="none" stroke="#E8C07A" stroke-width="1.6"/></pattern>
    <symbol id="spark" viewBox="0 0 24 24"><path fill="#FFF1CC" d="M12 0c.8 6.6 3.1 9 12 12-8.9 3-11.2 5.4-12 12-.8-6.6-3.1-9-12-12 8.9-3 11.2-5.4 12-12z"/></symbol>
  </defs>
</svg>

<div class="app">
  <aside class="side">
    <h1><img src="assets/logo.svg" alt="">星临 · 总督设计</h1>
    <div class="sub">两个方向的总督进场（网页动画，线条为主）。看对了味道，再按同一风格做舰长和提督。其他特效在 <a href="fx.html">特效设计 v4</a>。</div>
    <div class="grp"><b>设计方向</b><div class="seg big" data-k="dir"><button data-v="deco">装饰艺术 · 金门</button><button data-v="east">东方宫廷 · 金銮</button></div></div>
    <div class="grp"><b>触发方式</b><div class="seg" data-k="event"><button data-v="enter">进场</button><button data-v="open">开通</button><button data-v="renew">续费</button></div></div>
    <div class="grp"><b>位置</b><div class="seg" data-k="pos"><button data-v="32">偏上</button><button data-v="40">居中</button><button data-v="48">偏下</button></div></div>
    <div class="grp"><b>头像</b><div class="seg" data-k="face"><button data-v="1">有头像</button><button data-v="0">没有头像</button></div></div>
    <div class="grp"><b>昵称</b><div class="seg" data-k="name"><button data-v="short">短</button><button data-v="mid">常见</button><button data-v="long">很长</button></div></div>
    <div class="grp"><b>背景</b><div class="seg" data-k="bg"><button data-v="alpha">透明格子</button><button data-v="dark">暗画面</button><button data-v="light">亮画面</button></div></div>
    <div class="grp"><b>安全区</b><div class="seg" data-k="safe"><button data-v="1">显示</button><button data-v="0">隐藏</button></div></div>
    <div class="row"><button class="btn" id="replay">重播</button><button class="btn sec" id="auto">自动连播</button></div>
    <div class="note" id="desc"></div>
  </aside>
  <main class="view" id="view">
    <div class="frame" id="frame"><div class="stage" id="stage"><div class="person"></div><div class="safe top">顶部信息栏</div><div class="safe bot">弹幕 / 礼物区</div></div></div>
    <div class="cap-line" id="capline"></div>
  </main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const FACE = 'https://i0.hdslb.com/bfs/face/3b1011461e9e74039c9cebae7dab6dfdf8f3711c.jpg';
const NAMES = { short: '星临', mid: '吃喵放花椒的喵酱', long: '今天也要早点睡觉的超长昵称啊' };
const DESC = {
  deco: '<b>装饰艺术 · 金门</b>（8 秒）<br>画面暗下来，三道金线从拱门两脚往上画，在顶端汇合；台阶线从中间向两边铺开。两扇金线门缝里先透出一道光，然后<b>门向两边打开</b>，贵宾的头像出现，背后是放射状的金线。两侧是几何线条的装饰艺术风翅膀，一根根伸出来；金冠落在拱门顶上，最后一颗星落进皇冠正中。门里写着「总督 · 驾临」，名字用宋体，金箔一样反光。',
  east: '<b>东方宫廷 · 金銮</b>（8 秒）<br>两根朱红宫柱从地面升起，金色月洞门一笔画成，回纹横梁从中间展开，金色飞檐屋顶落下，屋脊上有一颗宝珠，星星落进宝珠里；屋檐两角挂着流苏轻轻摆动，两边的祥云慢慢飘进来。头像像月洞门里慢慢展开，名字像毛笔写字一样从左到右出现，最后「啪」地盖上一枚红色「驾临」印章。',
};
const state = { dir: 'deco', event: 'enter', pos: '40', face: '1', name: 'mid', bg: 'alpha', safe: '1', auto: false };
try { Object.assign(state, JSON.parse(localStorage.getItem('sf-royal') || '{}')); } catch {}
const q = new URLSearchParams(location.search);
for (const k of ['dir', 'event', 'bg', 'pos', 'name', 'face']) if (q.get(k)) state[k] = q.get(k);
const save = () => { try { localStorage.setItem('sf-royal', JSON.stringify(state)); } catch {} };

const h = (tag, cls, style, ...kids) => { const e = document.createElement(tag); if (cls) e.className = cls; if (style) for (const [k, v] of Object.entries(style)) e.style.setProperty(k, v); for (const k of kids) if (k != null) e.append(k); return e; };
const NS = 'http://www.w3.org/2000/svg';
const lay = (inner) => { const s = document.createElementNS(NS, 'svg'); s.setAttribute('class', 'lay'); s.setAttribute('viewBox', '-540 -650 1080 1300'); s.innerHTML = inner; return s; };
const P = (d, d0, t, cls = 'ln', extra = '') => `<path d="${d}" pathLength="1" class="draw ${cls}" style="--d:${d0}s;--t:${t}s" ${extra}/>`;
const f1 = (n) => n.toFixed(1);
const avatarEl = (name, size, shd) => {
  const aw = h('div', 'avw', { '--av': size + 'px', '--shd': shd + 's' });
  if (state.face === '1') { const img = new Image(); img.referrerPolicy = 'no-referrer'; img.src = FACE; aw.append(img); }
  else aw.append(h('span', 'ini', { background: 'linear-gradient(135deg,#6B4A1A,#2A1C08)' }, [...name][0]));
  aw.append(h('i'));
  return aw;
};
const tx = (y, d, child, an, t) => h('div', 'tx', { '--y': y + 'px' }, (child.style.setProperty('--d', d + 's'), an && child.style.setProperty('--an', an), t && child.style.setProperty('--t', t + 's'), child));
const glints = (list) => list.map(([x, y, s, d]) => `<use href="#spark" x="${x - s / 2}" y="${y - s / 2}" width="${s}" height="${s}" class="glintS" style="--d:${d}s"/>`).join('');
const CROWN = [[14, 49], [15.5, 35.5], [23, 43], [28, 36.5], [32, 41], [36, 36.5], [41, 43], [48.5, 35.5], [50, 49]];
const STAR = (cx, cy, r) => `M${cx} ${cy - r} C${cx + r * .1} ${cy - r * .28} ${cx + r * .28} ${cy - r * .1} ${cx + r} ${cy} C${cx + r * .28} ${cy + r * .1} ${cx + r * .1} ${cy + r * .28} ${cx} ${cy + r} C${cx - r * .1} ${cy + r * .28} ${cx - r * .28} ${cy + r * .1} ${cx - r} ${cy} C${cx - r * .28} ${cy - r * .1} ${cx - r * .1} ${cy - r * .28} ${cx} ${cy - r}Z`;
const subLine = () => state.event === 'enter' ? '' : `${state.event === 'open' ? '开通' : '续费'}总督 · ${state.event === 'open' ? 1 : 3} 个月`;

// ================= 装饰艺术 · 金门 =================
function deco(name) {
  const root = h('div', 'hero deco', { '--dur': '8s' });
  root.append(h('div', 'dim'));
  const B = 240, S = -40;
  const arch = (r, side) => side < 0 ? `M${-r} ${B} V${S} A${r} ${r} 0 0 1 0 ${S - r}` : `M${r} ${B} V${S} A${r} ${r} 0 0 0 0 ${S - r}`;
  const stepped = (side) => { const k = side; return `M${k * 246} ${B} V-6 H${k * 230} V${S} A230 230 0 0 ${k < 0 ? 1 : 0} 0 ${S - 230}`; };
  // ---- 后层：外面的放射扇、翅膀、拱门线、门里的放射线 ----
  let fan = '';
  for (let i = 0; i <= 28; i++) { const a = Math.PI * (1.17 + i * .66 / 28), c = Math.cos(a), s = Math.sin(a), big = i % 4 === 0, r0 = 262, r1 = big ? 540 : 440;
    fan += P(`M${f1(c * r0)} ${f1(S + s * r0)} L${f1(c * r1)} ${f1(S + s * r1)}`, .25 + Math.abs(i - 14) * .035, 1.2, 'ray', `stroke-width="${big ? 1.8 : 1}" opacity="${big ? .5 : .28}"`); }
  let rays = '';
  for (let i = 0; i < 72; i++) { const a = i / 72 * Math.PI * 2, c = Math.cos(a), s = Math.sin(a), big = i % 3 === 0;
    rays += P(`M${f1(c * 150)} ${f1(s * 150)} L${f1(c * 560)} ${f1(s * 560)}`, 1.5 + (1 - Math.abs(Math.sin(a / 2 + Math.PI / 4))) * .2, 1.1, 'ray', `stroke-width="${big ? 1.6 : .9}" opacity="${big ? .55 : .3}"`); }
  // 几何翅膀：一根根金色长条，越往上越长、越往上翘
  let wing = '';
  const bars = [[-150, 250, 16], [-112, 236, 12], [-74, 214, 8], [-36, 186, 4], [2, 152, 0], [40, 112, -4]];
  bars.forEach(([y, L, ang], i) => {
    const rise = Math.tan(ang * Math.PI / 180) * L, hh = 8;
    const d = `M0 ${-hh} L${f1(L - 22)} ${f1(-hh - rise)} L${f1(L)} ${f1(-rise)} L${f1(L - 22)} ${f1(hh - rise)} L0 ${hh} Z`;
    const inner = `M6 0 L${f1(L - 26)} ${f1(-rise)}`;
    wing += `<g transform="translate(262 ${y})"><g class="bar" style="--d:${(1.95 + i * .07).toFixed(2)}s"><path d="${d}" fill="url(#gBar)" stroke="#FFF1CC" stroke-width="1" stroke-opacity=".7"/><path d="${inner}" stroke="#5A3A10" stroke-width="1.2" opacity=".55"/></g></g>`;
  });
  const wings = `<g>${wing}</g><g transform="scale(-1 1)">${wing}</g>`;
  const clip = `<clipPath id="archIn"><path d="M-200 ${B} V${S} A200 200 0 0 1 200 ${S} V${B} Z"/></clipPath><mask id="archOut"><rect x="-540" y="-650" width="1080" height="1300" fill="#fff"/><path d="M-246 ${B} V-6 H-230 V${S} A230 230 0 0 1 230 ${S} V-6 H246 V${B} Z" fill="#000"/></mask>`;
  const frames = [
    P(stepped(-1), .1, 1.25), P(stepped(1), .1, 1.25),
    P(arch(216, -1), .22, 1.15, 'ln', 'stroke-width="1.4"'), P(arch(216, 1), .22, 1.15, 'ln', 'stroke-width="1.4"'),
    P(arch(200, -1), .34, 1.05, 'ln', 'stroke-width="2.6"'), P(arch(200, 1), .34, 1.05, 'ln', 'stroke-width="2.6"'),
  ].join('');
  const plinth = [[252, 312, 2.2], [266, 282, 1.3], [280, 252, 1]].map(([y, w, sw], i) => P(`M0 ${y} H${-w}`, .3 + i * .08, .9, 'ln', `stroke-width="${sw}"`) + P(`M0 ${y} H${w}`, .3 + i * .08, .9, 'ln', `stroke-width="${sw}"`)).join('');
  // 拱门两侧的竖向凹槽线
  const flutes = [-238, -222, 222, 238].map((x, i) => P(`M${x} ${B - 6} V20`, .6 + (i % 2) * .08, .8, 'ln', 'stroke-width=".9" opacity=".6"')).join('');
  root.append(lay(`<defs>${clip}</defs><g mask="url(#archOut)">${fan}</g>${wings}<g clip-path="url(#archIn)"><circle r="260" fill="url(#gGlow)" class="innerglow"/>${rays}</g>${frames}${plinth}${flutes}`));
  // ---- 头像 ----
  root.append(avatarEl(name, 250, 3.3));
  // ---- 前层：门、门缝光、头像圆框、皇冠、星星 ----
  let doorDeco = '';
  for (const side of [-1, 1]) {
    const cx = side * 100;
    let chev = '';
    for (let k = 0; k < 6; k++) chev += `<path d="M${cx - 46 + k * 7} ${f1(60 - k * 26)} L${cx} ${f1(10 - k * 26)} L${cx + 46 - k * 7} ${f1(60 - k * 26)}" fill="none" stroke="#E4BD72" stroke-width="1.2" opacity="${(.85 - k * .1).toFixed(2)}"/>`;
    doorDeco += `<g class="door" style="--dn:${side < 0 ? 'doorL' : 'doorR'}"><rect x="${side < 0 ? -200 : 0}" y="-260" width="200" height="520" fill="url(#gDoor)"/>` +
      `<rect x="${side < 0 ? -186 : 14}" y="-230" width="172" height="456" fill="none" stroke="#E4BD72" stroke-width="1.2" opacity=".7"/>` +
      `<path d="M${side * 6} -260 V${B}" stroke="#E4BD72" stroke-width="1" opacity=".8"/>` + chev +
      `<circle cx="${side * 22}" cy="40" r="6" fill="url(#gFill)"/></g>`;
  }
  const ringHalf = (r, side, d0, sw) => P(`M0 ${-r} A${r} ${r} 0 0 ${side < 0 ? 0 : 1} 0 ${r}`, d0, 1, 'ln', `stroke-width="${sw}"`);
  const rings = ringHalf(133, -1, 1.55, 3) + ringHalf(133, 1, 1.55, 3) + ringHalf(146, -1, 1.7, 1.2) + ringHalf(146, 1, 1.7, 1.2);
  const dia = [[0, -146], [146, 0], [0, 146], [-146, 0]].map(([x, y]) => `<path d="M${x} ${y - 9} L${x + 6} ${y} L${x} ${y + 9} L${x - 6} ${y}Z" fill="url(#gFill)" class="f" style="--d:2.2s"/>`).join('');
  const s = 170 / 36, cy = S - 230 - 4;
  const cp = CROWN.map(([x, y]) => `${f1((x - 32) * s)} ${f1(cy + (y - 49) * s)}`).join(' L');
  const crown = `<g class="crown"><path d="M${cp} Z" fill="url(#gFill)" stroke="#FFF4D6" stroke-width="1.2" stroke-linejoin="round"/>` +
    `<path d="M${CROWN.map(([x, y]) => `${f1((x - 32) * s * .78)} ${f1(cy - 5 + (y - 49) * s * .72)}`).join(' L')}" fill="none" stroke="#6B4511" stroke-width="1.2" opacity=".6"/>` +
    `<rect x="${f1(-18 * s)}" y="${f1(cy - 2)}" width="${f1(36 * s)}" height="14" rx="3" fill="url(#gFill)" stroke="#FFF4D6" stroke-width="1"/>` +
    [[15.5, 35.5], [48.5, 35.5]].map(([x, y]) => `<circle cx="${f1((x - 32) * s)}" cy="${f1(cy + (y - 49) * s)}" r="8" fill="url(#gPearl)"/>`).join('') + `</g>`;
  const sy = cy + (28.5 - 49) * s;
  const star = `<g class="star"><path d="${STAR(0, sy, 30)}" fill="url(#gFill)" stroke="#FFF8E6" stroke-width="1"/></g><circle cx="0" cy="${f1(sy)}" r="90" fill="url(#gFlash)" class="flash"/>`;
  root.append(lay(`<g clip-path="url(#archIn)">${doorDeco}<rect x="-3" y="-260" width="6" height="520" fill="url(#gSeam)" class="seam"/></g>${rings}${dia}${crown}${star}`));
  // ---- 文字 ----
  const g = [[0, S - 262, 30, 4.3], [-470, -150, 26, 3.1], [470, -150, 26, 3.4], [-312, 252, 22, 3.7], [312, 252, 22, 4]];
  for (const [x, y, sz, d] of g) root.append(h('span', 'glint', { '--px': x + 'px', '--py': y + 'px', '--s': sz + 'px', '--d': d + 's' }, (() => { const s2 = document.createElementNS(NS, 'svg'); s2.setAttribute('viewBox', '0 0 24 24'); s2.innerHTML = '<use href="#spark"/>'; return s2; })()));
  root.append(tx(176, 2.4, h('div', 'lab1', null, 'GOVERNOR'), 'trackIn', 1.4));
  root.append(tx(214, 2.6, h('div', 'lab2 gold', null, state.event === 'enter' ? '总督 · 驾临' : (state.event === 'open' ? '开通 · 总督' : '续费 · 总督'))));
  const nm = h('div', 'nm', null, h('span', 'gold foil', { '--fd': '4.2s' }, name));
  root.append(tx(338, 2.8, nm, 'trackIn', 1.6));
  if (subLine()) root.append(tx(414, 3.3, h('div', 'sy', null, `${state.event === 'open' ? 1 : 3} 个月 · 感谢支持`)));
  return root;
}

// ================= 东方宫廷 · 金銮 =================
function cloudPath() {
  // 如意云头：三个卷，底边一条长尾
  return 'M0 0 C-6 -26 22 -40 40 -24 C46 -46 84 -50 96 -26 C114 -38 140 -26 134 -4 C150 -2 158 18 144 28 L-60 28 C-86 28 -92 2 -70 -4 C-62 -8 -46 -6 -40 2 C-34 -10 -12 -12 0 0 Z';
}
function cloudCurls() {
  return 'M40 -24 C44 -12 36 -2 26 -6 C18 -10 22 -20 30 -18 M96 -26 C98 -12 88 -6 80 -10 C74 -14 78 -22 84 -20 M134 -4 C128 6 116 4 116 -4';
}
function east(name) {
  const root = h('div', 'hero east', { '--dur': '8s' });
  root.append(h('div', 'dim'));
  // 屋顶
  const eaveY = (x) => -206 - 34 * (1 - Math.pow(x / 310, 2));
  const ridgeY = (x) => -262 - 14 * (1 - Math.pow(x / 236, 2));
  let tiles = '';
  for (let x = -220; x <= 220; x += 22) tiles += `<path d="M${x} ${f1(ridgeY(x) + 4)} Q${f1(x * 1.12)} ${f1((ridgeY(x) + eaveY(x * 1.25)) / 2)} ${f1(x * 1.25)} ${f1(eaveY(x * 1.25) - 3)}" fill="none" stroke="#E8C07A" stroke-width="1" opacity=".45"/>`;
  const roofFill = `M-310 -206 C-250 -212 -120 -240 0 -240 C120 -240 250 -212 310 -206 L236 -262 C120 -276 -120 -276 -236 -262 Z`;
  let brackets = '';
  for (let x = -260; x <= 260; x += 26) brackets += `<rect x="${x - 5}" y="${f1(eaveY(x) + 2)}" width="10" height="7" rx="1.5" fill="url(#gFill)" opacity=".75"/>`;
  const roof = `<g class="roof"><path d="${roofFill}" fill="url(#gRoof)"/>${tiles}` +
    `<path d="M-310 -206 C-250 -212 -120 -240 0 -240 C120 -240 250 -212 310 -206" fill="none" stroke="url(#eGold)" stroke-width="4" stroke-linecap="round"/>` +
    `<path d="M-310 -206 Q-328 -210 -338 -232 M310 -206 Q328 -210 338 -232" fill="none" stroke="url(#eGold)" stroke-width="4" stroke-linecap="round"/>` +
    `<path d="M-236 -262 C-120 -276 120 -276 236 -262" fill="none" stroke="url(#eGold)" stroke-width="5" stroke-linecap="round"/>` +
    `<path d="M-236 -262 q-12 -22 6 -32 q14 -6 12 8 M236 -262 q12 -22 -6 -32 q-14 -6 -12 8" fill="none" stroke="url(#eGold)" stroke-width="3.5" stroke-linecap="round"/>` +
    `${brackets}<path d="M0 -276 C-10 -290 -6 -304 0 -314 C6 -304 10 -290 0 -276Z" fill="url(#gFill)" opacity=".85"/>` +
    `<circle cx="0" cy="-292" r="13" fill="url(#gPearl)" stroke="#FFF4D6" stroke-width="1"/></g>`;
  const star = `<g class="star" style="--d:2.5s"><path d="${STAR(0, -292, 22)}" fill="#FFF8E6"/></g><circle cx="0" cy="-292" r="80" fill="url(#gFlash)" class="flash" style="--d:3.5s"/>`;
  // 流苏
  const tassel = (x) => `<g class="tassel"><g><path d="M${x} -230 V-176" stroke="#E8C07A" stroke-width="1.6"/><circle cx="${x}" cy="-172" r="6" fill="url(#gPearl)"/><path d="M${x - 7} -166 h14 l-3 10 h-8z" fill="#C0392B"/>` +
    [-6, -3, 0, 3, 6].map((o) => `<path d="M${x + o * .8} -156 L${x + o * 1.4} -120" stroke="#C0392B" stroke-width="1.4" opacity=".9"/>`).join('') + `</g></g>`;
  // 柱子、横梁、台基
  const pillar = (side) => { const x = side < 0 ? -226 : 208; return `<g class="pillar" style="--d:.3s"><rect x="${x}" y="-178" width="18" height="392" fill="url(#gPillar)"/><rect x="${x - 5}" y="-186" width="28" height="12" rx="2" fill="url(#gFill)"/><rect x="${x - 5}" y="210" width="28" height="12" rx="2" fill="url(#gFill)"/><path d="M${x + 4} -170 V204" stroke="#FFD2B8" stroke-width="1" opacity=".35"/></g>`; };
  const lintel = `<g class="lintel"><rect x="-250" y="-201" width="500" height="16" fill="url(#huiwen)"/><path d="M-252 -203 H252 M-252 -183 H252" stroke="url(#eGold)" stroke-width="2"/></g>`;
  const base = [[224, 262, 2.2], [238, 290, 1.4], [252, 318, 1]].map(([y, w, sw], i) => P(`M0 ${y} H${-w}`, .5 + i * .08, .9, 'ln', `stroke-width="${sw}"`) + P(`M0 ${y} H${w}`, .5 + i * .08, .9, 'ln', `stroke-width="${sw}"`)).join('');
  // 月洞门
  const half = (r, side, d0, sw) => P(`M0 ${-r} A${r} ${r} 0 0 ${side < 0 ? 0 : 1} 0 ${r}`, d0, 1.2, 'ln', `stroke-width="${sw}"`);
  const moon = `<circle r="150" fill="rgba(16,8,2,.55)" class="f" style="--d:.9s"/>` + half(150, -1, .6, 3.2) + half(150, 1, .6, 3.2) + half(166, -1, .75, 1.4) + half(166, 1, .75, 1.4) +
    `<circle r="158" fill="none" stroke="#E8C07A" stroke-width="3.4" stroke-dasharray="0 11.2" stroke-linecap="round" class="f" style="--d:1.6s"/>` +
    [[0, -166], [166, 0], [0, 166], [-166, 0]].map(([x, y], i) => `<g transform="translate(${x} ${y}) rotate(${i * 90})" class="f" style="--d:1.8s"><path d="M0 -12 C8 -12 12 -4 6 2 C12 6 6 14 0 10 C-6 14 -12 6 -6 2 C-12 -4 -8 -12 0 -12Z" fill="url(#gFill)" stroke="#FFF4D6" stroke-width=".8"/></g>`).join('');
  // 祥云
  const cloud = (x, y, sc, flip, d, bd) => `<g class="cloud" style="--d:${d}s;--fx:${flip * 160}px"><g style="--bd:${bd}s"><g transform="translate(${x} ${y}) scale(${flip * sc} ${sc})"><path d="${cloudPath()}" fill="rgba(232,192,122,.10)" stroke="url(#eGold)" stroke-width="${(2.2 / sc).toFixed(2)}"/><path d="${cloudCurls()}" fill="none" stroke="#E8C07A" stroke-width="${(1.6 / sc).toFixed(2)}"/></g></g></g>`;
  const clouds = cloud(-330, 90, 1.25, -1, 1.5, 0) + cloud(330, 90, 1.25, 1, 1.6, -1.5) + cloud(-300, -110, .85, 1, 1.8, -.8) + cloud(300, -110, .85, -1, 1.9, -2.2);
  root.append(lay(`${clouds}${pillar(-1)}${pillar(1)}${base}${moon}`));
  root.append(avatarEl(name, 268, 3.4));
  root.append(lay(`${lintel}${roof}${star}${tassel(-338)}${tassel(338)}`));
  const g = [[0, -330, 26, 4.1], [-420, 20, 22, 3.2], [420, 20, 22, 3.5], [-330, 252, 20, 3.8], [330, 252, 20, 4.2]];
  for (const [x, y, sz, d] of g) root.append(h('span', 'glint', { '--px': x + 'px', '--py': y + 'px', '--s': sz + 'px', '--d': d + 's' }, (() => { const s2 = document.createElementNS(NS, 'svg'); s2.setAttribute('viewBox', '0 0 24 24'); s2.innerHTML = '<use href="#spark"/>'; return s2; })()));
  const lab = state.event === 'enter' ? '恭 迎 总 督' : (state.event === 'open' ? '开 通 总 督' : '续 费 总 督');
  root.append(tx(300, 2.5, h('div', 'lab gold', null, lab), 'trackIn', 1.4));
  const wrap = h('div', 'nmwrap', { '--nd': '2.9s', '--sd': '4s' }, h('div', 'nm gold foil', { '--fd': '4.4s' }, name), h('div', 'seal', null, state.event === 'enter' ? '驾临' : '恭贺'));
  root.append(h('div', 'tx', { '--y': '372px' }, wrap));
  if (subLine()) root.append(tx(446, 3.6, h('div', 'sy', null, `${state.event === 'open' ? 1 : 3} 个月 · 感谢支持`)));
  return root;
}

// ================= 播放 =================
document.querySelectorAll('.seg').forEach((seg) => seg.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; state[seg.dataset.k] = b.dataset.v; save(); sync(); play(); }));
$('#replay').onclick = () => play();
$('#auto').onclick = () => { state.auto = !state.auto; save(); sync(); play(); };
function sync() {
  document.querySelectorAll('.seg').forEach((seg) => seg.querySelectorAll('button').forEach((b) => b.classList.toggle('on', state[seg.dataset.k] === b.dataset.v)));
  $('#desc').innerHTML = DESC[state.dir];
  $('#auto').classList.toggle('on', state.auto); $('#auto').textContent = state.auto ? '自动连播中' : '自动连播';
  const st = $('#stage');
  st.className = 'stage' + (state.bg === 'dark' ? ' sc-dark' : state.bg === 'light' ? ' sc-light' : '') + (state.safe === '0' ? ' no-safe' : '');
  st.style.setProperty('--hy', state.pos + '%');
}
let timer = 0;
function play() {
  clearTimeout(timer);
  const st = $('#stage');
  st.querySelectorAll('.hero').forEach((n) => n.remove());
  const name = NAMES[state.name];
  const el = (state.dir === 'deco' ? deco : east)(name);
  st.append(el);
  $('#capline').textContent = `${state.dir === 'deco' ? '装饰艺术 · 金门' : '东方宫廷 · 金銮'} · 总督 · 8 秒`;
  timer = setTimeout(() => { if (state.auto) { state.dir = state.dir === 'deco' ? 'east' : 'deco'; save(); sync(); play(); } else el.remove(); }, 8400);
}
function fit() {
  const view = $('#view'), fr = $('#frame');
  const s = Math.min((view.clientWidth - 32) / 1080, (view.clientHeight - 48) / 1920);
  fr.style.width = 1080 * s + 'px'; fr.style.height = 1920 * s + 'px'; $('#stage').style.transform = `scale(${s})`;
}
addEventListener('resize', fit);
window.__freeze = (t) => { clearTimeout(timer); document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t * 1000; }); };
sync(); fit(); play();
</script>
