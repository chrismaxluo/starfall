<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星临 · 特效设计 v3</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
@property --ang { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
:root {
  --font-sans: "Geist", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "Geist Mono", "Geist", ui-monospace, monospace;
  --bg: #0B0B10; --panel: #121218; --line: rgba(255,255,255,.08); --text: #EDEDF1; --mute: #A6A8B4; --dim: #80838F; --acc: #8D8BFF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }

/* ============ 预览页外壳 ============ */
.app { height: 100%; display: grid; grid-template-columns: 320px 1fr; }
.side { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 22px 18px 40px; }
.side h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.side h1 img { width: 22px; height: 22px; }
.side .sub { color: var(--dim); font-size: 12.5px; line-height: 1.6; margin-bottom: 18px; }
.grp { margin-top: 18px; }
.grp > b { display: block; font-size: 11.5px; letter-spacing: .12em; color: var(--dim); font-weight: 500; margin-bottom: 8px; }
.list { display: flex; flex-direction: column; gap: 4px; }
.item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 10px; border-radius: 9px; font-size: 14px; }
.item:hover { background: rgba(255,255,255,.04); }
.item.on { background: rgba(141,139,255,.14); color: #fff; }
.item i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.item small { margin-left: auto; color: var(--dim); font-family: var(--font-mono); font-size: 11.5px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; background: #0D0D12; padding: 3px; border-radius: 9px; border: 1px solid var(--line); }
.seg button { flex: 1; border: 0; background: transparent; padding: 6px 8px; border-radius: 7px; font-size: 12.5px; color: var(--mute); white-space: nowrap; }
.seg button.on { background: #26262F; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.row { display: flex; gap: 8px; margin-top: 18px; }
.btn { flex: 1; height: 38px; border-radius: 9px; border: 0; background: var(--acc); color: #0B0B12; font-weight: 600; font-size: 13.5px; }
.btn.sec { background: #22222B; color: var(--text); }
.btn.sec.on { background: rgba(61,214,140,.16); color: #3DD68C; }
.note { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: #0D0D12; border: 1px solid var(--line); font-size: 12.5px; line-height: 1.7; color: var(--mute); }
.note b { color: var(--text); font-weight: 600; }
.view { position: relative; overflow: hidden; display: grid; place-items: center; }
.frame { position: relative; flex: none; }
.frame > .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.cap-line { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 12px; color: var(--dim); font-family: var(--font-mono); }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100%; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; }
  .list { flex-direction: row; flex-wrap: wrap; }
  .item { width: auto; padding: 7px 10px; font-size: 13px; }
  .item small { display: none; }
  .view { height: 78vh; }
}

/* ============ 画布（与特效页一致：1080 × 1920 竖屏） ============ */
.stage { width: 1080px; height: 1920px; overflow: hidden; --st: 12%; --sb: 40%; --mx: 9%; --fxz: 1; --hy: 40%;
  background-color: #15151C;
  background-image: linear-gradient(45deg, #1C1C25 25%, transparent 25%, transparent 75%, #1C1C25 75%), linear-gradient(45deg, #1C1C25 25%, transparent 25%, transparent 75%, #1C1C25 75%);
  background-size: 64px 64px; background-position: 0 0, 32px 32px; box-shadow: 0 0 0 2px rgba(255,255,255,.14); }
.stage.sc-dark { background: radial-gradient(700px 500px at 70% 20%, rgba(88,120,190,.45), transparent 70%), radial-gradient(600px 500px at 20% 90%, rgba(40,90,80,.45), transparent 70%), linear-gradient(170deg, #1B2233, #0A0C12); }
.stage.sc-light { background: radial-gradient(700px 600px at 30% 20%, #FFE9D6, transparent 70%), radial-gradient(700px 600px at 80% 70%, #D9ECFF, transparent 70%), linear-gradient(170deg, #F6F1EA, #E6EEF6); }
.person { position: absolute; left: 50%; top: 520px; width: 0; height: 0; display: none; }
.stage.sc-dark .person, .stage.sc-light .person { display: block; }
.person::before { content: ""; position: absolute; left: -165px; top: 0; width: 330px; height: 380px; border-radius: 50% 50% 46% 46%; background: #C9A690; }
.person::after { content: ""; position: absolute; left: -380px; top: 420px; width: 760px; height: 900px; border-radius: 380px 380px 0 0; background: #4A5670; }
.stage.sc-dark .person::before { background: #6E5A50; } .stage.sc-dark .person::after { background: #2A3244; }
.safe { position: absolute; left: 0; right: 0; z-index: 50; pointer-events: none; display: flex; align-items: center; justify-content: center; font-size: 22px; letter-spacing: .1em; color: rgba(255,255,255,.5); background: repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 14px, transparent 14px 28px); }
.safe.top { top: 0; height: var(--st); border-bottom: 2px dashed rgba(255,255,255,.25); }
.safe.bot { bottom: 0; height: var(--sb); border-top: 2px dashed rgba(255,255,255,.25); }
.stage.sc-light .safe { color: rgba(0,0,0,.45); background: repeating-linear-gradient(45deg, rgba(0,0,0,.05) 0 14px, transparent 14px 28px); border-color: rgba(0,0,0,.25); }
.stage.no-safe .safe { display: none; }

/* ============ 特效公用 ============ */
.fxroot { color: #EDEDF1; }
.av { border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; overflow: hidden; width: 100%; height: 100%; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.medal { display: inline-flex; align-items: stretch; border-radius: 6px; overflow: hidden; color: var(--mt, #fff); border: 1.5px solid var(--mb); background: var(--mc); font-size: 18px; line-height: 26px; white-space: nowrap; }
.medal span { padding: 0 8px; } .medal b { padding: 0 8px; background: var(--ml); font-family: var(--font-mono); font-weight: 600; }
.glass { background: rgba(14, 15, 24, 0.62); backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.10), 0 20px 60px -20px rgba(0,0,0,.6); }

/* 居中大特效：.hero 是一个没有大小的点（头像中心），各层按这个点摆放 */
.hero { position: absolute; left: 50%; top: var(--hy); width: 0; height: 0; zoom: var(--fxz); animation: heroOut .6s calc(var(--dur) - .6s) ease-in forwards; }
@keyframes heroOut { to { opacity: 0; transform: translateY(-24px) scale(.97); } }
.L { position: absolute; width: var(--w); height: var(--h); left: calc(var(--w) / -2 + var(--x, 0px)); top: calc(var(--h) / -2 + var(--y, 0px)); }
.T { position: absolute; left: -540px; width: 1080px; top: var(--y); display: flex; justify-content: center; }
.L > svg { width: 100%; height: 100%; display: block; overflow: visible; }
.spin { width: 100%; height: 100%; animation: spin var(--spd, 14s) linear infinite; }
.spin.rev { animation-direction: reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes angSpin { to { --ang: 360deg; } }
@keyframes popIn { 0% { opacity: 0; transform: scale(.55); } 60% { opacity: 1; transform: scale(1.06); } 100% { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes growIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
@keyframes upIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes twk { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
@keyframes rise { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(var(--up, -380px)); } }
.star4 { position: absolute; width: var(--s); height: var(--s); left: var(--px); top: var(--py); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); color: var(--sc, #fff); opacity: 0; animation: twk var(--t, 1.8s) var(--d, 0s) ease-in-out infinite; }
.star4 svg { width: 100%; height: 100%; display: block; }
.mote { position: absolute; left: var(--px); top: var(--py); width: var(--s); height: var(--s); border-radius: 50%; background: var(--sc); box-shadow: 0 0 10px var(--sc); opacity: 0; animation: rise var(--t) var(--d) linear forwards; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 20px; font-size: 20px; font-weight: 700; letter-spacing: .12em; color: #fff; white-space: nowrap; }
.chip svg { width: 22px; height: 22px; }
.chip em { font-style: normal; font-weight: 500; opacity: .85; letter-spacing: .04em; padding-left: 10px; margin-left: 2px; border-left: 1.5px solid rgba(255,255,255,.4); }

/* ---------- 舰长：蓝环 · 船舵 ---------- */
.fx-cap { --c1: #D6EEFF; --c2: #6CC2FF; --c3: #2A74F0; --c4: #0B1D45; }
.fx-cap .glow { --w: 600px; --h: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(90,175,255,.42), rgba(90,175,255,.12) 45%, transparent 70%); animation: growIn .7s ease-out both; }
.fx-cap .helm { --w: 400px; --h: 400px; animation: growIn .7s .15s cubic-bezier(.2,.9,.3,1.1) both; }
.fx-cap .helm circle.draw { stroke-dasharray: 830; stroke-dashoffset: 830; animation: draw .8s .1s cubic-bezier(.6,.1,.3,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.shard { --w: 6px; --h: 60px; border-radius: 3px; background: linear-gradient(180deg, transparent, var(--sc, #fff)); opacity: 0; animation: shard .85s var(--d, .15s) cubic-bezier(.1,.7,.3,1) forwards; }
@keyframes shard { 0% { opacity: 0; transform: rotate(var(--r)) translateY(-120px) scaleY(.3); } 25% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--r)) translateY(var(--far, -270px)) scaleY(1); } }
.fx-cap .avL { --w: 204px; --h: 204px; animation: popIn .55s .05s cubic-bezier(.3,1.4,.5,1) both; }
.fx-cap .avL .av { box-shadow: 0 0 0 5px var(--c4), 0 0 0 9px var(--c2), 0 0 60px rgba(90,175,255,.7); }
.fx-cap .tag { animation: popIn .5s .45s cubic-bezier(.3,1.5,.5,1) both; }
.fx-cap .chip { background: linear-gradient(180deg, #7FCBFF, #2A74F0); box-shadow: 0 6px 20px rgba(42,116,240,.55), inset 0 1px 0 rgba(255,255,255,.5); }
.plate { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 44px 18px; border-radius: 22px; max-width: 920px; }
.plate::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none; background: var(--edge); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.plate::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; left: -40%; background: linear-gradient(90deg, transparent, var(--sheen), transparent); transform: skewX(-18deg); animation: sweep 1.3s var(--sw, 1.1s) cubic-bezier(.3,.6,.3,1) forwards; }
@keyframes sweep { to { left: 130%; } }
.plate .nm { font-size: 46px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; max-width: 840px; overflow: hidden; text-overflow: ellipsis; }
.plate .sy { font-size: 24px; color: rgba(255,255,255,.78); letter-spacing: .08em; }
.fx-cap .plate { --edge: linear-gradient(100deg, rgba(140,205,255,.95), rgba(140,205,255,.12) 45%, rgba(140,205,255,.7)); --sheen: rgba(190,225,255,.35);
  clip-path: inset(0 50% 0 50% round 22px); animation: unveil .55s .5s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes unveil { to { clip-path: inset(0 0 0 0 round 22px); } }

/* ---------- 提督：紫曜 · 星轨 ---------- */
.fx-adm { --p1: #F3EBFF; --p2: #CDB0FF; --p3: #9A62F0; --p4: #4B2596; --p5: #1A0F33; }
.fx-adm .rays { --w: 980px; --h: 980px; animation: growIn 1s .15s ease-out both; }
.fx-adm .rays .spin { --spd: 40s; border-radius: 50%; background: repeating-conic-gradient(rgba(205,176,255,.26) 0deg 2.5deg, transparent 2.5deg 11.25deg);
  -webkit-mask: radial-gradient(circle, transparent 22%, #000 30%, rgba(0,0,0,.35) 42%, transparent 56%); mask: radial-gradient(circle, transparent 22%, #000 30%, rgba(0,0,0,.35) 42%, transparent 56%); }
.fx-adm .glow { --w: 660px; --h: 660px; border-radius: 50%; background: radial-gradient(circle, rgba(154,98,240,.5), rgba(154,98,240,.14) 45%, transparent 70%); animation: growIn .8s ease-out both; }
.orb { --w: 520px; --h: 190px; animation: growIn .8s var(--d, .35s) cubic-bezier(.2,.9,.3,1) both; }
.orb > div { width: 100%; height: 100%; border-radius: 50%; border: 2.5px solid transparent; transform: rotate(var(--tilt)); }
.orb.back > div { border-top-color: rgba(205,176,255,.45); }
.orb.front > div { border-bottom-color: rgba(233,220,255,.9); filter: drop-shadow(0 0 6px rgba(205,176,255,.8)); }
.orb .dot { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 0 14px 4px rgba(205,176,255,.9);
  offset-path: path("M 260 95 m -260 0 a 260 95 0 1 0 520 0 a 260 95 0 1 0 -520 0"); offset-rotate: 0deg; animation: orbit var(--ot, 3.2s) linear infinite; }
@keyframes orbit { to { offset-distance: 100%; } }
.fx-adm .ring { --w: 250px; --h: 250px; border-radius: 50%; padding: 7px; background: conic-gradient(from var(--ang), #F3EBFF, #9A62F0, #4B2596, #CDB0FF, #FFFFFF, #9A62F0, #F3EBFF);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  animation: popIn .6s .15s cubic-bezier(.3,1.4,.5,1) both, angSpin 3.5s linear infinite; }
.fx-adm .avL { --w: 222px; --h: 222px; animation: popIn .6s .1s cubic-bezier(.3,1.4,.5,1) both; }
.fx-adm .avL .av { box-shadow: 0 0 0 5px var(--p5), 0 0 70px rgba(154,98,240,.75); }
.fx-adm .emb { --w: 110px; --h: 110px; --y: -178px; animation: drop .75s .6s cubic-bezier(.3,1.5,.5,1) both; }
.fx-adm .emb > div { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #F3EBFF, #9A62F0 58%, #4B2596);
  box-shadow: 0 0 0 4px var(--p5), 0 0 0 7px var(--p2), 0 0 40px rgba(205,176,255,.8); }
.fx-adm .emb svg { width: 58px; height: 58px; color: #fff; }
@keyframes drop { 0% { opacity: 0; transform: translateY(-170px) scale(.7); } 70% { opacity: 1; } 100% { opacity: 1; transform: none; } }
.fx-adm .embw { --w: 300px; --h: 70px; --y: -178px; animation: fadeIn .5s 1.1s both; }
.fx-adm .tagT { animation: upIn .5s .95s ease-out both; }
.fx-adm .chip { height: 36px; font-size: 18px; background: rgba(26,15,51,.75); box-shadow: inset 0 0 0 1.5px rgba(205,176,255,.7); color: var(--p1); }
.ribbon { position: relative; height: 96px; padding: 0 84px; display: flex; align-items: center; justify-content: center; max-width: 960px;
  background: linear-gradient(90deg, #3C1D82, #8750E6 22%, #B489FF 50%, #8750E6 78%, #3C1D82);
  clip-path: polygon(50% 0, 50% 0, 50% 50%, 50% 100%, 50% 100%, 50% 50%); animation: ribbon .7s .8s cubic-bezier(.2,.8,.2,1) forwards;
  filter: drop-shadow(0 10px 30px rgba(75,37,150,.6)); }
@keyframes ribbon { to { clip-path: polygon(0 0, 100% 0, calc(100% - 34px) 50%, 100% 100%, 0 100%, 34px 50%); } }
.ribbon::before { content: ""; position: absolute; inset: 7px 44px; border-top: 1.5px solid rgba(255,255,255,.45); border-bottom: 1.5px solid rgba(255,255,255,.25); }
.ribbon::after { content: ""; position: absolute; top: 0; bottom: 0; width: 26%; left: -30%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); transform: skewX(-20deg); animation: sweep 1.4s 1.6s ease-in-out forwards; }
.ribbon .nm { position: relative; font-size: 50px; font-weight: 800; color: #fff; text-shadow: 0 2px 0 rgba(60,29,130,.8), 0 0 24px rgba(255,255,255,.35); white-space: nowrap; max-width: 780px; overflow: hidden; text-overflow: ellipsis; }
.fx-adm .syT { animation: upIn .6s 1.35s ease-out both; }
.fx-adm .sy { font-size: 26px; letter-spacing: .3em; color: var(--p1); text-shadow: 0 2px 12px rgba(0,0,0,.6); }

/* ---------- 总督：金冕 · 驾临 ---------- */
.fx-gov { --g1: #FFF6DE; --g2: #F7D58B; --g3: #E9B45C; --g4: #B8741F; --g5: #2A1A06; }
.fx-gov .dim { --w: 3200px; --h: 4400px; background: radial-gradient(circle at 50% 50%, rgba(20,12,0,.25) 0, rgba(0,0,0,.66) 34%); opacity: 0;
  animation: fadeIn .6s forwards, fadeOut .7s calc(var(--dur) - .8s) forwards; }
@keyframes fadeOut { to { opacity: 0; } }
.fx-gov .pillar { --w: 300px; --h: 2400px; --y: -1200px; transform-origin: 50% 0; opacity: 0;
  background: linear-gradient(90deg, transparent, rgba(247,213,139,.28) 28%, rgba(255,246,222,.95) 48%, #fff 50%, rgba(255,246,222,.95) 52%, rgba(247,213,139,.28) 72%, transparent);
  -webkit-mask: linear-gradient(180deg, transparent, #000 40%, #000 94%, transparent); mask: linear-gradient(180deg, transparent, #000 40%, #000 94%, transparent);
  animation: pillar 1.5s .2s cubic-bezier(.5,0,.3,1) forwards; }
@keyframes pillar { 0% { opacity: 1; transform: scaleY(0) scaleX(.5); } 40% { opacity: 1; transform: scaleY(1) scaleX(.5); } 55% { opacity: 1; transform: scaleY(1) scaleX(1.2); } 100% { opacity: 0; transform: scaleY(1) scaleX(.1); } }
.fx-gov .flash { --w: 420px; --h: 420px; border-radius: 50%; opacity: 0; background: radial-gradient(circle, #fff, rgba(255,240,200,.8) 25%, rgba(247,213,139,0) 70%); animation: flash .9s .78s ease-out forwards; }
@keyframes flash { 0% { opacity: 0; transform: scale(.2); } 20% { opacity: 1; } 100% { opacity: 0; transform: scale(2.6); } }
.shock { --w: 240px; --h: 240px; border-radius: 50%; border: 3px solid var(--sc, #F7D58B); opacity: 0; animation: shock 1.1s var(--d, .8s) cubic-bezier(.1,.7,.3,1) forwards; }
@keyframes shock { 0% { opacity: 1; transform: scale(.4); } 100% { opacity: 0; transform: scale(4.2); } }
.fx-gov .rays { --w: 1200px; --h: 1200px; animation: growIn 1.2s .9s ease-out both; }
.fx-gov .rays .spin { --spd: 60s; border-radius: 50%; background: repeating-conic-gradient(rgba(247,213,139,.22) 0deg 2deg, transparent 2deg 9deg);
  -webkit-mask: radial-gradient(circle, transparent 18%, #000 26%, rgba(0,0,0,.35) 40%, transparent 56%); mask: radial-gradient(circle, transparent 18%, #000 26%, rgba(0,0,0,.35) 40%, transparent 56%); }
.fx-gov .glow { --w: 760px; --h: 760px; border-radius: 50%; background: radial-gradient(circle, rgba(247,213,139,.55), rgba(233,180,92,.16) 42%, transparent 70%); animation: growIn .9s .85s ease-out both; }
.fx-gov .sigil { --w: 480px; --h: 480px; animation: growIn 1s 1s cubic-bezier(.2,.9,.3,1) both; }
.fx-gov .sigil .spin { --spd: 36s; }
.fx-gov .sigil2 { --w: 330px; --h: 330px; animation: growIn 1s 1.1s cubic-bezier(.2,.9,.3,1) both; }
.fx-gov .sigil2 .spin { --spd: 22s; }
.wing { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.wing.r { transform: translate(84px, -20px); } .wing.l { transform: translate(-84px, -20px) scaleX(-1); }
.wing .wf { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; animation: flap 2.6s 2.3s ease-in-out infinite; }
@keyframes flap { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-4deg); } }
.fe { position: absolute; left: 0; width: var(--L); height: calc(var(--W) * 2); top: calc(var(--W) * -1); transform-origin: 0 50%; transform: rotate(var(--a)); opacity: 0;
  animation: feIn .95s calc(1.2s + var(--d)) cubic-bezier(.2,.9,.25,1.05) forwards; }
.fe svg { width: 100%; height: 100%; display: block; overflow: visible; }
@keyframes feIn { 0% { opacity: 0; transform: rotate(85deg) scaleX(.15); } 35% { opacity: 1; } 100% { opacity: 1; transform: rotate(var(--a)) scaleX(1); } }
.fx-gov .ring { --w: 262px; --h: 262px; border-radius: 50%; padding: 8px; background: conic-gradient(from var(--ang), #FFF6DE, #E9B45C, #8A5214, #F7D58B, #FFFFFF, #E9B45C, #FFF6DE);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  animation: popIn .7s .95s cubic-bezier(.3,1.4,.5,1) both, angSpin 4s linear infinite; }
.fx-gov .avL { --w: 230px; --h: 230px; animation: popIn .7s .9s cubic-bezier(.3,1.4,.5,1) both; }
.fx-gov .avL .av { box-shadow: 0 0 0 6px var(--g5), 0 0 80px rgba(247,213,139,.8); }

.fx-gov .star { --w: 92px; --h: 92px; --y: -226px; animation: starIn .9s 2.05s cubic-bezier(.5,0,.2,1) both; }
@keyframes starIn { 0% { opacity: 0; transform: translateY(-420px) scale(.5); } 30% { opacity: 1; } 100% { opacity: 1; transform: none; } }
.fx-gov .trail { --w: 6px; --h: 420px; --y: -440px; transform-origin: 50% 100%; border-radius: 3px; background: linear-gradient(180deg, transparent, rgba(247,213,139,.9)); opacity: 0; animation: trail .9s 2.05s cubic-bezier(.5,0,.2,1) forwards; }

  background: linear-gradient(100deg, #B8741F 0%, #F2C46E 28%, #FFF8E6 42%, #F2C46E 56%, #B8741F 100%); background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 20px rgba(0,0,0,.55)) drop-shadow(0 0 24px rgba(240,180,90,.35)); animation: foil 3s 3s linear infinite; }

/* ---------- 左下角卡片类（房管 / 粉丝牌 / 普通 / 礼物） ---------- */

.cardOut { animation: cardOut .45s calc(var(--dur) - .45s) ease-in forwards; }

/* 房管：巡场 */

.fx-mod .card { position: relative; display: flex; align-items: center; gap: 22px; padding: 18px 40px 18px 18px; border-radius: 18px; overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(79,209,188,.35), 0 0 44px -12px rgba(79,209,188,.5), 0 20px 60px -20px rgba(0,0,0,.6);

.fx-mod .card::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px; border-radius: 2px; background: linear-gradient(180deg, var(--t1), var(--t2)); }
.fx-mod .scan { position: absolute; top: 0; bottom: 0; left: -20%; width: 18%; background: linear-gradient(90deg, transparent, rgba(79,209,188,.35), rgba(184,245,234,.8)); animation: scan 1.1s .35s ease-in-out forwards; }

.fx-mod .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(79,209,188,.10) 1px, transparent 1px), linear-gradient(90deg, rgba(79,209,188,.10) 1px, transparent 1px); background-size: 16px 16px; opacity: 0; animation: gridIn 1.6s .3s ease-out forwards; }

.fx-mod .avw { position: relative; width: 76px; height: 76px; flex: none; }
.fx-mod .avw .av { box-shadow: 0 0 0 3px #0E2A26, 0 0 0 5.5px var(--t2); }
.fx-mod .shield { position: absolute; right: -8px; bottom: -8px; width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(180deg, var(--t2), var(--t3)); display: grid; place-items: center; box-shadow: 0 0 0 3px #0E1318; animation: popIn .45s .5s cubic-bezier(.3,1.5,.5,1) both; }

.fx-mod .txt { position: relative; display: flex; flex-direction: column; gap: 4px; }

.hud.a { left: 6px; top: 6px; border-right: 0; border-bottom: 0; } .hud.b { right: 6px; top: 6px; border-left: 0; border-bottom: 0; }
.hud.c { left: 6px; bottom: 6px; border-right: 0; border-top: 0; } .hud.d { right: 6px; bottom: 6px; border-left: 0; border-top: 0; }

/* 粉丝牌：星徽（颜色跟随粉丝牌） */
.fx-fan .comet { position: absolute; left: -380px; top: 50%; width: 300px; height: 4px; margin-top: -2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--ac), #fff); opacity: 0;
  animation: comet .55s cubic-bezier(.5,0,.3,1) forwards; }
.fx-fan .comet::after { content: ""; position: absolute; right: -8px; top: -8px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 0 18px 6px var(--ac); }
@keyframes comet { 0% { opacity: 0; transform: translateX(-200px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateX(420px); } }
.fx-fan .card { position: relative; display: flex; align-items: center; gap: 18px; padding: 12px 34px 12px 12px; border-radius: 999px; overflow: hidden;
  clip-path: circle(0 at 44px 50%); animation: bloom .7s .3s cubic-bezier(.2,.8,.2,1) forwards; }

.fx-fan .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; background: linear-gradient(100deg, var(--ac), transparent 55%, var(--ac)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: .9; }
.fx-fan .card::after { content: ""; position: absolute; top: 0; bottom: 0; width: 28%; left: -40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent); transform: skewX(-18deg); animation: sweep 1.1s .9s ease-in-out forwards; }

.fx-fan .sy { font-size: 21px; color: rgba(255,255,255,.72); }
.fx-fan .spk { position: absolute; color: #fff; }

/* 普通观众：一行字 */
.fx-nor { display: flex; align-items: center; gap: 14px; font-size: 27px; color: rgba(255,255,255,.95); text-shadow: 0 2px 8px rgba(0,0,0,.65), 0 0 2px rgba(0,0,0,.5); }
.fx-nor .dot { width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 0 12px 3px rgba(200,200,255,.9); flex: none; animation: dotIn .5s cubic-bezier(.3,1.5,.5,1) both; }

.fx-nor .tx { white-space: nowrap; -webkit-mask: linear-gradient(90deg, #000 45%, transparent 55%) 0 0 / 220% 100% no-repeat; mask: linear-gradient(90deg, #000 45%, transparent 55%) 0 0 / 220% 100% no-repeat;
  -webkit-mask-position: 100% 0; mask-position: 100% 0; animation: txIn .7s .3s ease-out forwards; }

.fx-nor b { font-weight: 700; }

/* 礼物感谢 */
.fx-gift { --r1: #FFE0CF; --r2: #FF9F8A; --r3: #F0578F; }
.fx-gift .card { position: relative; display: flex; align-items: center; gap: 22px; padding: 16px 40px 16px 16px; border-radius: 24px; animation: giftIn .55s cubic-bezier(.3,1.3,.5,1) both; }

.fx-gift .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; background: linear-gradient(100deg, rgba(255,180,160,.95), rgba(255,160,170,.12) 45%, rgba(255,179,138,.8)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.fx-gift .gb { position: relative; width: 92px; height: 92px; flex: none; }
.fx-gift .gb > .ic { position: absolute; inset: 0; border-radius: 26px; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #FFD9C2, #F0578F 72%); box-shadow: 0 0 36px rgba(240,87,143,.6), inset 0 1px 0 rgba(255,255,255,.6); animation: wobble .9s .25s ease-in-out both; }

.fx-gift .mini { position: absolute; right: -10px; bottom: -10px; width: 42px; height: 42px; box-shadow: 0 0 0 3px #14141C; border-radius: 50%; animation: popIn .4s .45s both; }
.fx-gift .txt { display: flex; flex-direction: column; gap: 4px; }
.fx-gift .lb { font-family: var(--font-mono); font-size: 15px; letter-spacing: .22em; color: #FFC2B0; }
.fx-gift .nm { font-size: 34px; font-weight: 700; white-space: nowrap; }
.fx-gift .sy { font-size: 23px; color: rgba(255,255,255,.8); white-space: nowrap; }
.fx-gift .sy b { color: var(--r1); font-weight: 600; }
.fx-gift .cnt { margin-left: 8px; font-size: 64px; font-weight: 800; font-style: italic; line-height: 1; white-space: nowrap;
  background: linear-gradient(180deg, #FFFFFF, #FFD0A8 50%, #FF7FA6); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 12px rgba(240,87,143,.5));
  animation: cntIn .5s .55s cubic-bezier(.3,1.7,.5,1) both; }
.fx-gift .cnt small { font-size: 34px; margin-right: 2px; }

.conf { position: absolute; left: 46px; top: 46px; width: var(--cw, 10px); height: var(--ch, 16px); border-radius: 2px; background: var(--sc); opacity: 0; animation: conf 1.2s var(--d, .3s) cubic-bezier(.2,.6,.4,1) forwards; }
@keyframes conf { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 60% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--tx), var(--ty)) rotate(var(--rot)); } }

/* ---------- 大额礼物：花火（居中） ---------- */
.fx-big .dim { --w: 3200px; --h: 4400px; background: radial-gradient(circle at 50% 50%, rgba(30,6,16,.15), rgba(0,0,0,.45) 34%); opacity: 0; animation: fadeIn .5s forwards, fadeOut .6s calc(var(--dur) - .7s) forwards; }

  -webkit-mask: radial-gradient(circle, transparent 18%, #000 25%, rgba(0,0,0,.3) 40%, transparent 55%); mask: radial-gradient(circle, transparent 18%, #000 25%, rgba(0,0,0,.3) 40%, transparent 55%); }
.fx-big .glow { --w: 700px; --h: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(255,140,150,.55), rgba(255,160,120,.15) 42%, transparent 70%); animation: growIn .8s .2s ease-out both; }
.fx-big .gbL { --w: 240px; --h: 240px; animation: gbIn .8s .25s cubic-bezier(.3,1.5,.5,1) both; }
.fx-big .gbL > div { width: 100%; height: 100%; border-radius: 60px; display: grid; place-items: center; transform: rotate(45deg);
  background: radial-gradient(circle at 35% 30%, #FFE9D6, #FF8FA3 55%, #C2356B); box-shadow: 0 0 0 6px #2A0A18, 0 0 0 10px #FFD7A8, 0 0 90px rgba(255,120,150,.8); animation: float 2.4s 1.1s ease-in-out infinite; }
.fx-big .gbL svg, .fx-big .gbL img { width: 130px; height: 130px; color: #fff; transform: rotate(-45deg); object-fit: contain; }
@keyframes gbIn { 0% { opacity: 0; transform: scale(.2) rotate(-90deg); } 100% { opacity: 1; transform: none; } }
@keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -12px; } }
.fw { position: absolute; left: var(--px); top: var(--py); width: 0; height: 0; }
.fw i { position: absolute; left: -3px; top: -17px; width: 6px; height: 34px; border-radius: 3px; background: linear-gradient(180deg, var(--sc), transparent); opacity: 0; animation: fw 1.1s var(--d) cubic-bezier(.1,.8,.3,1) forwards; }
@keyframes fw { 0% { opacity: 1; transform: rotate(var(--r)) translateY(0) scaleY(.5); } 70% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--r)) translateY(var(--far)) scaleY(1); } }
.fw b { position: absolute; left: -30px; top: -30px; width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, #fff, var(--sc) 30%, transparent 70%); opacity: 0; animation: flash .5s var(--d) ease-out forwards; }
.rain { position: absolute; left: var(--px); top: -760px; width: var(--cw); height: var(--ch); border-radius: 2px; background: var(--sc); opacity: 0; animation: rain var(--t) var(--d) linear forwards; }
@keyframes rain { 0% { opacity: 0; transform: translateY(0) rotate(0); } 10% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; transform: translateY(1400px) rotate(var(--rot)); } }
.fx-big .whoT { animation: upIn .6s .9s ease-out both; }
.fx-big .who { display: flex; align-items: center; gap: 16px; padding: 10px 30px 10px 10px; border-radius: 999px; }
.fx-big .who .avw { width: 64px; height: 64px; }
.fx-big .who .avw .av { box-shadow: 0 0 0 3px #FFD7A8; }
.fx-big .who .nm { font-size: 36px; font-weight: 700; white-space: nowrap; max-width: 700px; overflow: hidden; text-overflow: ellipsis; }
.fx-big .giT { animation: upIn .6s 1.15s ease-out both; }
.fx-big .gi { font-size: 34px; letter-spacing: .12em; color: #FFE6D6; text-shadow: 0 2px 12px rgba(0,0,0,.7); white-space: nowrap; }
.fx-big .gi b { color: #FFD7A8; font-weight: 700; }
.fx-big .cnT { animation: cntIn .6s 1.35s cubic-bezier(.3,1.7,.5,1) both; }
.fx-big .cn { font-size: 120px; font-weight: 900; font-style: italic; line-height: 1; background: linear-gradient(180deg, #FFFFFF, #FFD7A8 45%, #FF6E9C); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 22px rgba(255,90,140,.55)); }
.fx-big .cn small { font-size: 60px; margin-right: 4px; }

/* ---------- 弹幕回应：气泡（顶部） ---------- */
.top { position: absolute; left: 0; right: 0; top: calc(var(--st) + 60px); display: flex; justify-content: center; zoom: var(--fxz); }
.fx-bub { display: flex; align-items: flex-end; gap: 16px; max-width: 900px; animation: bubOut .4s calc(var(--dur) - .4s) ease-in forwards; }
@keyframes bubOut { to { opacity: 0; transform: translateY(-14px); } }
.fx-bub .avw { width: 72px; height: 72px; flex: none; animation: popIn .45s cubic-bezier(.3,1.5,.5,1) both; }
.fx-bub .avw .av { box-shadow: 0 0 0 3px #0F1720, 0 0 0 5.5px #7FD8F5, 0 0 24px rgba(127,216,245,.6); }
.fx-bub .bb { position: relative; padding: 14px 30px 16px; border-radius: 30px 30px 30px 8px; transform-origin: 0 100%; animation: bubIn .5s .12s cubic-bezier(.3,1.5,.5,1) both; }
.fx-bub .bb::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; background: linear-gradient(120deg, #7FD8F5, rgba(127,216,245,.1) 50%, #B7A6FF); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
@keyframes bubIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
.fx-bub .nm { font-size: 22px; font-weight: 600; color: #BDEBFA; margin-bottom: 4px; }
.fx-bub .tx { font-size: 32px; line-height: 1.35; overflow-wrap: anywhere; clip-path: inset(0 100% 0 0); animation: type .7s .35s steps(14) forwards; }
@keyframes type { to { clip-path: inset(0 0 0 0); } }
.fx-bub .spk { position: absolute; color: #BDEBFA; }
</style>
</head>

    <div class="cap-line" id="capline"></div>
  </main>
</div>

<script>
// ---------------- 小工具 ----------------
const $ = (s) => document.querySelector(s);
function h(tag, cls, style, ...kids) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (style) for (const [k, v] of Object.entries(style)) el.style.setProperty(k, v);
  for (const k of kids) if (k != null && k !== false) el.append(k);
  return el;
}
const NS = 'http://www.w3.org/2000/svg';
function svg(viewBox, inner) { const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', viewBox); s.innerHTML = inner; return s; }
const icon = (id) => svg('0 0 24 24', `<use href="#${id}"/>`);
const L = (cls, vars, ...kids) => h('div', 'L ' + cls, vars, ...kids);
const T = (cls, y, ...kids) => h('div', 'T ' + cls, { '--y': y + 'px' }, ...kids);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

const FACE = 'https://i0.hdslb.com/bfs/face/3b1011461e9e74039c9cebae7dab6dfdf8f3711c.jpg';
const NAMES = { short: '星临', mid: '吃喵放花椒的喵酱', long: '今天也要早点睡觉的超长昵称啊' };
const GRADS = ['linear-gradient(135deg,#E0689B,#9B3D74)', 'linear-gradient(135deg,#6E6BF2,#3C39B8)', 'linear-gradient(135deg,#3FB4F6,#2B5FB0)', 'linear-gradient(135deg,#4FD1BC,#23806F)', 'linear-gradient(135deg,#F0B45A,#B26A24)'];
function avatar(v, size) {
  const grad = GRADS[[...v.name].reduce((s, c) => s + c.charCodeAt(0), 0) % GRADS.length];
  const el = h('span', 'av', { background: grad, 'font-size': Math.round(size * 0.42) + 'px' }, [...v.name][0]);
  if (v.face) { const img = new Image(); img.referrerPolicy = 'no-referrer'; img.onload = () => el.replaceChildren(img); img.src = v.face; }
  return el;
}
function medalColors(level) {
  const t = level <= 10 ? '#5762A7' : level <= 20 ? '#C770A4' : level <= 30 ? '#3FB4F6' : level <= 40 ? '#4C7DFF' : level <= 50 ? '#A773F1' : '#EC4F6E';
  return { bg: t + '99', level: t + 'E6', border: t + '99', text: '#FFFFFF', accent: t };
}
function medal(v) {
  const c = medalColors(v.medal.level);
  return h('span', 'medal', { '--mc': c.bg, '--ml': c.level, '--mb': c.border }, h('span', null, null, v.medal.name), h('b', null, null, String(v.medal.level)));
}
function star4(x, y, s, d, color, t) { return h('span', 'star4', { '--px': x + 'px', '--py': y + 'px', '--s': s + 'px', '--d': d + 's', '--sc': color, '--t': (t || 1.8) + 's' }, icon('i-spark')); }
function motes(n, r, colors, d0, d1, up) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), rr = rnd(r * 0.2, r);
    out.push(h('span', 'mote', { '--px': (Math.cos(a) * rr).toFixed(0) + 'px', '--py': (Math.sin(a) * rr * 0.6 + 60).toFixed(0) + 'px', '--s': rnd(3, 7).toFixed(1) + 'px', '--sc': pick(colors), '--t': rnd(2.4, 4).toFixed(2) + 's', '--d': rnd(d0, d1).toFixed(2) + 's', '--up': -rnd(up * .6, up).toFixed(0) + 'px' }));
  }
  return out;
}
const GUARD = { 3: '舰长', 2: '提督', 1: '总督' };
function heroTag(it, cls) {
  const g = GUARD[it.v.guard];
  if (it.event === 'enter') return g;
  return (it.event === 'open' ? '开通' : '续费') + g;
}
const heroSay = (it, enterSay) => it.event === 'enter' ? enterSay : `${it.months} 个月 · 感谢支持`;

// ---------------- 各个特效 ----------------
const FX = {};

// 舰长：蓝环 · 船舵
FX.cap = (it) => {
  const root = h('div', 'hero fx-cap', { '--dur': '4s' });
  root.append(L('glow', { '--w': '600px', '--h': '600px' }));
  for (let i = 0; i < 12; i++) root.append(L('shard', { '--r': i * 30 + 15 + 'deg', '--d': (0.12 + (i % 3) * 0.04) + 's', '--sc': i % 2 ? '#D6EEFF' : '#6CC2FF' }));
  let spokes = '', ticks = '';
  for (let i = 0; i < 8; i++) { const a = (i * 45) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a); spokes += `<line x1="${c * 150}" y1="${s * 150}" x2="${c * 176}" y2="${s * 176}" stroke="#6CC2FF" stroke-width="7" stroke-linecap="round"/><circle cx="${c * 184}" cy="${s * 184}" r="9" fill="#D6EEFF"/>`; }
  for (let i = 0; i < 48; i++) { if (i % 6 === 0) continue; const a = (i * 7.5) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a); ticks += `<line x1="${c * 150}" y1="${s * 150}" x2="${c * 158}" y2="${s * 158}" stroke="rgba(214,238,255,.55)" stroke-width="2"/>`; }
  const helm = L('helm', {});
  const sp = h('div', 'spin', { '--spd': '16s' });
  sp.append(svg('-200 -200 400 400', `<circle r="150" fill="none" stroke="rgba(214,238,255,.35)" stroke-width="1.5"/>${ticks}${spokes}`));
  helm.append(sp);
  root.append(helm);
  root.append(L('draw', { '--w': '400px', '--h': '400px' }, svg('-200 -200 400 400', `<circle class="draw" r="132" fill="none" stroke="url(#gCap)" stroke-width="5" transform="rotate(-90)" style="stroke-dasharray:830;stroke-dashoffset:830;animation:draw .8s .1s cubic-bezier(.6,.1,.3,1) forwards"/>`)));
  root.append(L('avL', {}, avatar(it.v, 204)));
  const chip = h('span', 'chip', null, icon('i-anchor'), heroTag(it));
  root.append(T('tag', 86, chip));
  const plate = h('div', 'plate glass', null, h('div', 'nm', null, it.v.name), h('div', 'sy', null, heroSay(it, '登船啦')));
  root.append(T('', 150, plate));
  for (let i = 0; i < 6; i++) { const a = rnd(0, Math.PI * 2), r = rnd(200, 290); root.append(star4(Math.cos(a) * r, Math.sin(a) * r * .8 - 20, rnd(18, 30), rnd(.5, 2.4), '#D6EEFF', 1.6)); }
  return root;
};

// 提督：紫曜 · 星轨
FX.adm = (it) => {
  const root = h('div', 'hero fx-adm', { '--dur': '6s' });
  root.append(L('rays', {}, h('div', 'spin')));
  root.append(L('glow', {}));
  const orbit = (cls, tilt, d, ot, scale) => L('orb ' + cls, { '--tilt': tilt + 'deg', '--d': d + 's', transform: `scale(${scale})` }, h('div', null, null), cls === 'front' ? h('span', 'dot', { '--ot': ot + 's', transform: `rotate(${tilt}deg)` }) : null);
  root.append(orbit('back', -16, .35, 3.2, 1), orbit('back', 22, .5, 4.2, .82));
  root.append(L('ring', {}));
  root.append(L('avL', {}, avatar(it.v, 222)));
  const fr = orbit('front', -16, .35, 3.2, 1), fr2 = orbit('front', 22, .5, 4.2, .82);
  fr.querySelector('.dot').style.cssText += ';transform-origin:260px 95px';
  root.append(fr, fr2);
  root.append(L('embw', {}, svg('0 0 300 70', `<g fill="none" stroke="#CDB0FF" stroke-width="2" stroke-linecap="round" opacity=".9"><path d="M92 35 H20"/><path d="M92 28 L60 12"/><path d="M92 42 L60 58"/><path d="M208 35 H280"/><path d="M208 28 L240 12"/><path d="M208 42 L240 58"/></g><circle cx="16" cy="35" r="4" fill="#F3EBFF"/><circle cx="284" cy="35" r="4" fill="#F3EBFF"/>`)));
  root.append(L('emb', {}, h('div', null, null, icon('i-adm'))));
  root.append(T('tagT', 118, h('span', 'chip', null, heroTag(it))));
  root.append(T('', 168, h('div', 'ribbon', null, h('span', 'nm', null, it.v.name))));
  root.append(T('syT', 282, h('div', 'sy', null, heroSay(it, '驾到'))));
  for (let i = 0; i < 16; i++) { const a = rnd(0, Math.PI * 2), r = rnd(190, 380); root.append(star4(Math.cos(a) * r, Math.sin(a) * r * .75 - 30, rnd(14, 30), rnd(.7, 4.5), pick(['#F3EBFF', '#CDB0FF', '#fff']), rnd(1.4, 2.2))); }
  root.append(...motes(16, 320, ['#CDB0FF', '#F3EBFF', '#9A62F0'], .8, 4, 420));
  return root;
};

// 总督：金冕 · 驾临
function feather(a, len, w, d, grad) {
  const W = w, Lh = len;
  // 羽毛：根部细，前段宽，圆头；上缘弧度大、下缘平缓
  const path = `M0 ${W - 3} C ${Lh * .3} ${W * .15}, ${Lh * .72} ${W * .02}, ${Lh * .92} ${W * .38} Q ${Lh} ${W * .72}, ${Lh * .96} ${W * 1.12} C ${Lh * .78} ${W * 1.62}, ${Lh * .32} ${W * 1.5}, 0 ${W + 3} Z`;
  const el = h('div', 'fe', { '--a': a + 'deg', '--L': len + 'px', '--W': w + 'px', '--d': d + 's' });
  el.append(svg(`0 0 ${len} ${w * 2}`, `<path d="${path}" fill="url(#${grad})" stroke="rgba(70,36,6,.55)" stroke-width="1.4"/><path d="M6 ${W} C ${Lh * .4} ${W * .9}, ${Lh * .7} ${W * .8}, ${Lh * .9} ${W * .75}" fill="none" stroke="rgba(120,70,16,.5)" stroke-width="1.6" stroke-linecap="round"/>`));
  return el;
}
function wing(side) {
  const w = h('div', 'wing ' + side), wf = h('div', 'wf');
  // 飞羽（长）从下往上叠，覆羽（短、亮）盖在根部
  [[18, 210, 30], [6, 268, 32], [-7, 312, 34], [-20, 338, 34], [-33, 342, 33], [-46, 322, 31], [-59, 282, 28], [-71, 222, 24]].forEach(([a, l, ww], i) => wf.append(feather(a, l, ww, i * .05, 'gFeather')));
  [[4, 150, 26], [-14, 176, 27], [-32, 182, 26], [-50, 162, 24], [-66, 124, 20]].forEach(([a, l, ww], i) => wf.append(feather(a, l, ww, .15 + i * .05, 'gFeather2')));
  w.append(wf);
  return w;
}
FX.gov = (it) => {
  const root = h('div', 'hero fx-gov', { '--dur': '8s' });
  root.append(L('dim', {}));
  root.append(L('rays', {}, h('div', 'spin')));
  root.append(L('pillar', {}));
  root.append(L('flash', {}));
  root.append(L('shock', { '--d': '.8s' }), L('shock', { '--d': '1s', '--sc': '#FFF6DE' }));
  root.append(L('glow', {}));
  let ticks = '', gems = '';
  for (let i = 0; i < 72; i++) { const a = i * 5 * Math.PI / 180, c = Math.cos(a), s = Math.sin(a), r2 = i % 6 === 0 ? 212 : 222; ticks += `<line x1="${c * r2}" y1="${s * r2}" x2="${c * 230}" y2="${s * 230}" stroke="#F7D58B" stroke-width="${i % 6 === 0 ? 3 : 1.5}" opacity="${i % 6 === 0 ? .95 : .55}"/>`; }
  for (let i = 0; i < 12; i++) { const a = (i * 30 + 15) * Math.PI / 180; gems += `<path d="M0 -8 L6 0 L0 8 L-6 0Z" fill="#FFF6DE" transform="translate(${Math.cos(a) * 196} ${Math.sin(a) * 196}) rotate(${i * 30 + 15})"/>`; }
  const sg = h('div', 'spin'); sg.append(svg('-240 -240 480 480', `<circle r="236" fill="none" stroke="rgba(247,213,139,.5)" stroke-width="1.5"/><circle r="196" fill="none" stroke="rgba(247,213,139,.28)" stroke-width="1"/>${ticks}${gems}`));
  root.append(L('sigil', {}, sg));
  const sg2 = h('div', 'spin rev'); sg2.append(svg('-165 -165 330 330', `<circle r="160" fill="none" stroke="rgba(255,246,222,.65)" stroke-width="2" stroke-dasharray="2 12" stroke-linecap="round"/>`));
  root.append(L('sigil2', {}, sg2));
  root.append(wing('l'), wing('r'));
  root.append(L('ring', {}));
  root.append(L('avL', {}, avatar(it.v, 230)));
  const crownPath = 'M14 49 L15.5 35.5 L23 43 L28 36.5 L32 41 L36 36.5 L41 43 L48.5 35.5 L50 49 Z';
  root.append(L('crown', {}, svg('11 30 42 22', `<path d="${crownPath}" fill="url(#gCrownFill)"/><path d="${crownPath}" fill="none" stroke="url(#gGold)" stroke-width="1.4" stroke-linejoin="round"/><rect x="14" y="47.6" width="36" height="3.6" rx="1.8" fill="url(#gCrownFill)" stroke="url(#gGold)" stroke-width="1"/><circle cx="15.5" cy="35.5" r="2.1" fill="url(#gJewel)"/><circle cx="48.5" cy="35.5" r="2.1" fill="url(#gJewel)"/><circle cx="32" cy="45" r="1.6" fill="url(#gJewel)"/>`)));
  root.append(L('trail', {}));
  root.append(L('star', {}, svg('-1.1 -1.1 2.2 2.2', `<path d="M0 -1 C.1 -.28 .28 -.1 1 0 C.28 .1 .1 .28 0 1 C-.1 .28 -.28 .1 -1 0 C-.28 -.1 -.1 -.28 0 -1Z" fill="url(#gStar)"/><circle cx="-.2" cy="-.24" r=".08" fill="#fff" opacity=".9"/>`)));
  root.append(L('spark', {}));
  root.append(T('lblT', 262, h('div', 'lbl', null, heroTag(it) + (it.event === 'enter' ? ' · 驾临' : ''))));
  root.append(T('nmT', 306, h('div', 'nm', null, it.v.name)));
  root.append(T('syT', 424, h('div', 'sy', null, heroSay(it, '恭迎大驾'))));
  root.append(...motes(36, 420, ['#F7D58B', '#FFF6DE', '#E9B45C'], 1.1, 6.5, 520));
  for (let i = 0; i < 10; i++) { const a = rnd(0, Math.PI * 2), r = rnd(260, 440); root.append(star4(Math.cos(a) * r, Math.sin(a) * r * .7 - 40, rnd(16, 34), rnd(1.4, 6), pick(['#FFF6DE', '#F7D58B']), rnd(1.6, 2.4))); }
  return root;
};

// 房管：巡场
FX.mod = (it) => {
  const card = h('div', 'card glass', null, h('div', 'grid'), h('div', 'scan'),
    h('div', 'avw', null, avatar(it.v, 76), h('span', 'shield', null, icon('i-mod'))),
    h('div', 'txt', null, h('div', 'lb', null, 'MODERATOR · 房管'), h('div', 'nm', null, it.v.name), h('div', 'sy', null, '前来巡场')),
    h('i', 'hud a'), h('i', 'hud b'), h('i', 'hud c'), h('i', 'hud d'));
  return h('div', 'bl fx-mod cardOut', { '--dur': '3.6s' }, card);
};

// 粉丝牌：星徽
FX.fan = (it) => {
  const c = medalColors(it.v.medal.level);
  const card = h('div', 'card glass', null, h('div', 'avw', null, avatar(it.v, 64)),
    h('div', 'txt', null, h('div', 'r1', null, h('span', 'nm', null, it.v.name), medal(it.v)), h('div', 'sy', null, '来了，欢迎回来')));
  const root = h('div', 'bl fx-fan cardOut', { '--dur': '3.4s', '--ac': c.accent }, h('div', 'comet'), card);
  [[-6, -18, 22, .6], [90, -26, 16, .9], [-24, 70, 14, 1.2]].forEach(([x, y, s, d]) => root.append(star4(x, y, s, d, '#fff', 1.6)));
  return root;
};

// 普通观众：一行字
FX.nor = (it) => h('div', 'bl fx-nor cardOut', { '--dur': '2.6s' }, h('span', 'dot'), h('span', 'ln'), h('span', 'tx', null, h('b', null, null, it.v.name), ' 进入直播间'));

// 礼物感谢
FX.gift = (it) => {
  const gb = h('div', 'gb', null, h('div', 'ic', null, icon('i-gift')), h('span', 'mini', null, avatar(it.v, 42)));
  const card = h('div', 'card glass', null, gb,
    h('div', 'txt', null, h('div', 'lb', null, 'THANKS · 感谢'), h('div', 'nm', null, it.v.name), h('div', 'sy', null, '送出 ', h('b', null, null, it.gift))),
    h('div', 'cnt', null, h('small', null, null, '×'), String(it.count)));
  const root = h('div', 'bl fx-gift cardOut', { '--dur': '4s' }, card);
  const cols = ['#FFD0A8', '#FF7FA6', '#FFE9A8', '#FFFFFF', '#FFA07A'];
  for (let i = 0; i < 16; i++) { const a = rnd(-Math.PI * .95, -Math.PI * .05), r = rnd(90, 190); root.append(h('i', 'conf', { '--sc': pick(cols), '--tx': (Math.cos(a) * r).toFixed(0) + 'px', '--ty': (Math.sin(a) * r).toFixed(0) + 'px', '--rot': rnd(-400, 400).toFixed(0) + 'deg', '--d': rnd(.25, .45).toFixed(2) + 's', '--cw': rnd(7, 11).toFixed(0) + 'px', '--ch': rnd(10, 18).toFixed(0) + 'px' })); }
  return root;
};

// 大额礼物：花火
FX.big = (it) => {
  const root = h('div', 'hero fx-big', { '--dur': '6s' });
  root.append(L('dim', {}), L('rays', {}, h('div', 'spin')), L('glow', {}));
  const cols = ['#FFD7A8', '#FF7FA6', '#FFF2C4', '#FFFFFF', '#FF9E7A', '#C9B6FF'];
  const bursts = [[-300, -300, .55], [310, -250, .85], [-40, -440, 1.15], [290, 40, 2.6], [-310, 10, 3.0], [60, -380, 3.5]];
  for (const [x, y, d] of bursts) {
    const fw = h('div', 'fw', { '--px': x + 'px', '--py': y + 'px' });
    const c = pick(cols);
    fw.append(h('b', null, { '--sc': c, '--d': d + 's' }));
    for (let i = 0; i < 24; i++) fw.append(h('i', null, { '--r': i * 15 + 'deg', '--d': d + 's', '--sc': i % 3 ? c : '#fff', '--far': -rnd(130, 190).toFixed(0) + 'px' }));
    root.append(fw);
  }
  root.append(L('shock', { '--d': '.35s', '--sc': '#FFD7A8' }));
  root.append(L('gbL', {}, h('div', null, null, icon('i-gift'))));
  root.append(T('whoT', 176, h('div', 'who glass', null, h('div', 'avw', null, avatar(it.v, 64)), h('span', 'nm', null, it.v.name))));
  root.append(T('giT', 270, h('div', 'gi', null, '送出 ', h('b', null, null, it.gift))));
  root.append(T('cnT', 318, h('div', 'cn', null, h('small', null, null, '×'), String(it.count))));
  for (let i = 0; i < 26; i++) root.append(h('i', 'rain', { '--px': rnd(-500, 500).toFixed(0) + 'px', '--sc': pick(cols), '--cw': rnd(8, 12).toFixed(0) + 'px', '--ch': rnd(12, 20).toFixed(0) + 'px', '--t': rnd(2.6, 4).toFixed(2) + 's', '--d': rnd(.7, 2.6).toFixed(2) + 's', '--rot': rnd(-600, 600).toFixed(0) + 'deg' }));
  return root;
};

// 弹幕回应：气泡
FX.bub = (it) => {
  const bb = h('div', 'bb glass', null, h('div', 'nm', null, it.v.name), h('div', 'tx', null, '主播今天唱的这首也太好听了吧！'));
  const root = h('div', 'top', { '--dur': '3.4s' }, h('div', 'fx-bub', { '--dur': '3.4s' }, h('div', 'avw', null, avatar(it.v, 72)), bb));
  bb.append(star4(-6, -8, 20, .5, '#BDEBFA', 1.5));
  return root;
};

// ---------------- 列表与说明 ----------------
const ITEMS = [
  { id: 'cap', name: '舰长进场', group: 'guard', dot: '#6CC2FF', dur: '4 秒', desc: '<b>蓝环 · 船舵</b>：头像弹出，外圈画出一道蓝色光环，船舵形状的外环慢慢转，光点向外散开；身份牌落在头像下方，名字牌从中间向两边展开，扫过一道光。' },
  { id: 'adm', name: '提督进场', group: 'guard', dot: '#B489FF', dur: '6 秒', desc: '<b>紫曜 · 星轨</b>：背后展开旋转的紫色光芒，两条星轨绕着头像转（光点会从头像前面、后面经过）；提督徽章从上方落下，名字写在一条展开的紫色绶带上，周围星光闪烁。' },
  { id: 'gov', name: '总督进场', group: 'guard', dot: '#F2C46E', dur: '8 秒', desc: '<b>金冕 · 驾临</b>：画面先暗下来，一道金色光柱从天而降，落地炸开光圈；头像出现，金色羽翼向两边展开，皇冠落在头像上，最后一颗星星从天上落进皇冠正中（和星临的标志是同一个意思）；名字像烫金一样亮起，金粉往上飘。' },
  { id: 'mod', name: '房管进场', group: 'enter', dot: '#4FD1BC', dur: '3.6 秒', desc: '<b>巡场</b>：卡片从左往右擦出来，一道青色扫描光扫过，四个角亮起取景框，头像右下角是房管盾牌。' },
  { id: 'fan', name: '粉丝牌进场', group: 'enter', dot: '#C770A4', dur: '3.4 秒', desc: '<b>星徽</b>：一颗流星从左边飞进来，卡片从头像处展开；光环和边框的颜色<b>跟着粉丝牌等级变</b>（可以在下面切换等级看看）。' },
  { id: 'nor', name: '普通观众进场', group: 'enter', dot: '#A6A8B4', dur: '2.6 秒', desc: '<b>一行字</b>：一个小光点滑进来，拉出一条短线，文字从左到右显现。低调，不打扰。' },
  { id: 'gift', name: '礼物感谢', group: 'other', dot: '#FF7FA6', dur: '4 秒', desc: '<b>礼物卡</b>：礼物图标晃一下弹出来，彩纸往上撒；右边的「×数量」从大到小砸下来。以后会换成这个礼物在 B 站的真实图片。' },
  { id: 'big', name: '大额礼物', group: 'other', dot: '#FFB38A', dur: '6 秒', desc: '<b>花火</b>：给贵重礼物用的居中大特效。礼物图标旋转着放大出现，周围一朵朵烟花炸开，彩纸从上往下落，数量大大地砸出来。' },
  { id: 'bub', name: '弹幕回应', group: 'other', dot: '#7FD8F5', dur: '3.4 秒', desc: '<b>气泡</b>：在画面上方弹出一个对话气泡，文字像打字一样一段段出来。' },
];
const state = { fx: 'cap', event: 'enter', pos: '40', lv: '25', face: '1', name: 'mid', bg: 'alpha', safe: '1', auto: false };
try { Object.assign(state, JSON.parse(localStorage.getItem('sf-fx3') || '{}')); } catch {}
const save = () => { try { localStorage.setItem('sf-fx3', JSON.stringify(state)); } catch {} };

for (const it of ITEMS) {
  const b = h('button', 'item', null, h('i', null, { background: it.dot }), it.name, h('small', null, null, it.dur));
  b.dataset.id = it.id;
  b.onclick = () => { state.fx = it.id; save(); sync(); play(); };
  $('#l-' + it.group).append(b);
}
document.querySelectorAll('.seg').forEach((seg) => seg.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state[seg.dataset.k] = b.dataset.v; save(); sync(); play();
}));
$('#replay').onclick = play;
$('#auto').onclick = () => { state.auto = !state.auto; save(); sync(); play(); };

function sync() {
  document.querySelectorAll('.item').forEach((b) => b.classList.toggle('on', b.dataset.id === state.fx));
  document.querySelectorAll('.seg').forEach((seg) => seg.querySelectorAll('button').forEach((b) => b.classList.toggle('on', state[seg.dataset.k] === b.dataset.v)));
  const cur = ITEMS.find((i) => i.id === state.fx);
  $('#desc').innerHTML = cur.desc;
  $('#g-event').hidden = !['cap', 'adm', 'gov'].includes(state.fx);
  $('#g-pos').hidden = !['cap', 'adm', 'gov', 'big'].includes(state.fx);
  $('#g-lv').hidden = state.fx !== 'fan';
  $('#auto').classList.toggle('on', state.auto);
  $('#auto').textContent = state.auto ? '自动连播中' : '自动连播';
  const st = $('#stage');
  st.className = 'stage' + (state.bg === 'dark' ? ' sc-dark' : state.bg === 'light' ? ' sc-light' : '') + (state.safe === '0' ? ' no-safe' : '');
  st.style.setProperty('--hy', state.pos + '%');
}

let timer = 0;
function play() {
  clearTimeout(timer);
  const st = $('#stage');
  st.querySelectorAll('.fxroot').forEach((n) => n.remove());
  const guard = { cap: 3, adm: 2, gov: 1 }[state.fx] || 0;
  const v = { name: NAMES[state.name], face: state.face === '1' ? FACE : '', guard, isMod: state.fx === 'mod', medal: { name: '星临', level: Number(state.lv) } };
  const big = state.fx === 'big';
  const it = { v, event: guard ? state.event : 'enter', months: state.event === 'open' ? 1 : 3, gift: big ? '星河入梦' : '小花花', count: big ? 1 : 10 };
  const el = FX[state.fx](it);
  el.classList.add('fxroot');
  st.append(el);
  const dur = parseFloat(el.style.getPropertyValue('--dur')) * 1000;
  const cur = ITEMS.find((i) => i.id === state.fx);
  $('#capline').textContent = `${cur.name} · ${cur.dur} · 1080 × 1920 竖屏`;
  timer = setTimeout(() => {
    if (state.auto) { const i = ITEMS.findIndex((x) => x.id === state.fx); state.fx = ITEMS[(i + 1) % ITEMS.length].id; save(); sync(); play(); }
    else el.remove();
  }, dur + 400);
}

function fit() {
  const view = $('#view'), fr = $('#frame');
  const w = view.clientWidth - 32, hh = view.clientHeight - 48;
  const s = Math.min(w / 1080, hh / 1920);
  fr.style.width = 1080 * s + 'px'; fr.style.height = 1920 * s + 'px';
  $('#stage').style.transform = `scale(${s})`;
}
addEventListener('resize', fit);
sync(); fit();
const q = new URLSearchParams(location.search);
if (q.get('fx')) state.fx = q.get('fx');
if (q.get('ev')) state.event = q.get('ev');
if (q.get('bg')) state.bg = q.get('bg');
sync();
if (q.has('freeze')) { play(); const t = Number(q.get('freeze')); document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t * 1000 - (a.effect?.getTiming?.().delay ? 0 : 0); }); clearTimeout(timer); }
else play();
</script>
</body>
</html>
