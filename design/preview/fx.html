<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星临 · 特效设计 v4</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
@property --ang { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
:root {
  --font-sans: "Geist", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "Geist Mono", "Geist", ui-monospace, monospace;
  --bg: #0B0B10; --panel: #121218; --line: rgba(255,255,255,.08); --text: #EDEDF1; --mute: #A6A8B4; --dim: #80838F; --acc: #8D8BFF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }

/* ============ 预览页外壳 ============ */
.app { height: 100%; display: grid; grid-template-columns: 320px 1fr; }
.side { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 22px 18px 40px; }
.side h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.side h1 img { width: 22px; height: 22px; }
.side .sub { color: var(--dim); font-size: 12.5px; line-height: 1.6; margin-bottom: 18px; }
.grp { margin-top: 18px; }
.grp > b { display: block; font-size: 11.5px; letter-spacing: .12em; color: var(--dim); font-weight: 500; margin-bottom: 8px; }
.list { display: flex; flex-direction: column; gap: 4px; }
.item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 10px; border-radius: 9px; font-size: 14px; }
.item:hover { background: rgba(255,255,255,.04); }
.item.on { background: rgba(141,139,255,.14); color: #fff; }
.item i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.item small { margin-left: auto; color: var(--dim); font-family: var(--font-mono); font-size: 11.5px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; background: #0D0D12; padding: 3px; border-radius: 9px; border: 1px solid var(--line); }
.seg button { flex: 1; border: 0; background: transparent; padding: 6px 8px; border-radius: 7px; font-size: 12.5px; color: var(--mute); white-space: nowrap; }
.seg button.on { background: #26262F; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.row { display: flex; gap: 8px; margin-top: 18px; }
.btn { flex: 1; height: 38px; border-radius: 9px; border: 0; background: var(--acc); color: #0B0B12; font-weight: 600; font-size: 13.5px; }
.btn.sec { background: #22222B; color: var(--text); }
.btn.sec.on { background: rgba(61,214,140,.16); color: #3DD68C; }
.note { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: #0D0D12; border: 1px solid var(--line); font-size: 12.5px; line-height: 1.7; color: var(--mute); }
.note b { color: var(--text); font-weight: 600; }
.view { position: relative; overflow: hidden; display: grid; place-items: center; }
.frame { position: relative; flex: none; }
.frame > .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.cap-line { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 12px; color: var(--dim); font-family: var(--font-mono); }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100%; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; }
  .list { flex-direction: row; flex-wrap: wrap; }
  .item { width: auto; padding: 7px 10px; font-size: 13px; }
  .item small { display: none; }
  .view { height: 78vh; }
}

/* ============ 画布（与特效页一致：1080 × 1920 竖屏） ============ */
.stage { width: 1080px; height: 1920px; overflow: hidden; --st: 12%; --sb: 40%; --mx: 9%; --fxz: 1; --hy: 40%;
  background-color: #15151C;
  background-image: linear-gradient(45deg, #1C1C25 25%, transparent 25%, transparent 75%, #1C1C25 75%), linear-gradient(45deg, #1C1C25 25%, transparent 25%, transparent 75%, #1C1C25 75%);
  background-size: 64px 64px; background-position: 0 0, 32px 32px; box-shadow: 0 0 0 2px rgba(255,255,255,.14); }
.stage.sc-dark { background: radial-gradient(700px 500px at 70% 20%, rgba(88,120,190,.45), transparent 70%), radial-gradient(600px 500px at 20% 90%, rgba(40,90,80,.45), transparent 70%), linear-gradient(170deg, #1B2233, #0A0C12); }
.stage.sc-light { background: radial-gradient(700px 600px at 30% 20%, #FFE9D6, transparent 70%), radial-gradient(700px 600px at 80% 70%, #D9ECFF, transparent 70%), linear-gradient(170deg, #F6F1EA, #E6EEF6); }
.person { position: absolute; left: 50%; top: 520px; width: 0; height: 0; display: none; }
.stage.sc-dark .person, .stage.sc-light .person { display: block; }
.person::before { content: ""; position: absolute; left: -165px; top: 0; width: 330px; height: 380px; border-radius: 50% 50% 46% 46%; background: #C9A690; }
.person::after { content: ""; position: absolute; left: -380px; top: 420px; width: 760px; height: 900px; border-radius: 380px 380px 0 0; background: #4A5670; }
.stage.sc-dark .person::before { background: #6E5A50; } .stage.sc-dark .person::after { background: #2A3244; }
.safe { position: absolute; left: 0; right: 0; z-index: 50; pointer-events: none; display: flex; align-items: center; justify-content: center; font-size: 22px; letter-spacing: .1em; color: rgba(255,255,255,.5); background: repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 14px, transparent 14px 28px); }
.safe.top { top: 0; height: var(--st); border-bottom: 2px dashed rgba(255,255,255,.25); }
.safe.bot { bottom: 0; height: var(--sb); border-top: 2px dashed rgba(255,255,255,.25); }
.stage.sc-light .safe { color: rgba(0,0,0,.45); background: repeating-linear-gradient(45deg, rgba(0,0,0,.05) 0 14px, transparent 14px 28px); border-color: rgba(0,0,0,.25); }
.stage.no-safe .safe { display: none; }

/* ============ 特效公用 ============ */
.fxroot { color: #EDEDF1; }
.av { border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; overflow: hidden; width: 100%; height: 100%; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.medal { display: inline-flex; align-items: stretch; border-radius: 6px; overflow: hidden; color: var(--mt, #fff); border: 1.5px solid var(--mb); background: var(--mc); font-size: 18px; line-height: 26px; white-space: nowrap; }
.medal span { padding: 0 8px; } .medal b { padding: 0 8px; background: var(--ml); font-family: var(--font-mono); font-weight: 600; }
.glass { background: rgba(14, 15, 24, 0.62); backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.10), 0 20px 60px -20px rgba(0,0,0,.6); }

/* 居中大特效：.hero 是一个没有大小的点（头像中心），各层按这个点摆放 */
.hero { position: absolute; left: 50%; top: var(--hy); width: 0; height: 0; zoom: var(--fxz); animation: heroOut .6s calc(var(--dur) - .6s) ease-in forwards; }
@keyframes heroOut { to { opacity: 0; transform: translateY(-24px) scale(.97); } }
.L { position: absolute; width: var(--w); height: var(--h); left: calc(var(--w) / -2 + var(--x, 0px)); top: calc(var(--h) / -2 + var(--y, 0px)); }
.T { position: absolute; left: -540px; width: 1080px; top: var(--y); display: flex; justify-content: center; }
.L > svg { width: 100%; height: 100%; display: block; overflow: visible; }
.spin { width: 100%; height: 100%; animation: spin var(--spd, 14s) linear infinite; }
.spin.rev { animation-direction: reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes angSpin { to { --ang: 360deg; } }
@keyframes popIn { 0% { opacity: 0; transform: scale(.55); } 60% { opacity: 1; transform: scale(1.06); } 100% { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes growIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
@keyframes upIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes twk { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
@keyframes rise { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(var(--up, -380px)); } }
.star4 { position: absolute; width: var(--s); height: var(--s); left: var(--px); top: var(--py); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); color: var(--sc, #fff); opacity: 0; animation: twk var(--t, 1.8s) var(--d, 0s) ease-in-out infinite; }
.star4 svg { width: 100%; height: 100%; display: block; }
.mote { position: absolute; left: var(--px); top: var(--py); width: var(--s); height: var(--s); border-radius: 50%; background: var(--sc); box-shadow: 0 0 10px var(--sc); opacity: 0; animation: rise var(--t) var(--d) linear forwards; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 20px; font-size: 20px; font-weight: 700; letter-spacing: .12em; color: #fff; white-space: nowrap; }
.chip svg { width: 22px; height: 22px; }
.chip em { font-style: normal; font-weight: 500; opacity: .85; letter-spacing: .04em; padding-left: 10px; margin-left: 2px; border-left: 1.5px solid rgba(255,255,255,.4); }

/* ---------- 舰长：蓝环 · 船舵 ---------- */
.fx-cap { --c1: #D6EEFF; --c2: #6CC2FF; --c3: #2A74F0; --c4: #0B1D45; }
.fx-cap .glow { --w: 600px; --h: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(90,175,255,.42), rgba(90,175,255,.12) 45%, transparent 70%); animation: growIn .7s ease-out both; }
.fx-cap .helm { --w: 400px; --h: 400px; animation: growIn .7s .15s cubic-bezier(.2,.9,.3,1.1) both; }
.fx-cap .helm circle.draw { stroke-dasharray: 830; stroke-dashoffset: 830; animation: draw .8s .1s cubic-bezier(.6,.1,.3,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.shard { --w: 6px; --h: 60px; border-radius: 3px; background: linear-gradient(180deg, transparent, var(--sc, #fff)); opacity: 0; animation: shard .85s var(--d, .15s) cubic-bezier(.1,.7,.3,1) forwards; }
@keyframes shard { 0% { opacity: 0; transform: rotate(var(--r)) translateY(-120px) scaleY(.3); } 25% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--r)) translateY(var(--far, -270px)) scaleY(1); } }
.fx-cap .avL { --w: 204px; --h: 204px; animation: popIn .55s .05s cubic-bezier(.3,1.4,.5,1) both; }
.fx-cap .avL .av { box-shadow: 0 0 0 5px var(--c4), 0 0 0 9px var(--c2), 0 0 60px rgba(90,175,255,.7); }
.fx-cap .tag { animation: popIn .5s .45s cubic-bezier(.3,1.5,.5,1) both; }
.fx-cap .chip { background: linear-gradient(180deg, #7FCBFF, #2A74F0); box-shadow: 0 6px 20px rgba(42,116,240,.55), inset 0 1px 0 rgba(255,255,255,.5); }
.plate { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 44px 18px; border-radius: 22px; max-width: 920px; }
.plate::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none; background: var(--edge); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.plate::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; left: -40%; background: linear-gradient(90deg, transparent, var(--sheen), transparent); transform: skewX(-18deg); animation: sweep 1.3s var(--sw, 1.1s) cubic-bezier(.3,.6,.3,1) forwards; }
@keyframes sweep { to { left: 130%; } }
.plate .nm { font-size: 46px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; max-width: 840px; overflow: hidden; text-overflow: ellipsis; }
.plate .sy { font-size: 24px; color: rgba(255,255,255,.78); letter-spacing: .08em; }
.fx-cap .plate { --edge: linear-gradient(100deg, rgba(140,205,255,.95), rgba(140,205,255,.12) 45%, rgba(140,205,255,.7)); --sheen: rgba(190,225,255,.35);
  clip-path: inset(0 50% 0 50% round 22px); animation: unveil .55s .5s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes unveil { to { clip-path: inset(0 0 0 0 round 22px); } }

/* ---------- 提督：紫曜 · 星轨 ---------- */
.fx-adm { --p1: #F3EBFF; --p2: #CDB0FF; --p3: #9A62F0; --p4: #4B2596; --p5: #1A0F33; }
.fx-adm .rays { --w: 980px; --h: 980px; animation: growIn 1s .15s ease-out both; }
.fx-adm .rays .spin { --spd: 40s; border-radius: 50%; background: repeating-conic-gradient(rgba(205,176,255,.26) 0deg 2.5deg, transparent 2.5deg 11.25deg);
  -webkit-mask: radial-gradient(circle, transparent 22%, #000 30%, rgba(0,0,0,.35) 42%, transparent 56%); mask: radial-gradient(circle, transparent 22%, #000 30%, rgba(0,0,0,.35) 42%, transparent 56%); }
.fx-adm .glow { --w: 660px; --h: 660px; border-radius: 50%; background: radial-gradient(circle, rgba(154,98,240,.5), rgba(154,98,240,.14) 45%, transparent 70%); animation: growIn .8s ease-out both; }
.orb { --w: 520px; --h: 190px; animation: growIn .8s var(--d, .35s) cubic-bezier(.2,.9,.3,1) both; }
.orb > div { width: 100%; height: 100%; border-radius: 50%; border: 2.5px solid transparent; transform: rotate(var(--tilt)); }
.orb.back > div { border-top-color: rgba(205,176,255,.45); }
.orb.front > div { border-bottom-color: rgba(233,220,255,.9); filter: drop-shadow(0 0 6px rgba(205,176,255,.8)); }
.orb .dot { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 0 14px 4px rgba(205,176,255,.9);
  offset-path: path("M 260 95 m -260 0 a 260 95 0 1 0 520 0 a 260 95 0 1 0 -520 0"); offset-rotate: 0deg; animation: orbit var(--ot, 3.2s) linear infinite; }
@keyframes orbit { to { offset-distance: 100%; } }
.fx-adm .ring { --w: 250px; --h: 250px; border-radius: 50%; padding: 7px; background: conic-gradient(from var(--ang), #F3EBFF, #9A62F0, #4B2596, #CDB0FF, #FFFFFF, #9A62F0, #F3EBFF);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  animation: popIn .6s .15s cubic-bezier(.3,1.4,.5,1) both, angSpin 3.5s linear infinite; }
.fx-adm .avL { --w: 222px; --h: 222px; animation: popIn .6s .1s cubic-bezier(.3,1.4,.5,1) both; }
.fx-adm .avL .av { box-shadow: 0 0 0 5px var(--p5), 0 0 70px rgba(154,98,240,.75); }
.fx-adm .emb { --w: 110px; --h: 110px; --y: -178px; animation: drop .75s .6s cubic-bezier(.3,1.5,.5,1) both; }
.fx-adm .emb > div { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #F3EBFF, #9A62F0 58%, #4B2596);
  box-shadow: 0 0 0 4px var(--p5), 0 0 0 7px var(--p2), 0 0 40px rgba(205,176,255,.8); }
.fx-adm .emb svg { width: 58px; height: 58px; color: #fff; }
@keyframes drop { 0% { opacity: 0; transform: translateY(-170px) scale(.7); } 70% { opacity: 1; } 100% { opacity: 1; transform: none; } }
.fx-adm .embw { --w: 300px; --h: 70px; --y: -178px; animation: fadeIn .5s 1.1s both; }
.fx-adm .tagT { animation: upIn .5s .95s ease-out both; }
.fx-adm .chip { height: 36px; font-size: 18px; background: rgba(26,15,51,.75); box-shadow: inset 0 0 0 1.5px rgba(205,176,255,.7); color: var(--p1); }
.ribbon { position: relative; height: 96px; padding: 0 84px; display: flex; align-items: center; justify-content: center; max-width: 960px;
  background: linear-gradient(90deg, #3C1D82, #8750E6 22%, #B489FF 50%, #8750E6 78%, #3C1D82);
  clip-path: polygon(50% 0, 50% 0, 50% 50%, 50% 100%, 50% 100%, 50% 50%); animation: ribbon .7s .8s cubic-bezier(.2,.8,.2,1) forwards;
  filter: drop-shadow(0 10px 30px rgba(75,37,150,.6)); }
@keyframes ribbon { to { clip-path: polygon(0 0, 100% 0, calc(100% - 34px) 50%, 100% 100%, 0 100%, 34px 50%); } }
.ribbon::before { content: ""; position: absolute; inset: 7px 44px; border-top: 1.5px solid rgba(255,255,255,.45); border-bottom: 1.5px solid rgba(255,255,255,.25); }
.ribbon::after { content: ""; position: absolute; top: 0; bottom: 0; width: 26%; left: -30%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); transform: skewX(-20deg); animation: sweep 1.4s 1.6s ease-in-out forwards; }
.ribbon .nm { position: relative; font-size: 50px; font-weight: 800; color: #fff; text-shadow: 0 2px 0 rgba(60,29,130,.8), 0 0 24px rgba(255,255,255,.35); white-space: nowrap; max-width: 780px; overflow: hidden; text-overflow: ellipsis; }
.fx-adm .syT { animation: upIn .6s 1.35s ease-out both; }
.fx-adm .sy { font-size: 26px; letter-spacing: .3em; color: var(--p1); text-shadow: 0 2px 12px rgba(0,0,0,.6); }

/* ---------- 总督：金冕 · 驾临 ---------- */
.fx-gov { --g1: #FFF6DE; --g2: #F7D58B; --g3: #E9B45C; --g4: #B8741F; --g5: #2A1A06; }
.fx-gov .dim { --w: 3200px; --h: 4400px; background: radial-gradient(circle at 50% 50%, rgba(20,12,0,.25) 0, rgba(0,0,0,.66) 34%); opacity: 0;
  animation: fadeIn .6s forwards, fadeOut .7s calc(var(--dur) - .8s) forwards; }
@keyframes fadeOut { to { opacity: 0; } }
.fx-gov .pillar { --w: 300px; --h: 2400px; --y: -1200px; transform-origin: 50% 0; opacity: 0;
  background: linear-gradient(90deg, transparent, rgba(247,213,139,.28) 28%, rgba(255,246,222,.95) 48%, #fff 50%, rgba(255,246,222,.95) 52%, rgba(247,213,139,.28) 72%, transparent);
  -webkit-mask: linear-gradient(180deg, transparent, #000 40%, #000 94%, transparent); mask: linear-gradient(180deg, transparent, #000 40%, #000 94%, transparent);
  animation: pillar 1.5s .2s cubic-bezier(.5,0,.3,1) forwards; }
@keyframes pillar { 0% { opacity: 1; transform: scaleY(0) scaleX(.5); } 40% { opacity: 1; transform: scaleY(1) scaleX(.5); } 55% { opacity: 1; transform: scaleY(1) scaleX(1.2); } 100% { opacity: 0; transform: scaleY(1) scaleX(.1); } }
.fx-gov .flash { --w: 420px; --h: 420px; border-radius: 50%; opacity: 0; background: radial-gradient(circle, #fff, rgba(255,240,200,.8) 25%, rgba(247,213,139,0) 70%); animation: flash .9s .78s ease-out forwards; }
@keyframes flash { 0% { opacity: 0; transform: scale(.2); } 20% { opacity: 1; } 100% { opacity: 0; transform: scale(2.6); } }
.shock { --w: 240px; --h: 240px; border-radius: 50%; border: 3px solid var(--sc, #F7D58B); opacity: 0; animation: shock 1.1s var(--d, .8s) cubic-bezier(.1,.7,.3,1) forwards; }
@keyframes shock { 0% { opacity: 1; transform: scale(.4); } 100% { opacity: 0; transform: scale(4.2); } }
.fx-gov .rays { --w: 1200px; --h: 1200px; animation: growIn 1.2s .9s ease-out both; }
.fx-gov .rays .spin { --spd: 60s; border-radius: 50%; background: repeating-conic-gradient(rgba(247,213,139,.22) 0deg 2deg, transparent 2deg 9deg);
  -webkit-mask: radial-gradient(circle, transparent 18%, #000 26%, rgba(0,0,0,.35) 40%, transparent 56%); mask: radial-gradient(circle, transparent 18%, #000 26%, rgba(0,0,0,.35) 40%, transparent 56%); }
.fx-gov .glow { --w: 760px; --h: 760px; border-radius: 50%; background: radial-gradient(circle, rgba(247,213,139,.55), rgba(233,180,92,.16) 42%, transparent 70%); animation: growIn .9s .85s ease-out both; }
.fx-gov .sigil { --w: 480px; --h: 480px; animation: growIn 1s 1s cubic-bezier(.2,.9,.3,1) both; }
.fx-gov .sigil .spin { --spd: 36s; }
.fx-gov .sigil2 { --w: 330px; --h: 330px; animation: growIn 1s 1.1s cubic-bezier(.2,.9,.3,1) both; }
.fx-gov .sigil2 .spin { --spd: 22s; }
.wing { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.wing.r { transform: translate(84px, -20px); } .wing.l { transform: translate(-84px, -20px) scaleX(-1); }
.wing .wf { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; animation: flap 2.6s 2.3s ease-in-out infinite; }
@keyframes flap { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-4deg); } }
.fe { position: absolute; left: 0; width: var(--L); height: calc(var(--W) * 2); top: calc(var(--W) * -1); transform-origin: 0 50%; transform: rotate(var(--a)); opacity: 0;
  animation: feIn .95s calc(1.2s + var(--d)) cubic-bezier(.2,.9,.25,1.05) forwards; }
.fe svg { width: 100%; height: 100%; display: block; overflow: visible; }
@keyframes feIn { 0% { opacity: 0; transform: rotate(85deg) scaleX(.15); } 35% { opacity: 1; } 100% { opacity: 1; transform: rotate(var(--a)) scaleX(1); } }
.fx-gov .ring { --w: 262px; --h: 262px; border-radius: 50%; padding: 8px; background: conic-gradient(from var(--ang), #FFF6DE, #E9B45C, #8A5214, #F7D58B, #FFFFFF, #E9B45C, #FFF6DE);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  animation: popIn .7s .95s cubic-bezier(.3,1.4,.5,1) both, angSpin 4s linear infinite; }
.fx-gov .avL { --w: 230px; --h: 230px; animation: popIn .7s .9s cubic-bezier(.3,1.4,.5,1) both; }
.fx-gov .avL .av { box-shadow: 0 0 0 6px var(--g5), 0 0 80px rgba(247,213,139,.8); }

.dB .gcrown svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

<script>

}
function medalColors(level) {
  const t = level <= 10 ? '#5762A7' : level <= 20 ? '#C770A4' : level <= 30 ? '#3FB4F6' : level <= 40 ? '#4C7DFF' : level <= 50 ? '#A773F1' : '#EC4F6E';

}

// ---------------- 各个特效 ----------------
const FX = {};

// 舰长：蓝环 · 船舵
FX.cap = (it) => {

};

function countUp(el, to, delay, ms) {
  if (to <= 1) { el.textContent = String(to); return; }
  setTimeout(() => {
    const t0 = performance.now();
    const tick = (now) => {
      const k = Math.min(1, (now - t0) / ms), v = Math.max(1, Math.round(to * (1 - Math.pow(1 - k, 3))));
      if (el.textContent !== String(v)) { el.textContent = String(v); }
      if (k < 1) requestAnimationFrame(tick); else { el.classList.add('bump'); }
    };
    requestAnimationFrame(tick);
  }, delay);
}
FX.gift = (it) => {
  const num = h('b', null, null, '1');
  const card = h('div', 'card', null, h('div', 'sw', null, h('i')), h('div', 'gimg', null, h('div', null, null, giftArt())),

  const root = h('div', 'bl fx-gf cardOut', { '--dur': '4s' }, card);

};
FX.big = (it) => {
  const root = h('div', 'hero fx-bg', { '--dur': '6s' });
  root.append(L('dim', {}), L('aura', {}));
  let dots = '';
  for (let i = 0; i < 90; i++) { const a = i * 4 * Math.PI / 180; dots += `<circle cx="${(Math.cos(a) * 250).toFixed(1)}" cy="${(Math.sin(a) * 250).toFixed(1)}" r="${i % 10 === 0 ? 2.6 : 1.2}" fill="#FFE7D6" opacity="${i % 10 === 0 ? .9 : .45}"/>`; }
  const sp = h('div', 'spin'); sp.append(svg('-260 -260 520 520', `<circle r="232" fill="none" pathLength="1" stroke="rgba(255,231,214,.55)" stroke-width="1.2" style="stroke-dasharray:1;stroke-dashoffset:1;animation:dash 1.8s .3s cubic-bezier(.16,1,.3,1) forwards"/>${dots}`));
  root.append(L('ring1', {}, sp), L('shadow', {}), L('gift', {}, h('div', null, null, giftArt())), L('glint', {}));
  root.append(T('whoT', 196, h('div', 'who glass', null, h('div', 'avw', null, avatar(it.v, 60)), h('span', 'nm', null, it.v.name))));
  root.append(T('giT', 290, h('div', 'gi', null, '送出 ', h('b', null, null, it.gift))));

  const cols = ['#F5B8A2', '#FFD9C8', '#F2D89E', '#E89AAE'];
  for (let i = 0; i < 16; i++) root.append(h('i', 'petal', { '--px': rnd(-480, 480).toFixed(0) + 'px', '--s': rnd(12, 20).toFixed(0) + 'px', '--sc': pick(cols), '--t': rnd(4, 5.5).toFixed(2) + 's', '--d': rnd(.6, 2.2).toFixed(2) + 's', '--sx': rnd(-160, 160).toFixed(0) + 'px', '--rot': rnd(-300, 300).toFixed(0) + 'deg' }));
  return root;
};

const state = { dir: 'A', fx: 'cap', event: 'enter', pos: '40', lv: '25', face: '1', name: 'mid', bg: 'alpha', safe: '1', auto: false };
try { Object.assign(state, JSON.parse(localStorage.getItem('sf-fx4') || '{}')); } catch {}
const save = () => { try { localStorage.setItem('sf-fx4', JSON.stringify(state)); } catch {} };

for (const it of ITEMS) {
  const b = h('button', 'item', null, h('i', null, { background: it.dot }), it.name, h('small', null, null, it.dur));
  b.dataset.id = it.id;
  b.onclick = () => { state.fx = it.id; save(); sync(); play(); };
  $('#l-' + it.group).append(b);
}
document.querySelectorAll('.seg').forEach((seg) => seg.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state[seg.dataset.k] = b.dataset.v; save(); sync(); play();
}));
$('#replay').onclick = play;
$('#auto').onclick = () => { state.auto = !state.auto; save(); sync(); play(); };

function sync() {
  document.querySelectorAll('.item').forEach((b) => b.classList.toggle('on', b.dataset.id === state.fx));
  document.querySelectorAll('.seg').forEach((seg) => seg.querySelectorAll('button').forEach((b) => b.classList.toggle('on', state[seg.dataset.k] === b.dataset.v)));
  const cur = ITEMS.find((i) => i.id === state.fx);
  $('#desc').innerHTML = cur.desc;
  $('#g-event').hidden = !['cap', 'adm', 'gov'].includes(state.fx);
  $('#g-dir').hidden = !['cap', 'adm', 'gov'].includes(state.fx);
  if (['cap', 'adm', 'gov'].includes(state.fx) && DIR_DESC[state.dir]) $('#desc').innerHTML = DIR_DESC[state.dir][state.fx];
  $('#g-pos').hidden = !['cap', 'adm', 'gov', 'big'].includes(state.fx);
  $('#g-lv').hidden = state.fx !== 'fan';
  $('#auto').classList.toggle('on', state.auto);
  $('#auto').textContent = state.auto ? '自动连播中' : '自动连播';
  const st = $('#stage');
  st.className = 'stage' + (state.bg === 'dark' ? ' sc-dark' : state.bg === 'light' ? ' sc-light' : '') + (state.safe === '0' ? ' no-safe' : '');
  st.style.setProperty('--hy', state.pos + '%');
}

let timer = 0;
function play() {
  clearTimeout(timer);
  const st = $('#stage');
  st.querySelectorAll('.fxroot').forEach((n) => n.remove());
  const guard = { cap: 3, adm: 2, gov: 1 }[state.fx] || 0;
  const v = { name: NAMES[state.name], face: state.face === '1' ? FACE : '', guard, isMod: state.fx === 'mod', medal: { name: '星临', level: Number(state.lv) } };
  const big = state.fx === 'big';
  const it = { v, event: guard ? state.event : 'enter', months: state.event === 'open' ? 1 : 3, gift: big ? '星河入梦' : '小花花', count: big ? 1 : 10 };
  const el = guard && GUARD_DIR[state.dir] ? GUARD_DIR[state.dir](it) : FX[state.fx](it);
  el.classList.add('fxroot');
  st.append(el);
  const dur = parseFloat(el.style.getPropertyValue('--dur')) * 1000;
  const cur = ITEMS.find((i) => i.id === state.fx);
  $('#capline').textContent = `${cur.name} · ${cur.dur} · 1080 × 1920 竖屏`;
  timer = setTimeout(() => {
    if (state.auto) { const i = ITEMS.findIndex((x) => x.id === state.fx); state.fx = ITEMS[(i + 1) % ITEMS.length].id; save(); sync(); play(); }
    else el.remove();
  }, dur + 400);
}

function fit() {
  const view = $('#view'), fr = $('#frame');
  const w = view.clientWidth - 32, hh = view.clientHeight - 48;
  const s = Math.min(w / 1080, hh / 1920);
  fr.style.width = 1080 * s + 'px'; fr.style.height = 1920 * s + 'px';
  $('#stage').style.transform = `scale(${s})`;
}
addEventListener('resize', fit);
sync(); fit();
const q = new URLSearchParams(location.search);
if (q.get('fx')) state.fx = q.get('fx');
if (q.get('ev')) state.event = q.get('ev');
if (q.get('bg')) state.bg = q.get('bg');
if (q.get('dir')) state.dir = q.get('dir');
sync();
if (q.has('freeze')) { play(); const t = Number(q.get('freeze')); document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t * 1000 - (a.effect?.getTiming?.().delay ? 0 : 0); }); clearTimeout(timer); }
else play();
</script>
