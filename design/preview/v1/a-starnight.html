<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星临 · 星夜风格后台</title>


<link rel="stylesheet" href="fonts-265ec715.css">
<style>
body{margin:0;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:#070A18}
a{color:#B7ABFF}a:hover{color:#D6CEFF}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(94,230,160,.55)}50%{box-shadow:0 0 0 6px rgba(94,230,160,0)}}
.live-dot{animation:pulse 2s ease-out infinite}
button{font-family:inherit;cursor:pointer}
button:hover{filter:brightness(1.12)}
</style>

<style>html,body{overflow:hidden}#root{transform-origin:0 0}</style>
<script src="dc-lite.js"></script>
</head>
<body>
<div id="root" style="width:1280px;height:800px"></div>
<template id="tpl">

<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; display: flex; background: radial-gradient(1200px 600px at 85% -10%, #231a52 0%, rgba(35,26,82,0) 60%), radial-gradient(900px 500px at -10% 110%, #0f2a4a 0%, rgba(15,42,74,0) 60%), #070A18; color: #E7E9F7;">
  <sc-for list="{{stars}}" as="s" hint-placeholder-count="40">
    <span class="star" style="left: {{s.x}}px; top: {{s.y}}px; width: {{s.r}}px; height: {{s.r}}px; animation-delay: {{s.d}}s;"></span>
  </sc-for>

  <aside style="position: relative; width: 224px; flex-shrink: 0; box-sizing: border-box; padding: 28px 16px; display: flex; flex-direction: column; gap: 28px; border-right: 1px solid rgba(170,160,255,0.12); background: rgba(10,13,32,0.55); backdrop-filter: blur(12px);">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 10px;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F4C874" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l2.4 6.6 6.6 2.4-6.6 2.4L12 20.5l-2.4-6.6L3 11.5l6.6-2.4z"/></svg>
      <div style="display: flex; flex-direction: column;">
        <span style="font-family: 'ZCOOL XiaoWei', serif; font-size: 26px; letter-spacing: 4px; color: #F7F3FF;">星临</span>
        <span style="font-size: 11px; letter-spacing: 2px; color: #8E93BA;">STARFALL</span>
      </div>
    </div>
    <nav style="display: flex; flex-direction: column; gap: 4px;">
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; background: linear-gradient(90deg, rgba(139,124,246,0.28), rgba(139,124,246,0.06)); color: #F4F1FF; text-decoration: none; font-size: 14px; font-weight: 500;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>总览</a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: #A9AED0; text-decoration: none; font-size: 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2 5.5 5.5 2-5.5 2L12 18l-2-5.5L4.5 10.5l5.5-2z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>进场特效</a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: #A9AED0; text-decoration: none; font-size: 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l5-5 5 5 3-3 5 5"/><circle cx="16" cy="8.5" r="1.5"/></svg>素材库</a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: #A9AED0; text-decoration: none; font-size: 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>进场记录</a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: #A9AED0; text-decoration: none; font-size: 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>设置</a>
    </nav>
    <div style="margin-top: auto; padding: 14px; border-radius: 12px; border: 1px solid rgba(170,160,255,0.14); background: rgba(255,255,255,0.03); font-size: 12px; line-height: 1.7; color: #9DA2C6;">OBS 浏览器源地址<br><span style="color: #D9D4FF;">http://[服务器]/overlay</span></div>
  </aside>

  <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">
    <header style="height: 68px; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid rgba(170,160,255,0.10);">
      <span style="font-size: 14px; color: #A9AED0;">直播间 <span style="color: #F0EEFF; font-weight: 500;">[房间号]</span></span>
      <span style="display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: rgba(94,230,160,0.10); border: 1px solid rgba(94,230,160,0.30); font-size: 13px; color: #8FF0BE;"><span class="live-dot" style="width: 8px; height: 8px; border-radius: 50%; background: #5EE6A0;"></span>已连接</span>
      <span style="margin-left: auto; font-size: 13px; color: #A9AED0;">小号：<span style="color: #F0EEFF;">[小号昵称]</span></span>
      <button aria-label="切换亮色模式" style="width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(170,160,255,0.18); background: rgba(255,255,255,0.04); color: #D9D4FF; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
    </header>

    <main style="flex-grow: 1; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 22px;">
      <div style="display: flex; align-items: baseline; gap: 14px;">
        <h1 style="margin: 0; font-family: 'ZCOOL XiaoWei', serif; font-size: 30px; font-weight: 400; letter-spacing: 3px; color: #F7F3FF;">总览</h1>
        <span style="font-size: 12px; color: #8E93BA;">界面均为示例数据</span>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px;">
        <sc-for list="{{kpis}}" as="k" hint-placeholder-count="3">
          <div style="padding: 20px 22px; border-radius: 16px; border: 1px solid rgba(170,160,255,0.14); background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.015)); backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 8px;">
            <span style="font-size: 13px; color: #A9AED0;">{{k.label}}</span>
            <span style="font-size: 32px; font-weight: 700; color: #F7F3FF; letter-spacing: 1px;">{{k.value}}</span>
            <span style="font-size: 12px; color: {{k.noteColor}};">{{k.note}}</span>
          </div>
        </sc-for>
      </div>

      <div style="flex-grow: 1; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; min-height: 0;">
        <section style="padding: 20px 22px; border-radius: 16px; border: 1px solid rgba(170,160,255,0.14); background: rgba(255,255,255,0.03); display: flex; flex-direction: column; gap: 12px;">
          <div style="display: flex; align-items: center;">
            <h2 style="margin: 0; font-size: 15px; font-weight: 500; color: #F0EEFF;">最近进场</h2>
            <a href="#" style="margin-left: auto; font-size: 13px; text-decoration: none;">全部记录</a>
          </div>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
            <div style="display: flex; align-items: center; gap: 12px; padding: 9px 4px; border-bottom: 1px solid rgba(170,160,255,0.07);">
              <span style="width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #0A0E1F; background: {{r.color}};">{{r.initial}}</span>
              <span style="font-size: 14px; color: #EDEBFF; min-width: 110px;">{{r.name}}</span>
              <span style="padding: 2px 10px; border-radius: 999px; font-size: 12px; color: {{r.color}}; border: 1px solid {{r.color}};">{{r.tier}}</span>
              <span style="margin-left: auto; font-size: 12px; color: #9DA2C6;">{{r.effect}}</span>
              <span style="width: 64px; text-align: right; font-size: 12px; color: #8E93BA;">{{r.time}}</span>
            </div>
          </sc-for>
        </section>

        <section style="padding: 20px 22px; border-radius: 16px; border: 1px solid rgba(170,160,255,0.14); background: rgba(255,255,255,0.03); display: flex; flex-direction: column; gap: 14px;">
          <h2 style="margin: 0; font-size: 15px; font-weight: 500; color: #F0EEFF;">测试特效</h2>
          <div style="position: relative; height: 150px; border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, #1b2240, #0d1226); border: 1px dashed rgba(170,160,255,0.22); display: flex; align-items: flex-end; padding: 14px; box-sizing: border-box;">
            <span style="position: absolute; top: 10px; right: 12px; font-size: 11px; color: #7F84AA;">预览</span>
            <div style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-radius: 999px; background: linear-gradient(90deg, rgba(79,168,255,0.92), rgba(79,168,255,0.35)); box-shadow: 0 0 24px rgba(79,168,255,0.55);">
              <span style="width: 34px; height: 34px; border-radius: 50%; background: #E8F3FF; color: #1D4F8C; font-weight: 700; display: flex; align-items: center; justify-content: center;">星</span>
              <span style="font-size: 14px; color: #06182E; font-weight: 500;">欢迎舰长 <b>星河漫步</b> 登船</span>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
            <sc-for list="{{tests}}" as="t" hint-placeholder-count="6">
              <button style="height: 44px; border-radius: 10px; border: 1px solid {{t.color}}; background: rgba(255,255,255,0.03); color: {{t.color}}; font-size: 13px;">{{t.label}}</button>
            </sc-for>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    var stars = [];
    var seed = 7;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (var i = 0; i < 46; i++) {
      stars.push({ x: Math.round(rnd() * 1280), y: Math.round(rnd() * 800), r: rnd() < 0.15 ? 2.5 : 1.3, d: (rnd() * 3.6).toFixed(2) });
    }
    var C = { g: '#F6C66E', t: '#C39BFF', j: '#6DB8FF', f: '#FF9CC4', m: '#5FE0C9', n: '#C9CCE3' };
    return {
      stars: stars,
      kpis: [
        { label: '今日进场（去重）', value: '[—]', note: '示例：较昨日', noteColor: '#8E93BA' },
        { label: '触发特效', value: '[—]', note: '其中大航海 [—] 次', noteColor: '#8E93BA' },
        { label: '播放队列', value: '0', note: '空闲', noteColor: '#8FF0BE' }
      ],
      rows: [
        { name: '星河漫步', initial: '星', tier: '舰长', color: C.j, effect: '舰长特效', time: '21:32:10' },
        { name: '晚风与你', initial: '晚', tier: '粉丝牌 21', color: C.f, effect: '粉丝牌特效', time: '21:31:47' },
        { name: '月下独酌', initial: '月', tier: '提督', color: C.t, effect: '提督特效', time: '21:30:02' },
        { name: '青柠汽水', initial: '青', tier: '房管', color: C.m, effect: '房管特效', time: '21:28:55' },
        { name: '路过的猫', initial: '路', tier: '普通观众', color: C.n, effect: '未触发', time: '21:28:31' },
        { name: '长夜未央', initial: '长', tier: '总督', color: C.g, effect: '总督特效', time: '21:25:18' }
      ],
      tests: [
        { label: '总督', color: C.g }, { label: '提督', color: C.t }, { label: '舰长', color: C.j },
        { label: '房管', color: C.m }, { label: '粉丝牌', color: C.f }, { label: '普通观众', color: C.n }
      ]
    };
  }
}
</script>
<script>
mountDC('tpl', 'logic', 'root');
function fit() {
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 800);
  document.getElementById('root').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();
</script>
</body>
</html>
