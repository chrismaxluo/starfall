<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星临 · 粉白风格后台</title>


<link rel="stylesheet" href="fonts-3e6a9b79.css">
<style>
body{margin:0;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:#F4F5F7}
a{color:#C2356A}a:hover{color:#9E2553}
button{font-family:inherit;cursor:pointer}
button:hover{filter:brightness(0.96)}
</style>

<style>html,body{overflow:hidden}#root{transform-origin:0 0}</style>
<script src="dc-lite.js"></script>
</head>
<body>
<div id="root" style="width:1280px;height:800px"></div>
<template id="tpl">

<div style="width: 1280px; height: 800px; overflow: hidden; display: flex; background: #F4F5F7; color: #18191C;">
  <aside style="width: 224px; flex-shrink: 0; box-sizing: border-box; padding: 28px 16px; display: flex; flex-direction: column; gap: 28px; background: #FFFFFF; border-right: 1px solid #E3E5E7;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 10px;">
      <span style="width: 34px; height: 34px; border-radius: 10px; background: #FB7299; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 2.5l2.4 6.6 6.6 2.4-6.6 2.4L12 20.5l-2.4-6.6L3 11.5l6.6-2.4z"/></svg></span>
      <span style="font-size: 22px; font-weight: 700; letter-spacing: 2px; color: #18191C;">星临</span>
    </div>
    <nav style="display: flex; flex-direction: column; gap: 4px;">
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 8px; background: #FFECF1; color: #C2356A; text-decoration: none; font-size: 14px; font-weight: 500;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>总览</a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 8px; color: #61666D; text-decoration: none; font-size: 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2 5.5 5.5 2-5.5 2L12 18l-2-5.5L4.5 10.5l5.5-2z"/></svg>进场特效</a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 8px; color: #61666D; text-decoration: none; font-size: 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l5-5 5 5 3-3 5 5"/></svg>素材库</a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 8px; color: #61666D; text-decoration: none; font-size: 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>进场记录</a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 8px; color: #61666D; text-decoration: none; font-size: 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8.5"/></svg>设置</a>
    </nav>
    <div style="margin-top: auto; padding: 14px; border-radius: 10px; background: #F6F7F8; font-size: 12px; line-height: 1.7; color: #61666D;">OBS 浏览器源地址<br><span style="color: #18191C;">http://[服务器]/overlay</span></div>
  </aside>

  <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">
    <header style="height: 64px; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; gap: 20px; background: #FFFFFF; border-bottom: 1px solid #E3E5E7;">
      <span style="font-size: 14px; color: #61666D;">直播间 <span style="color: #18191C; font-weight: 500;">[房间号]</span></span>
      <span style="display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; background: #E8F8EF; font-size: 13px; color: #1A7F46;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #2DBE6C;"></span>已连接</span>
      <span style="margin-left: auto; font-size: 13px; color: #61666D;">小号：<span style="color: #18191C;">[小号昵称]</span></span>
      <button aria-label="切换暗色模式" style="width: 40px; height: 40px; border-radius: 8px; border: 1px solid #E3E5E7; background: #FFFFFF; color: #61666D; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </header>

    <main style="flex-grow: 1; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 22px;">
      <div style="display: flex; align-items: baseline; gap: 14px;">
        <h1 style="margin: 0; font-size: 26px; font-weight: 700; color: #18191C;">总览</h1>
        <span style="font-size: 12px; color: #6B7078;">界面均为示例数据</span>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px;">
        <sc-for list="{{kpis}}" as="k" hint-placeholder-count="3">
          <div style="padding: 20px 22px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3E5E7; display: flex; flex-direction: column; gap: 8px;">
            <span style="font-size: 13px; color: #61666D;">{{k.label}}</span>
            <span style="font-size: 32px; font-weight: 700; color: #18191C;">{{k.value}}</span>
            <span style="font-size: 12px; color: #6B7078;">{{k.note}}</span>
          </div>
        </sc-for>
      </div>

      <div style="flex-grow: 1; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; min-height: 0;">
        <section style="padding: 20px 22px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3E5E7; display: flex; flex-direction: column; gap: 12px;">
          <div style="display: flex; align-items: center;">
            <h2 style="margin: 0; font-size: 15px; font-weight: 700;">最近进场</h2>
            <a href="#" style="margin-left: auto; font-size: 13px; text-decoration: none;">全部记录</a>
          </div>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
            <div style="display: flex; align-items: center; gap: 12px; padding: 9px 4px; border-bottom: 1px solid #F1F2F3;">
              <span style="width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #FFFFFF; background: {{r.color}};">{{r.initial}}</span>
              <span style="font-size: 14px; color: #18191C; min-width: 110px;">{{r.name}}</span>
              <span style="padding: 2px 10px; border-radius: 4px; font-size: 12px; color: #FFFFFF; background: {{r.color}};">{{r.tier}}</span>
              <span style="margin-left: auto; font-size: 12px; color: #61666D;">{{r.effect}}</span>
              <span style="width: 64px; text-align: right; font-size: 12px; color: #6B7078;">{{r.time}}</span>
            </div>
          </sc-for>
        </section>

        <section style="padding: 20px 22px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3E5E7; display: flex; flex-direction: column; gap: 14px;">
          <h2 style="margin: 0; font-size: 15px; font-weight: 700;">测试特效</h2>
          <div style="position: relative; height: 150px; border-radius: 10px; overflow: hidden; background: #2A2D33; display: flex; align-items: flex-end; padding: 14px; box-sizing: border-box;">
            <span style="position: absolute; top: 10px; right: 12px; font-size: 11px; color: #B5B9C0;">预览</span>
            <div style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-radius: 999px; background: #2F7FD8;">
              <span style="width: 34px; height: 34px; border-radius: 50%; background: #FFFFFF; color: #2F7FD8; font-weight: 700; display: flex; align-items: center; justify-content: center;">星</span>
              <span style="font-size: 14px; color: #FFFFFF;">欢迎舰长 <b>星河漫步</b> 登船</span>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
            <sc-for list="{{tests}}" as="t" hint-placeholder-count="6">
              <button style="height: 44px; border-radius: 8px; border: none; background: {{t.color}}; color: #FFFFFF; font-size: 13px; font-weight: 500;">{{t.label}}</button>
            </sc-for>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    var C = { g: '#B8660B', t: '#7B4FD6', j: '#2F7FD8', f: '#C2356A', m: '#0E8A7A', n: '#6B7078' };
    return {
      kpis: [
        { label: '今日进场（去重）', value: '[—]', note: '示例：较昨日' },
        { label: '触发特效', value: '[—]', note: '其中大航海 [—] 次' },
        { label: '播放队列', value: '0', note: '空闲' }
      ],
      rows: [
        { name: '星河漫步', initial: '星', tier: '舰长', color: C.j, effect: '舰长特效', time: '21:32:10' },
        { name: '晚风与你', initial: '晚', tier: '粉丝牌 21', color: C.f, effect: '粉丝牌特效', time: '21:31:47' },
        { name: '月下独酌', initial: '月', tier: '提督', color: C.t, effect: '提督特效', time: '21:30:02' },
        { name: '青柠汽水', initial: '青', tier: '房管', color: C.m, effect: '房管特效', time: '21:28:55' },
        { name: '路过的猫', initial: '路', tier: '普通观众', color: C.n, effect: '未触发', time: '21:28:31' },
        { name: '长夜未央', initial: '长', tier: '总督', color: C.g, effect: '总督特效', time: '21:25:18' }
      ],
      tests: [
        { label: '总督', color: C.g }, { label: '提督', color: C.t }, { label: '舰长', color: C.j },
        { label: '房管', color: C.m }, { label: '粉丝牌', color: C.f }, { label: '普通观众', color: C.n }
      ]
    };
  }
}
</script>
<script>
mountDC('tpl', 'logic', 'root');
function fit() {
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 800);
  document.getElementById('root').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();
</script>
</body>
</html>
