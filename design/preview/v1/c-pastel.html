<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星临 · 二次元柔和风格后台</title>


<link rel="stylesheet" href="fonts-f21f8665.css">
<style>
body{margin:0;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:#FFF6FA}
a{color:#7B5CD6}a:hover{color:#5B3FB0}
button{font-family:inherit;cursor:pointer}
button:hover{transform:translateY(-1px)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bob{animation:bob 3s ease-in-out infinite}
</style>

<style>html,body{overflow:hidden}#root{transform-origin:0 0}</style>
<script src="dc-lite.js"></script>
</head>
<body>
<div id="root" style="width:1280px;height:800px"></div>
<template id="tpl">

<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; display: flex; gap: 20px; box-sizing: border-box; padding: 20px; background: #FFF6FA; color: #3D3350;">
  <span class="bob" style="position: absolute; right: 60px; top: 90px; width: 180px; height: 180px; border-radius: 50%; background: #FFE3EE;"></span>
  <span class="bob" style="position: absolute; left: 200px; bottom: -60px; width: 220px; height: 220px; border-radius: 50%; background: #E6F7F1; animation-delay: 1.2s;"></span>

  <aside style="position: relative; width: 210px; flex-shrink: 0; box-sizing: border-box; padding: 26px 14px; display: flex; flex-direction: column; gap: 26px; background: #FFFFFF; border-radius: 28px; box-shadow: 0 10px 30px rgba(185,167,255,0.18);">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 10px;">
      <span style="width: 40px; height: 40px; border-radius: 14px; background: #B9A7FF; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 2.5l2.4 6.6 6.6 2.4-6.6 2.4L12 20.5l-2.4-6.6L3 11.5l6.6-2.4z"/></svg></span>
      <span style="font-family: 'ZCOOL KuaiLe', sans-serif; font-size: 28px; color: #5B3FB0;">星临</span>
    </div>
    <nav style="display: flex; flex-direction: column; gap: 6px;">
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: #EFEAFF; color: #5B3FB0; text-decoration: none; font-size: 14px; font-weight: 700;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="2.5"/><rect x="14" y="3" width="7" height="5" rx="2.5"/><rect x="14" y="12" width="7" height="9" rx="2.5"/><rect x="3" y="16" width="7" height="5" rx="2.5"/></svg>总览</a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; color: #6E6283; text-decoration: none; font-size: 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2 5.5 5.5 2-5.5 2L12 18l-2-5.5L4.5 10.5l5.5-2z"/></svg>进场特效</a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; color: #6E6283; text-decoration: none; font-size: 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M3 15l5-5 5 5 3-3 5 5"/></svg>素材库</a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; color: #6E6283; text-decoration: none; font-size: 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>进场记录</a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; color: #6E6283; text-decoration: none; font-size: 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8.5"/></svg>设置</a>
    </nav>
    <div style="margin-top: auto; padding: 14px; border-radius: 18px; background: #FFF1E9; font-size: 12px; line-height: 1.7; color: #7A5A48;">OBS 浏览器源地址<br><span style="color: #3D3350;">http://[服务器]/overlay</span></div>
  </aside>

  <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; gap: 18px; min-width: 0;">
    <header style="height: 64px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 18px; background: #FFFFFF; border-radius: 22px; box-shadow: 0 8px 24px rgba(185,167,255,0.14);">
      <span style="font-size: 14px; color: #6E6283;">直播间 <span style="color: #3D3350; font-weight: 700;">[房间号]</span></span>
      <span style="display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: #DDF6EC; font-size: 13px; color: #16734F; font-weight: 500;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #34C38F;"></span>已连接</span>
      <span style="margin-left: auto; font-size: 13px; color: #6E6283;">小号：<span style="color: #3D3350;">[小号昵称]</span></span>
      <button aria-label="切换暗色模式" style="width: 44px; height: 44px; border-radius: 16px; border: none; background: #EFEAFF; color: #5B3FB0; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
    </header>

    <div style="display: flex; align-items: baseline; gap: 14px; padding: 0 6px;">
      <h1 style="margin: 0; font-family: 'ZCOOL KuaiLe', sans-serif; font-size: 30px; font-weight: 400; color: #5B3FB0;">总览</h1>
      <span style="font-size: 12px; color: #7A6E8C;">界面均为示例数据</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px;">
      <sc-for list="{{kpis}}" as="k" hint-placeholder-count="3">
        <div style="padding: 20px 22px; border-radius: 24px; background: {{k.bg}}; display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 13px; color: #5E5270;">{{k.label}}</span>
          <span style="font-family: 'ZCOOL KuaiLe', sans-serif; font-size: 34px; color: #3D3350;">{{k.value}}</span>
          <span style="font-size: 12px; color: #5E5270;">{{k.note}}</span>
        </div>
      </sc-for>
    </div>

    <div style="flex-grow: 1; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; min-height: 0;">
      <section style="padding: 20px 22px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(185,167,255,0.14); display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; align-items: center;">
          <h2 style="margin: 0; font-size: 15px; font-weight: 700; color: #3D3350;">最近进场</h2>
          <a href="#" style="margin-left: auto; font-size: 13px; text-decoration: none;">全部记录</a>
        </div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
          <div style="display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 16px; background: #FCFAFF;">
            <span style="width: 34px; height: 34px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #3D3350; background: {{r.bg}};">{{r.initial}}</span>
            <span style="font-size: 14px; color: #3D3350; min-width: 110px;">{{r.name}}</span>
            <span style="padding: 3px 12px; border-radius: 999px; font-size: 12px; color: #3D3350; background: {{r.bg}};">{{r.tier}}</span>
            <span style="margin-left: auto; font-size: 12px; color: #6E6283;">{{r.effect}}</span>
            <span style="width: 64px; text-align: right; font-size: 12px; color: #7A6E8C;">{{r.time}}</span>
          </div>
        </sc-for>
      </section>

      <section style="padding: 20px 22px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(185,167,255,0.14); display: flex; flex-direction: column; gap: 14px;">
        <h2 style="margin: 0; font-size: 15px; font-weight: 700; color: #3D3350;">测试特效</h2>
        <div style="position: relative; height: 140px; border-radius: 20px; overflow: hidden; background: #4A4160; display: flex; align-items: flex-end; padding: 14px; box-sizing: border-box;">
          <span style="position: absolute; top: 10px; right: 14px; font-size: 11px; color: #D8D0EA;">预览</span>
          <div style="display: flex; align-items: center; gap: 10px; padding: 8px 18px 8px 8px; border-radius: 20px; background: #CFE6FF;">
            <span style="width: 34px; height: 34px; border-radius: 12px; background: #FFFFFF; color: #2F5F99; font-weight: 700; display: flex; align-items: center; justify-content: center;">星</span>
            <span style="font-size: 14px; color: #1F3A5C;">欢迎舰长 <b>星河漫步</b> 登船～</span>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
          <sc-for list="{{tests}}" as="t" hint-placeholder-count="6">
            <button style="height: 44px; border-radius: 16px; border: none; background: {{t.bg}}; color: #3D3350; font-size: 13px; font-weight: 500;">{{t.label}}</button>
          </sc-for>
        </div>
      </section>
    </div>
  </div>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    var B = { g: '#FFE2A8', t: '#E4D6FF', j: '#CFE6FF', f: '#FFD3E2', m: '#CDEFE5', n: '#ECE8F2' };
    return {
      kpis: [
        { label: '今日进场（去重）', value: '[—]', note: '示例：较昨日', bg: '#EFEAFF' },
        { label: '触发特效', value: '[—]', note: '其中大航海 [—] 次', bg: '#FFE9F0' },
        { label: '播放队列', value: '0', note: '空闲中～', bg: '#E3F6EF' }
      ],
      rows: [
        { name: '星河漫步', initial: '星', tier: '舰长', bg: B.j, effect: '舰长特效', time: '21:32:10' },
        { name: '晚风与你', initial: '晚', tier: '粉丝牌 21', bg: B.f, effect: '粉丝牌特效', time: '21:31:47' },
        { name: '月下独酌', initial: '月', tier: '提督', bg: B.t, effect: '提督特效', time: '21:30:02' },
        { name: '青柠汽水', initial: '青', tier: '房管', bg: B.m, effect: '房管特效', time: '21:28:55' },
        { name: '路过的猫', initial: '路', tier: '普通观众', bg: B.n, effect: '未触发', time: '21:28:31' },
        { name: '长夜未央', initial: '长', tier: '总督', bg: B.g, effect: '总督特效', time: '21:25:18' }
      ],
      tests: [
        { label: '总督', bg: B.g }, { label: '提督', bg: B.t }, { label: '舰长', bg: B.j },
        { label: '房管', bg: B.m }, { label: '粉丝牌', bg: B.f }, { label: '普通观众', bg: B.n }
      ]
    };
  }
}
</script>
<script>
mountDC('tpl', 'logic', 'root');
function fit() {
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 800);
  document.getElementById('root').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();
</script>
</body>
</html>
