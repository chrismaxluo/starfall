<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星临 · 特效模板身份分级</title>


<link rel="stylesheet" href="fonts-32f6c64d.css">
<style>
body{margin:0;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:#0B0E1C}
@keyframes shine{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(320%) skewX(-20deg)}}
.shine{position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));animation:shine 3.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.tw{position:absolute;animation:twinkle 2.4s ease-in-out infinite}
@keyframes meteor{0%{transform:translate(0,0);opacity:0}10%{opacity:1}70%,100%{transform:translate(-340px,150px);opacity:0}}
.meteor{position:absolute;width:140px;height:2px;border-radius:2px;background:linear-gradient(90deg,#fff,rgba(255,255,255,0));transform-origin:left center;animation:meteor 2.8s ease-in infinite}
@keyframes rays{to{transform:rotate(360deg)}}
.rays{animation:rays 18s linear infinite}
</style>

<style>html,body{overflow:hidden}#root{transform-origin:0 0}</style>
<script src="dc-lite.js"></script>
</head>
<body>
<div id="root" style="width:1280px;height:1100px"></div>
<template id="tpl">

<div style="width: 1280px; height: 1100px; box-sizing: border-box; padding: 36px 40px; display: flex; flex-direction: column; gap: 22px; background: #0B0E1C; color: #E7E9F7;">
  <div style="display: flex; align-items: baseline; gap: 16px;">
    <h1 style="margin: 0; font-family: 'ZCOOL XiaoWei', serif; font-size: 32px; font-weight: 400; letter-spacing: 3px; color: #F7F3FF;">星辰主题 · 身份分级</h1>
    <span style="font-size: 13px; color: #9DA2C6;">颜色沿用 B 站惯例 · 身份越高，特效越华丽 · 每一档都可以换成自定义素材</span>
  </div>

  <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px;">

    <!-- 总督 -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 10px;"><span style="width: 10px; height: 10px; border-radius: 50%; background: #F6C66E;"></span><span style="font-size: 15px; font-weight: 700; color: #FBE3B0;">总督</span><span style="font-size: 12px; color: #9DA2C6;">画面居中 · 金色光芒旋转 · 星光四溅 · 约 6 秒</span></div>
      <div style="position: relative; height: 280px; border-radius: 14px; overflow: hidden; background: linear-gradient(160deg, #1e2a3f, #121626 70%); display: flex; align-items: center; justify-content: center;">
        <span style="position: absolute; left: 14px; top: 10px; font-size: 11px; color: #6E7396;">直播画面</span>
        <div class="rays" style="position: absolute; width: 420px; height: 420px; border-radius: 50%; background: repeating-conic-gradient(rgba(246,198,110,0.22) 0deg 8deg, rgba(246,198,110,0) 8deg 22deg); mask-image: radial-gradient(circle, #000 20%, transparent 68%); -webkit-mask-image: radial-gradient(circle, #000 20%, transparent 68%);"></div>
        <sc-for list="{{goldStars}}" as="s" hint-placeholder-count="10">
          <svg class="tw" style="left: {{s.x}}px; top: {{s.y}}px; animation-delay: {{s.d}}s;" width="{{s.r}}" height="{{s.r}}" viewBox="0 0 24 24" fill="#FFE3A3" aria-hidden="true"><path d="M12 1l2.8 8.2L23 12l-8.2 2.8L12 23l-2.8-8.2L1 12l8.2-2.8z"/></svg>
        </sc-for>
        <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px;">
          <div style="position: relative; width: 84px; height: 84px; border-radius: 50%; padding: 4px; background: conic-gradient(#FFE7A8, #E0463A, #FFD27A, #E0463A, #FFE7A8); box-shadow: 0 0 34px rgba(246,198,110,0.7);">
            <span style="width: 100%; height: 100%; border-radius: 50%; background: #3A1D12; color: #FFE3A3; font-size: 32px; font-weight: 900; display: flex; align-items: center; justify-content: center;">长</span>
            <svg style="position: absolute; left: 50%; top: -26px; transform: translateX(-50%);" width="40" height="30" viewBox="0 0 40 30" fill="#FFD27A" aria-hidden="true"><path d="M2 26L6 6l9 10L20 2l5 14 9-10 4 20z"/></svg>
          </div>
          <div style="position: relative; overflow: hidden; padding: 10px 34px; border-radius: 10px; background: linear-gradient(90deg, #7A1E14, #C23A22 30%, #E8A640 50%, #C23A22 70%, #7A1E14); border: 1px solid #FFD98C; box-shadow: 0 6px 30px rgba(224,70,58,0.55);">
            <span class="shine"></span>
            <span style="position: relative; font-family: 'ZCOOL XiaoWei', serif; font-size: 26px; letter-spacing: 3px; color: #FFF6DC; text-shadow: 0 2px 6px rgba(80,10,0,0.6);">总督 长夜未央 驾临</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 提督 -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 10px;"><span style="width: 10px; height: 10px; border-radius: 50%; background: #C39BFF;"></span><span style="font-size: 15px; font-weight: 700; color: #E2D0FF;">提督</span><span style="font-size: 12px; color: #9DA2C6;">左下大横幅 · 流星划过 · 约 5 秒</span></div>
      <div style="position: relative; height: 280px; border-radius: 14px; overflow: hidden; background: linear-gradient(160deg, #1e2a3f, #121626 70%); display: flex; align-items: flex-end; padding: 26px; box-sizing: border-box;">
        <span style="position: absolute; left: 14px; top: 10px; font-size: 11px; color: #6E7396;">直播画面</span>
        <span class="meteor" style="left: 480px; top: 40px;"></span>
        <span class="meteor" style="left: 560px; top: 90px; animation-delay: 1.3s;"></span>
        <div style="position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px; padding: 12px 34px 12px 12px; border-radius: 16px; background: linear-gradient(90deg, rgba(123,79,214,0.96), rgba(123,79,214,0.55) 70%, rgba(123,79,214,0)); border-left: 3px solid #E2D0FF; box-shadow: 0 0 40px rgba(155,110,255,0.45);">
          <span class="shine"></span>
          <span style="position: relative; width: 60px; height: 60px; border-radius: 50%; background: #EEE4FF; color: #4B2A99; font-size: 24px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #C39BFF;">月</span>
          <div style="position: relative; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 12px; letter-spacing: 3px; color: #E2D0FF;">提督 · ADMIRAL</span>
            <span style="font-size: 22px; font-weight: 700; color: #FFFFFF;">欢迎提督 月下独酌 登船</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 舰长 -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 10px;"><span style="width: 10px; height: 10px; border-radius: 50%; background: #6DB8FF;"></span><span style="font-size: 15px; font-weight: 700; color: #CFE6FF;">舰长</span><span style="font-size: 12px; color: #9DA2C6;">从左侧滑入 · 星光拖尾 · 约 4 秒</span></div>
      <div style="position: relative; height: 240px; border-radius: 14px; overflow: hidden; background: linear-gradient(160deg, #1e2a3f, #121626 70%); display: flex; align-items: flex-end; padding: 26px; box-sizing: border-box;">
        <span style="position: absolute; left: 14px; top: 10px; font-size: 11px; color: #6E7396;">直播画面</span>
        <div style="position: relative; display: flex; align-items: center;">
          <span style="width: 90px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, rgba(109,184,255,0), #9CD0FF); margin-right: -6px;"></span>
          <div style="display: flex; align-items: center; gap: 10px; padding: 8px 22px 8px 8px; border-radius: 999px; background: linear-gradient(90deg, rgba(79,168,255,0.95), rgba(79,168,255,0.4)); box-shadow: 0 0 26px rgba(79,168,255,0.55);">
            <span style="width: 44px; height: 44px; border-radius: 50%; background: #E8F3FF; color: #1D4F8C; font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center;">星</span>
            <span style="font-size: 17px; color: #04172D; font-weight: 500;">欢迎舰长 <b>星河漫步</b> 登船</span>
          </div>
          <svg class="tw" style="position: relative; margin-left: 8px;" width="18" height="18" viewBox="0 0 24 24" fill="#CFE6FF" aria-hidden="true"><path d="M12 1l2.8 8.2L23 12l-8.2 2.8L12 23l-2.8-8.2L1 12l8.2-2.8z"/></svg>
        </div>
      </div>
    </div>

    <!-- 房管 -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 10px;"><span style="width: 10px; height: 10px; border-radius: 50%; background: #5FE0C9;"></span><span style="font-size: 15px; font-weight: 700; color: #C7F4EA;">房管</span><span style="font-size: 12px; color: #9DA2C6;">中等横幅 · 盾牌徽标 · 约 3.5 秒</span></div>
      <div style="position: relative; height: 240px; border-radius: 14px; overflow: hidden; background: linear-gradient(160deg, #1e2a3f, #121626 70%); display: flex; align-items: flex-end; padding: 26px; box-sizing: border-box;">
        <span style="position: absolute; left: 14px; top: 10px; font-size: 11px; color: #6E7396;">直播画面</span>
        <div style="display: flex; align-items: center; gap: 10px; padding: 8px 20px 8px 10px; border-radius: 12px; background: rgba(14,64,58,0.88); border: 1px solid rgba(95,224,201,0.6); box-shadow: 0 0 20px rgba(95,224,201,0.3);">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#5FE0C9" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V5z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
          <span style="font-size: 16px; color: #E6FFF9;">房管 <b>青柠汽水</b> 前来巡场</span>
        </div>
      </div>
    </div>

    <!-- 粉丝牌 -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 10px;"><span style="width: 10px; height: 10px; border-radius: 50%; background: #FF9CC4;"></span><span style="font-size: 15px; font-weight: 700; color: #FFD3E2;">粉丝牌</span><span style="font-size: 12px; color: #9DA2C6;">小横幅 · 牌子颜色跟随等级 · 约 3 秒</span></div>
      <div style="position: relative; height: 200px; border-radius: 14px; overflow: hidden; background: linear-gradient(160deg, #1e2a3f, #121626 70%); display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 22px 26px; box-sizing: border-box;">
        <span style="position: absolute; left: 14px; top: 10px; font-size: 11px; color: #6E7396;">直播画面</span>
        <sc-for list="{{medals}}" as="m" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 8px; padding: 6px 16px 6px 6px; border-radius: 999px; background: rgba(20,22,40,0.78); align-self: flex-start;">
            <span style="display: flex; align-items: center; border-radius: 4px; overflow: hidden; font-size: 12px; border: 1px solid {{m.color}};">
              <span style="padding: 1px 6px; background: {{m.color}}; color: #FFFFFF;">[牌子]</span>
              <span style="padding: 1px 6px; color: {{m.color}}; background: #FFFFFF; font-weight: 700;">{{m.level}}</span>
            </span>
            <span style="font-size: 15px; color: #FFFFFF;">{{m.name}} 来啦</span>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- 普通观众 -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 10px;"><span style="width: 10px; height: 10px; border-radius: 50%; background: #C9CCE3;"></span><span style="font-size: 15px; font-weight: 700; color: #E7E9F7;">普通观众</span><span style="font-size: 12px; color: #9DA2C6;">可选 · 简洁小条 · 约 2 秒 · 默认关闭</span></div>
      <div style="position: relative; height: 200px; border-radius: 14px; overflow: hidden; background: linear-gradient(160deg, #1e2a3f, #121626 70%); display: flex; align-items: flex-end; padding: 22px 26px; box-sizing: border-box;">
        <span style="position: absolute; left: 14px; top: 10px; font-size: 11px; color: #6E7396;">直播画面</span>
        <div style="padding: 6px 16px; border-radius: 8px; background: rgba(255,255,255,0.14); backdrop-filter: blur(6px); font-size: 14px; color: #F1F2FA;">路过的猫 进入直播间</div>
      </div>
    </div>

  </div>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    var goldStars = [];
    var seed = 11;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (var i = 0; i < 12; i++) {
      goldStars.push({ x: Math.round(40 + rnd() * 500), y: Math.round(20 + rnd() * 230), r: Math.round(8 + rnd() * 12), d: (rnd() * 2.4).toFixed(2) });
    }
    return {
      goldStars: goldStars,
      medals: [
        { name: '晚风与你', level: 21, color: '#C2356A' },
        { name: '半糖主义', level: 8, color: '#3E8E7E' }
      ]
    };
  }
}
</script>
<script>
mountDC('tpl', 'logic', 'root');
function fit() {
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 1100);
  document.getElementById('root').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();
</script>
</body>
</html>
