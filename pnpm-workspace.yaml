packages:
  - packages/*
  - apps/*
  # 电脑版的打包工具（Electron 等）只在 GitHub 打包时安装，服务器装依赖时不碰
  - '!apps/desktop'
# better-sqlite3 自带各平台编译好的文件，不用现场编译（和服务器版一样；电脑版的 apps/desktop 不在这里，用 npm 单独装）
allowBuilds:
  better-sqlite3: false
  esbuild: true
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.2'
  - '@vitest/spy@5.0.2'
  - vitest@5.0.2
